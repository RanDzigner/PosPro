                      >
                        <Icon name="camera" className="w-4 h-4" />
                        <span>Scan Tambah Stok (+1)</span>
                      </button>
                      <button onClick={() => setShowRestockModal(true)} className="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-1"><Icon name="plus" className="w-4 h-4" /> Masuk Form</button>
                      <button onClick={() => setShowStockOutModal(true)} className="flex-1 sm:flex-none bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-1"><Icon name="minus" className="w-4 h-4" /> Keluar</button>
                      {currentUser.role !== 'kasir' && (
                        <button onClick={() => { setEditingProduct(null); setProductForm({ sku: '', name: '', costPrice: '', price: '', packPrice: '', stock: '', category: 'Umum', supplier: '' }); setIsProductModalOpen(true); }} className={`flex-1 sm:flex-none px-3.5 py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-1 border ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-white hover:bg-[#282d5e]' : 'bg-slate-800 text-white'}`}><Icon name="plus" className="w-4 h-4" /> + Produk Baru</button>
                      )}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

                      <div key={p.id} className={`p-4 rounded-3xl border shadow-sm flex flex-col justify-between transition-all ${
                        theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200 text-slate-800'
                      }`}>
                        <div>
                          <div className="flex justify-between items-start">
                            <span className={`text-[10px] font-mono px-2 py-0.5 rounded-lg font-bold ${theme === 'dark' ? 'bg-[#21254d] text-slate-300' : 'bg-slate-100 text-slate-600'}`}>{p.sku}</span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${p.stock === 0 ? 'bg-rose-500/20 text-rose-400' : p.stock <= 10 ? 'bg-amber-500/20 text-amber-400' : 'bg-emerald-500/20 text-emerald-400'}`}>Stok: {p.stock}</span>
                          </div>
                          <h4 className="font-extrabold text-sm mt-2.5">{p.name}</h4>
                          <p className="text-xs font-black text-[#00d2d3] mt-1">{formatMoney(p.price)}</p>
                          {currentUser.role === 'owner' && <p className="text-[10px] text-slate-400 mt-0.5">Modal: {formatMoney(p.costPrice)}</p>}
                        </div>
                        {currentUser.role !== 'kasir' && (
                          <div className={`flex justify-end gap-2 mt-3 pt-2.5 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                            <button onClick={() => { setEditingProduct(p); setProductForm(p); setIsProductModalOpen(true); }} className={`p-2 rounded-xl text-xs font-bold flex items-center gap-1 border ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-[#00d2d3]' : 'bg-indigo-50 text-indigo-600'}`}><Icon name="edit" className="w-3.5 h-3.5"/> Edit</button>
                            <button onClick={() => handleDeleteProduct(p.id)} className="p-2 text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-xl text-xs font-bold"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'transactions' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className={`p-4 sm:p-6 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                    <h2 className="text-xl font-black">Riwayat Transaksi Penjualan</h2>
                    <p className={`text-xs mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Daftar seluruh struk dan nota kasir.</p>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {transactions.length === 0 ? (<p className="text-center py-12 text-slate-400 text-xs col-span-full">Belum ada transaksi.</p>) : (
                      transactions.map(trx => (
                        <div key={trx.id} onClick={() => setViewingTransaction(trx)} className={`p-4 rounded-3xl border shadow-sm cursor-pointer transition-all ${
                          theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] hover:border-[#00d2d3]' : 'bg-white border-slate-200 hover:border-indigo-400'
                        }`}>
                          <div className="flex justify-between items-start">
                            <span className="font-extrabold text-xs text-[#00d2d3] bg-cyan-500/10 border border-cyan-500/20 px-2 py-0.5 rounded-lg">{trx.id}</span>
                            <span className="text-[10px] text-slate-400">{trx.date}</span>
                          </div>
                          <p className="text-lg font-black mt-2 text-white">{formatMoney(trx.total)}</p>
                          <div className={`flex justify-between items-center text-xs mt-2 pt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60] text-slate-400' : 'border-slate-100 text-slate-500'}`}>
                            <span>{trx.customerName || 'Umum'}</span>
                            <span className="font-bold">{trx.paymentMethod || 'Cash'}</span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}

              {activeTab === 'customers' && currentUser.role !== 'kasir' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className={`p-4 sm:p-6 rounded-3xl border flex justify-between items-center ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                    <div><h2 className="text-xl font-black">Pelanggan & Piutang</h2><p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Catatan piutang langganan.</p></div>
                    <button onClick={() => { setEditingCustomer(null); setCustomerForm({ name: '', phone: '', address: '' }); setIsCustomerModalOpen(true); }} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-3.5 py-2 rounded-2xl text-xs font-bold">+ Pelanggan</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {customers.map(c => (
                      <div key={c.id} className={`p-4 rounded-3xl border shadow-sm flex flex-col justify-between ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                        <div>
                          <div className="flex justify-between"><h4 className="font-bold text-sm">{c.name}</h4><span className={`text-[10px] px-2 py-0.5 rounded font-mono ${theme === 'dark' ? 'bg-[#21254d] text-slate-300' : 'bg-slate-100'}`}>{c.phone || '-'}</span></div>
                          <div className="mt-3 flex justify-between items-center">
                            <div><p className="text-[10px] text-slate-400">Total Belanja</p><p className="font-bold text-xs">{formatMoney(c.totalSpent)}</p></div>
                            <div className="text-right"><p className="text-[10px] text-amber-400 font-bold">Piutang</p><p className="font-black text-sm text-[#ff8a3d]">{formatMoney(c.debt)}</p></div>
                          </div>
                        </div>
                        <div className={`flex justify-end gap-2 mt-3 pt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                          {c.debt > 0 && <button onClick={() => { setPaymentModalCustomer(c); setCustomerPayAmount(c.debt.toString()); }} className="px-3 py-1 bg-emerald-600 text-white rounded-xl text-xs font-bold">Bayar</button>}
                          <button onClick={() => { setEditingCustomer(c); setCustomerForm(c); setIsCustomerModalOpen(true); }} className={`p-2 rounded-xl ${theme === 'dark' ? 'bg-[#21254d] text-[#00d2d3]' : 'bg-indigo-50 text-indigo-600'}`}><Icon name="edit" className="w-3.5 h-3.5"/></button>
                          <button onClick={() => handleDeleteCustomer(c.id)} className="p-2 text-rose-400 bg-rose-500/10 rounded-xl"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'suppliers' && currentUser.role === 'owner' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className={`p-4 sm:p-6 rounded-3xl border flex justify-between items-center ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                    <div><h2 className="text-xl font-black">Supplier & Hutang Usaha</h2><p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Daftar vendor toko.</p></div>
                    <button onClick={() => { setEditingSupplier(null); setSupplierForm({ name: '', contactPerson: '', phone: '', address: '' }); setIsSupplierModalOpen(true); }} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-3.5 py-2 rounded-2xl text-xs font-bold">+ Supplier</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {suppliers.map(s => (
                      <div key={s.id} className={`p-4 rounded-3xl border shadow-sm flex flex-col justify-between ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                        <div>
                          <div className="flex justify-between"><h4 className="font-bold text-sm">{s.name}</h4><span className="text-[10px] text-slate-400 font-semibold">{s.phone || '-'}</span></div>
                          <div className="mt-3 flex justify-between items-center">
                            <div><p className="text-[10px] text-slate-400">Total Beli</p><p className="font-bold text-xs">{formatMoney(s.totalPurchases)}</p></div>
                            <div className="text-right"><p className="text-[10px] text-amber-400 font-bold">Hutang Toko</p><p className="font-black text-sm text-[#ff8a3d]">{formatMoney(s.debt)}</p></div>
                          </div>
                        </div>
                        <div className={`flex justify-end gap-2 mt-3 pt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                          {s.debt > 0 && <button onClick={() => { setPaymentModalSupplier(s); setSupplierPayAmount(s.debt.toString()); }} className="px-3 py-1 bg-emerald-600 text-white rounded-xl text-xs font-bold">Bayar</button>}
                          <button onClick={() => { setEditingSupplier(s); setSupplierForm(s); setIsSupplierModalOpen(true); }} className={`p-2 rounded-xl ${theme === 'dark' ? 'bg-[#21254d] text-[#00d2d3]' : 'bg-indigo-50 text-indigo-600'}`}><Icon name="edit" className="w-3.5 h-3.5"/></button>
                          <button onClick={() => handleDeleteSupplier(s.id)} className="p-2 text-rose-400 bg-rose-500/10 rounded-xl"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'expenses' && currentUser.role === 'owner' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className={`p-4 sm:p-6 rounded-3xl border flex justify-between items-center ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                    <div><h2 className="text-xl font-black">Catatan Pengeluaran</h2><p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Beban listrik, sewa, operasional toko.</p></div>
                    <button onClick={() => setIsExpenseModalOpen(true)} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-3.5 py-2 rounded-2xl text-xs font-bold">+ Beban</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {expenses.map(e => (
                      <div key={e.id} className={`p-4 rounded-3xl border shadow-sm flex justify-between items-center ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                        <div>
                          <span className="text-[10px] font-bold bg-[#ff4b8b]/20 text-[#ff4b8b] px-2 py-0.5 rounded-lg border border-pink-500/30">{e.category}</span>
                          <p className="font-bold text-xs mt-1">{e.note}</p>
                          <p className="text-[10px] text-slate-400">{e.date}</p>
                        </div>
                        <div className="text-right">
                          <p className="font-black text-sm text-[#ff4b8b]">{formatMoney(e.amount)}</p>
                          <button onClick={() => handleDeleteExpense(e.id)} className="text-[10px] text-slate-400 hover:text-rose-400 mt-1">Hapus</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'settings' && currentUser.role === 'owner' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-4xl mx-auto space-y-4">
                  {/* Status Akun & Cloud */}
                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <h3 className="font-extrabold text-sm flex items-center gap-2">
                      <Icon name="cloud" className="w-4 h-4 text-[#00d2d3]"/> Status Akun & Cloud Database
                    </h3>
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 p-3 rounded-2xl bg-[#21254d]/50 border border-[#2a2f60]">
                      <div>
                        <p className="text-xs font-bold">
                          {authUser ? `Terhubung: ${authUser.email}` : 'Akun Mode Demo (Tamu)'}
                        </p>
                        <p className="text-[11px] text-slate-400">
                          {authUser ? `UID Cloud: ${authUser.uid}` : 'Data tersimpan di memori perangkat ini saja.'}
                        </p>
                      </div>
                      {isDemoMode && (
                        <button onClick={handleGoogleLogin} className="px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-xs rounded-xl shadow-md">
                          Hubungkan Google
                        </button>
                      )}
                    </div>
                  </div>

                  {/* Backup & Restore */}
                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <h3 className="font-extrabold text-sm flex items-center gap-2"><Icon name="hard-drive" className="w-4 h-4 text-[#00d2d3]"/> Cadangan Data (.JSON)</h3>
                    <p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Unduh seluruh data toko ke file cadangan atau pulihkan saat berganti perangkat.</p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
                      <button onClick={handleBackupDatabase} className="py-2.5 px-3 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 text-white shadow-md"><Icon name="download" className="w-4 h-4"/> Download Backup (.json)</button>
                      <label className={`py-2.5 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer text-center border ${
                        theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200' : 'bg-slate-100 border-slate-200'
                      }`}><Icon name="upload" className="w-4 h-4 text-[#00d2d3]"/> Pulihkan Data<input ref={fileInputRef} type="file" accept=".json" onChange={handleRestoreDatabase} className="hidden" /></label>
                    </div>
                  </div>

                  {/* Identitas Toko */}
                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <h3 className={`font-extrabold text-sm border-b pb-2 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>Identitas Toko & Nota</h3>
                    <form onSubmit={(e) => { e.preventDefault(); syncToCloud({ storeSettings }); showToast('Pengaturan toko disimpan!'); }} className="space-y-3 text-xs">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="font-bold text-slate-400 mb-1 block">Nama Toko *</label>
                          <input type="text" required value={storeSettings.name} onChange={(e) => setStoreSettings({...storeSettings, name: e.target.value})} className={`w-full px-3 py-2.5 rounded-xl font-bold border outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                        </div>
                        <div>
                          <label className="font-bold text-slate-400 mb-1 block">Tagline / Slogan</label>
                          <input type="text" value={storeSettings.tagline} onChange={(e) => setStoreSettings({...storeSettings, tagline: e.target.value})} className={`w-full px-3 py-2.5 rounded-xl border outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                        </div>
                      </div>
                      <button type="submit" className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black shadow-md">
                        Simpan Identitas Toko
                      </button>
                    </form>
                  </div>
                </div>
              )}
            </div>

            {/* Bottom Nav Mobile */}
            <div className={`lg:hidden flex items-center justify-around py-2 px-2 z-30 pb-safe shrink-0 shadow-2xl border-t ${
              theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'
            }`}>
              {[
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard', roles: ['owner', 'admin'] },
                { id: 'pos', icon: 'calculator', label: 'Kasir', roles: ['owner', 'admin', 'kasir'] },
                { id: 'inventory', icon: 'package', label: 'Produk', roles: ['owner', 'admin', 'kasir'] },
                { id: 'transactions', icon: 'history', label: 'Riwayat', roles: ['owner', 'admin', 'kasir'] },
                { id: 'reports', icon: 'pie-chart', label: 'Laporan', roles: ['owner'] },
                { id: 'settings', icon: 'settings', label: 'Toko', roles: ['owner'] }
              ].filter(item => item.roles.includes(currentUser.role)).map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex flex-col items-center justify-center py-1 px-3 rounded-2xl transition-all ${
                      isActive 
                        ? (theme === 'dark' ? 'text-[#00d2d3] font-black bg-[#21254d]' : 'text-indigo-600 font-black bg-indigo-50') 
                        : 'text-slate-400 font-semibold'
                    }`}
                  >
                    <Icon name={item.icon} className="w-4 h-4 mb-0.5" />
                    <span className="text-[10px]">{item.label}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {scannerModal.isOpen && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 animate-in fade-in duration-200">
              <div className="bg-[#181b3b] border border-[#2a2f60] rounded-3xl w-full max-w-md overflow-hidden shadow-2xl flex flex-col max-h-[92vh]">
                
                <div className="p-4 border-b border-[#2a2f60] flex justify-between items-center bg-[#181b3b] text-white shrink-0">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-xl bg-cyan-500/20 text-[#00d2d3] flex items-center justify-center border border-cyan-500/30">
                      <Icon name="camera" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-black text-sm">
                        {scannerModal.target === 'pos' ? 'Live Barcode Scanner' : 'Scan Barcode Produk'}
                      </h3>
                      <p className="text-[10px] text-slate-400">Arahkan barcode ke kotak bidik laser</p>
                    </div>
                  </div>
                  
                  <button onClick={closeScannerModal} className="p-2 bg-[#21254d] hover:bg-slate-700 text-slate-400 hover:text-white rounded-xl transition-colors">
                    <Icon name="x" className="w-5 h-5"/>
                  </button>
                </div>

                <div id="scanner-video-container" className="relative bg-black w-full aspect-[3/4] sm:aspect-[4/3] flex items-center justify-center overflow-hidden">
                  <div id="scanner-reader" className="w-full h-full"></div>

                  {scannerModal.isLoadingCamera && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-[#0f1228] text-white z-20 gap-2">
                      <div className="w-9 h-9 border-2 border-cyan-500/30 border-t-[#00d2d3] rounded-full animate-spin"></div>
                      <p className="text-xs text-slate-300 font-bold">Menghubungkan ke kamera HP...</p>
                    </div>
                  )}

                  {isProcessingImage && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-[#0f1228]/95 text-white z-30 gap-2">
                      <div className="w-9 h-9 border-2 border-purple-500/30 border-t-purple-500 rounded-full animate-spin"></div>
                      <p className="text-xs text-purple-300 font-bold">Membaca Barcode dari Foto...</p>
                    </div>
                  )}

                  {!scannerModal.isLoadingCamera && !scannerModal.errorMsg && !isProcessingImage && (
                    <div className="absolute inset-0 pointer-events-none flex items-center justify-center p-6 z-20">
                      <div className="relative w-64 h-44 border-2 border-[#00d2d3]/80 rounded-2xl overflow-hidden shadow-2xl">
                        <div className="scanner-laser-line"></div>
                        <div className="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-[#00d2d3] rounded-tl-lg"></div>
                        <div className="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-[#00d2d3] rounded-tr-lg"></div>
                        <div className="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-[#00d2d3] rounded-bl-lg"></div>
                        <div className="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-[#00d2d3] rounded-br-lg"></div>
                      </div>
                    </div>
                  )}

                  {scannerModal.errorMsg && !isProcessingImage && (
                    <div className="absolute inset-3 bg-[#0f1228]/95 border border-slate-700 rounded-2xl p-4 flex flex-col items-center justify-center text-center z-30 space-y-3">
                      <div className="w-10 h-10 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center">
                        <Icon name="alert-triangle" className="w-5 h-5" />
                      </div>
                      <p className="text-[11px] text-slate-300 max-w-[280px]">{scannerModal.errorMsg}</p>
                      <button 
                        onClick={() => cameraNativeInputRef.current && cameraNativeInputRef.current.click()}
                        className="py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5"
                      >
                        <Icon name="camera" className="w-4 h-4"/> Ambil Foto Barcode
                      </button>
                    </div>
                  )}
                </div>

                <input type="file" accept="image/*" capture="environment" ref={cameraNativeInputRef} onChange={handleImageFileScan} className="hidden" />
                <input type="file" accept="image/*" ref={galleryInputRef} onChange={handleImageFileScan} className="hidden" />

                <div className="p-4 bg-[#181b3b] border-t border-[#2a2f60] text-white space-y-3 shrink-0">
                  <div className="grid grid-cols-2 gap-2">
                    <button 
                      type="button"
                      onClick={() => cameraNativeInputRef.current && cameraNativeInputRef.current.click()}
                      className="py-2.5 px-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-md active:scale-95"
                    >
                      <Icon name="camera" className="w-4 h-4" />
                      <span>Foto Barcode</span>
                    </button>
                    <button 
                      type="button"
                      onClick={() => galleryInputRef.current && galleryInputRef.current.click()}
                      className="py-2.5 px-3 bg-[#21254d] text-slate-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border border-[#2a2f60] active:scale-95"
                    >
                      <Icon name="image" className="w-4 h-4" />
                      <span>Dari Galeri</span>
                    </button>
                  </div>

                  {scannerModal.lastScanned && (
                    <div className="p-2 bg-cyan-950/80 border border-cyan-700 text-[#00d2d3] rounded-xl text-center text-xs font-bold animate-in zoom-in">
                      ⚡ Terdeteksi: <span className="font-mono text-white ml-1">{scannerModal.lastScanned}</span>
                    </div>
                  )}

                  <button onClick={closeScannerModal} className="w-full py-2.5 bg-[#21254d] hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl">
                    Selesai / Tutup Scanner
                  </button>
                </div>

              </div>
            </div>
          )}

                <div className="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto">
                  <Icon name="log-out" className="w-6 h-6"/>
                </div>
                <div>
                  <h3 className="font-black text-base">Konfirmasi Keluar</h3>
                  <p className="text-xs text-slate-400 mt-1">
                    {authUser ? `Keluar dari akun Google (${authUser.email})?` : 'Keluar dari sesi Mode Demo?'}
                  </p>
                </div>
                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button 
                    onClick={() => setShowLogoutConfirm(false)} 
                    className="py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 text-xs font-bold"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={handleExecuteLogout} 
                    className="py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow-md"
                  >
                    Ya, Keluar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Ganti Role */}
          {showRoleSwitcher && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm p-5 space-y-3 border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Ganti Peran Pengguna</h3><button onClick={() => setShowRoleSwitcher(false)}><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <div className="space-y-2 pt-2">
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Owner Toko', role: 'owner', avatar: 'OT' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>👑 Owner (Akses Penuh)</span><Icon name="shield-check" className="w-4 h-4 text-indigo-400"/></button>
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Admin Toko', role: 'admin', avatar: 'AT' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>💼 Admin Toko</span><Icon name="user-check" className="w-4 h-4 text-cyan-400"/></button>
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Kasir POS', role: 'kasir', avatar: 'KP' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>🛒 Kasir (POS)</span><Icon name="lock" className="w-4 h-4 text-slate-400"/></button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Verifikasi Password Role */}
          {authModal.show && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm p-5 space-y-3 border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Verifikasi Password</h3><button onClick={() => setAuthModal({ show: false, targetRole: null, password: '' })}><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleAuthSubmit} className="space-y-3 pt-2">
                  <input type="password" required autoFocus placeholder="Password role..." value={authModal.password} onChange={(e) => setAuthModal({...authModal, password: e.target.value})} className={`w-full p-3.5 border rounded-2xl text-center text-lg font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} />
                  <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl text-xs shadow-md">Masuk</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Nota Struk */}
          {viewingTransaction && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
              }`}>
                <div className={`p-4 border-b flex justify-between items-center ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}>
                  <h3 className="font-black text-sm">Nota Transaksi #{viewingTransaction.id}</h3>
                  <button onClick={() => setViewingTransaction(null)}><Icon name="x" className="w-5 h-5 text-slate-400"/></button>
                </div>
                <div className="p-5 flex-1 overflow-y-auto space-y-3 text-xs">
                  <div className={`text-center pb-2 border-b border-dashed ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-300'}`}>
                    <h4 className="font-black text-sm uppercase">{storeSettings.name}</h4>
                    <p className="text-slate-400 text-[10px]">{storeSettings.address}</p>
                    <p className="text-[10px] text-slate-400 mt-1">{viewingTransaction.date} • Kasir: {viewingTransaction.cashier}</p>
                  </div>
                  <div className={`space-y-1.5 border-b border-dashed pb-2 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-300'}`}>
                    {(viewingTransaction.items || []).map((i, idx) => (
                      <div key={idx} className="flex justify-between"><span>{i.product.name} ({i.qty}x)</span><span className="font-bold">{formatMoney((i.product.price - (Number(i.discountRp)||0)) * i.qty)}</span></div>
                    ))}
                  </div>
                  <div className="space-y-1 pt-1 font-semibold">
                    <div className="flex justify-between"><span>Total:</span><span className="font-black text-sm text-[#00d2d3]">{formatMoney(viewingTransaction.total)}</span></div>
                    <div className="flex justify-between text-[11px] text-slate-400"><span>Bayar ({viewingTransaction.paymentMethod}):</span><span>{formatMoney(viewingTransaction.cash)}</span></div>
                    {viewingTransaction.paymentMethod === 'Cash' && <div className="flex justify-between text-[11px] text-emerald-400"><span>Kembalian:</span><span>{formatMoney(viewingTransaction.change)}</span></div>}
                  </div>
                </div>
                <div className={`p-3 border-t grid grid-cols-2 gap-2 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                  <button onClick={() => {
                    let text = `*NOTA - ${storeSettings.name}*\nNo: ${viewingTransaction.id}\nTotal: ${formatMoney(viewingTransaction.total)}\n\nTerima kasih!`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                  }} className="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-md"><Icon name="message-circle" className="w-4 h-4"/> WhatsApp</button>
                  <button onClick={() => window.print()} className="py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-md"><Icon name="printer" className="w-4 h-4"/> Cetak</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Tambah/Edit Produk */}
          {isProductModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
              }`}>
                <div className={`p-4 border-b flex justify-between items-center ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}><h3 className="font-black text-sm">{editingProduct ? 'Edit Barang' : 'Tambah Barang Baru'}</h3><button onClick={() => setIsProductModalOpen(false)}><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveProduct} className="p-4 overflow-y-auto space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-400 mb-1 block">Kode Barcode / SKU</label>
                    <div className="flex gap-2">
                      <input type="text" placeholder="Scan barcode / ketik SKU" value={productForm.sku} onChange={(e) => setProductForm({...productForm, sku: e.target.value})} className={`flex-1 px-3 py-2.5 border rounded-xl font-mono uppercase outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} />
                      {isMobileDevice && (
                        <button type="button" onClick={() => openScanner('product_form')} className="px-3.5 py-2 bg-gradient-to-r from-[#00d2d3] to-[#6366f1] text-white font-bold rounded-xl flex items-center gap-1 shrink-0"><Icon name="camera" className="w-4 h-4"/><span>Scan</span></button>
                      )}
                    </div>
                  </div>
                  <div><label className="font-bold text-slate-400 mb-1 block">Nama Produk *</label><input type="text" required placeholder="Contoh: Es Teh Manis" value={productForm.name} onChange={(e) => setProductForm({...productForm, name: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="font-bold text-slate-400 mb-1 block">Kategori</label><input type="text" required value={productForm.category} onChange={(e) => setProductForm({...productForm, category: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                    <div><label className="font-bold text-slate-400 mb-1 block">Stok Awal</label><input type="number" required value={productForm.stock} onChange={(e) => setProductForm({...productForm, stock: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="font-bold text-slate-400 mb-1 block">Harga Jual (Rp) *</label><input type="number" required value={productForm.price} onChange={(e) => setProductForm({...productForm, price: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl font-black text-[#00d2d3] outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : ''}`} /></div>
                    <div><label className="font-bold text-slate-400 mb-1 block">Harga Modal (Rp)</label><input type="number" required value={productForm.costPrice} onChange={(e) => setProductForm({...productForm, costPrice: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  </div>
                  <button type="submit" disabled={isSaving} className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black text-xs shadow-lg mt-2">{isSaving ? 'Menyimpan...' : 'Simpan Barang'}</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Restock */}
          {showRestockModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
              }`}>
                <div className="p-4 border-b border-[#2a2f60] flex justify-between items-center bg-emerald-500/20 text-emerald-400"><h3 className="font-black text-sm flex items-center gap-1.5"><Icon name="plus" className="w-4 h-4"/> Stok Masuk & Hutang</h3><button onClick={() => setShowRestockModal(false)}><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveRestock} className="p-4 overflow-y-auto space-y-3 text-xs">
                  <div><label className="font-bold text-slate-400 mb-1 block">Nama Supplier *</label><input type="text" required placeholder="Contoh: Toko Grosir Jaya" value={restockForm.supplier} onChange={(e) => setRestockForm({...restockForm, supplier: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  <div className="space-y-2">
                    <label className="font-bold text-slate-400 block">Daftar Barang Masuk:</label>
                    {restockForm.items.map((it, idx) => (
                      <div key={idx} className="flex gap-2 items-center">
                        <select required value={it.productId} onChange={(e) => updateDynamicList(restockForm, setRestockForm, idx, 'productId', e.target.value)} className={`flex-1 p-2.5 border rounded-xl text-xs outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`}><option value="">-- Pilih Barang --</option>{products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
                        <input type="number" required min="1" placeholder="Qty" value={it.qty} onChange={(e) => updateDynamicList(restockForm, setRestockForm, idx, 'qty', e.target.value)} className={`w-16 p-2.5 border rounded-xl text-center text-xs font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} />
                      </div>
                    ))}
                    <button type="button" onClick={() => addRowDynamicList(restockForm, setRestockForm)} className="text-[11px] font-bold text-[#00d2d3]">+ Tambah Baris</button>
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-black text-xs shadow-md mt-2">Simpan Stok Masuk</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Pengeluaran */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'
              }`}>
                <div className={`p-4 border-b flex justify-between items-center ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}><h3 className="font-black text-sm">Catat Pengeluaran</h3><button onClick={() => setIsExpenseModalOpen(false)}><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveExpense} className="p-4 space-y-3 text-xs">
                  <div><label className="font-bold text-slate-400 mb-1 block">Kategori</label><select value={expenseForm.category} onChange={(e) => setExpenseForm({...expenseForm, category: e.target.value})} className={`w-full p-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`}><option value="Listrik">⚡ Listrik</option><option value="Internet">🌐 Internet</option><option value="Sewa">🏠 Sewa Tempat</option><option value="Gaji">👥 Gaji</option><option value="Lainnya">🏷️ Lainnya</option></select></div>
                  <div><label className="font-bold text-slate-400 mb-1 block">Nominal (Rp) *</label><input type="number" required placeholder="Contoh: 150000" value={expenseForm.amount} onChange={(e) => setExpenseForm({...expenseForm, amount: e.target.value})} className={`w-full p-2.5 border rounded-xl font-black text-[#ff4b8b] outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : ''}`} /></div>
                  <div><label className="font-bold text-slate-400 mb-1 block">Keterangan</label><input type="text" placeholder="Misal: Beli token listrik" value={expenseForm.note} onChange={(e) => setExpenseForm({...expenseForm, note: e.target.value})} className={`w-full p-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black text-xs shadow-md mt-1">Simpan Beban</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

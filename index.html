                    <Icon name="bar-chart-3" className="w-5 h-5 text-[#00d2d3]" />
                    <h3 className="font-extrabold text-sm sm:text-base tracking-tight">Grafik Persediaan Barang</h3>
                  </div>

                  <div className="flex items-center gap-3 text-[10px] font-bold">
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#00d2d3]"></span> Jumlah Awal</span>
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#ff8a3d]"></span> Terjual</span>
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#ff4b8b]"></span> Sisa Akhir</span>
                  </div>
                </div>

                <div className="h-60 sm:h-72 flex items-end gap-2 sm:gap-4 pt-4 border-b border-slate-700/50 pb-2 overflow-x-auto no-scrollbar">
                  {productStats.map((item, idx) => {
                    const hInitial = (item.initial / maxBarVal) * 100;
                    const hSold = (item.sold / maxBarVal) * 100;
                    const hRemaining = (item.remaining / maxBarVal) * 100;

                    return (
                      <div key={idx} className="flex-1 min-w-[50px] flex flex-col items-center h-full justify-end group">
                        <div className="flex items-end justify-center gap-1 w-full h-[82%]">
                          <div className="w-2.5 sm:w-3.5 bg-[#00d2d3] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hInitial}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#00d2d3] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.initial}
                            </span>
                          </div>
                          <div className="w-2.5 sm:w-3.5 bg-[#ff8a3d] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hSold}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#ff8a3d] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.sold}
                            </span>
                          </div>
                          <div className="w-2.5 sm:w-3.5 bg-[#ff4b8b] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hRemaining}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#ff4b8b] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.remaining}
                            </span>
                          </div>
                        </div>

                        <p className={`mt-2 text-[10px] font-bold truncate max-w-[55px] text-center ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>
                          {item.name}
                        </p>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className={`lg:col-span-5 p-4 sm:p-6 rounded-3xl border flex flex-col justify-between transition-all ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-xl' : 'bg-white border-slate-200 shadow-sm text-slate-800'
              }`}>
                <div className="flex items-center gap-2 mb-4">
                  <Icon name="activity" className="w-5 h-5 text-[#00d2d3]" />
                  <h3 className="font-extrabold text-sm sm:text-base tracking-tight">Grafik Barang Laku</h3>
                </div>

                <div className="space-y-3 flex-1 flex flex-col justify-center">
                  {productStats.slice(0, 6).map((item, idx) => (
                    <div key={idx} className="space-y-1">
                      <div className="flex justify-between items-center text-xs">
                        <span className={`font-bold truncate max-w-[140px] ${theme === 'dark' ? 'text-slate-300' : 'text-slate-700'}`}>
                          {item.fullName}
                        </span>
                        <span className="text-[10px] font-bold text-[#00d2d3]">
                          {item.labelLaku} ; {item.soldPercentage}%
                        </span>
                      </div>
                      <div className={`w-full h-3 rounded-full overflow-hidden ${theme === 'dark' ? 'bg-[#21254d]' : 'bg-slate-100'}`}>
                        <div 
                          className="h-full bg-gradient-to-r from-[#00d2d3] to-[#6366f1] rounded-full transition-all duration-700" 
                          style={{ width: `${item.soldPercentage}%` }}
                        ></div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex justify-between text-[9px] font-bold text-slate-400 pt-3 border-t border-slate-700/40 mt-3">
                  <span>0%</span>
                  <span>20%</span>
                  <span>40%</span>
                  <span>60%</span>
                  <span>80%</span>
                  <span>100%</span>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderCartContent = () => {
        const isPaymentExact = paymentMethod !== 'Cash' && paymentMethod !== 'Hutang';
        const isReadyToPay = cart.length > 0 && (isPaymentExact || (paymentMethod === 'Cash' && cashReceived && parseInt(cashReceived) >= grandTotal) || (paymentMethod === 'Hutang')); 

        return (
          <div className={`flex flex-col h-full ${theme === 'dark' ? 'bg-[#181b3b] text-white' : 'bg-white text-slate-800'}`}>
            <div className={`p-4 border-b flex flex-col gap-2.5 shrink-0 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
              <div className="flex justify-between items-center">
                <h2 className="font-extrabold flex items-center gap-2 text-sm sm:text-base">
                  <Icon name="shopping-bag" className="w-5 h-5 text-[#00d2d3]" /> Rincian Pesanan
                </h2>
                <div className="flex items-center gap-2">
                  <span className="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 text-xs font-black px-2.5 py-1 rounded-full">
                    {totalItemCount} Item
                  </span>
                  <button onClick={() => setShowMobileCartDrawer(false)} className="lg:hidden p-1 text-slate-400 hover:text-white bg-slate-800 rounded-lg cursor-pointer">
                    <Icon name="x" className="w-5 h-5"/>
                  </button>
                </div>
              </div>
              <div className={`flex items-center gap-2 rounded-2xl p-2 border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50 border-slate-200'}`}>
                <Icon name="user" className="w-4 h-4 text-slate-400 ml-1 shrink-0" />
                <select 
                  value={selectedCustomerPOS} 
                  onChange={(e) => setSelectedCustomerPOS(e.target.value)} 
                  className="w-full bg-transparent border-none outline-none text-xs sm:text-sm font-semibold cursor-pointer"
                >
                  <option value="" className={theme === 'dark' ? 'bg-[#181b3b] text-white' : ''}>Pelanggan Umum (Walk-in)</option>
                  {customers.map(c => <option key={c.id} value={c.id} className={theme === 'dark' ? 'bg-[#181b3b] text-white' : ''}>{c.name}</option>)}
                </select>
              </div>
            </div>

            <div className={`flex-1 overflow-y-auto p-3 space-y-2.5 ${theme === 'dark' ? 'bg-[#0f1228]/50' : 'bg-slate-50'}`}>
              {cart.length === 0 ? (
                <div className="h-full min-h-[180px] flex flex-col items-center justify-center text-slate-400 opacity-60 space-y-2">
                  <Icon name="shopping-bag" className="w-12 h-12" />
                  <p className="text-xs font-bold">Keranjang masih kosong</p>
                  <p className="text-[10px]">Pilih produk atau scan barcode kemasan barang.</p>
                </div>
              ) : (
                cart.map(item => (
                  <div key={item.product.id} className={`p-3 rounded-2xl border flex flex-col shadow-sm transition-all ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'
                  }`}>
                    <div className="flex justify-between items-start">
                      <div className="flex-1 pr-2">
                        <p className="font-extrabold text-xs sm:text-sm line-clamp-1">{item.product.name}</p>
                        <div className="flex items-center gap-2 mt-0.5">
                          <span className="text-[#00d2d3] font-bold text-xs">{formatMoney(item.product.price)}</span>
                          {item.discountRp > 0 && <span className="text-[10px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded font-bold">- {formatMoney(item.discountRp)}</span>}
                        </div>
                      </div>
                      <button onClick={() => removeFromCart(item.product.id)} className="p-1 text-slate-400 hover:text-rose-400 transition-colors cursor-pointer">
                        <Icon name="trash-2" className="w-4 h-4" />
                      </button>
                    </div>
                    <div className={`flex justify-between items-center pt-2 mt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                      <div className="flex items-center gap-1">
                        <span className="text-[10px] text-slate-400 font-bold">Disc:</span>
                        <input 
                          type="number" 
                          placeholder="Rp" 
                          value={item.discountRp} 
                          onChange={(e) => updateItemDiscount(item.product.id, e.target.value)} 
                          className={`w-16 rounded-lg px-2 py-0.5 text-xs font-medium outline-none border ${
                            theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                          }`} 
                        />
                      </div>
                      <div className={`flex items-center rounded-xl border p-0.5 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-100 border-slate-200'}`}>
                        <button onClick={() => updateQty(item.product.id, -1)} className="w-7 h-7 flex items-center justify-center hover:bg-white/10 rounded-lg font-bold text-sm cursor-pointer">-</button>
                        <span className="w-7 text-center font-bold text-xs">{item.qty}</span>
                        <button onClick={() => updateQty(item.product.id, 1)} className="w-7 h-7 flex items-center justify-center hover:bg-white/10 rounded-lg font-bold text-sm cursor-pointer">+</button>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>

            <div className={`p-4 border-t shadow-2xl space-y-3 shrink-0 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
              <div className="grid grid-cols-2 gap-2">
                <input 
                  type="text" 
                  placeholder="Catatan struk..." 
                  value={transactionNote} 
                  onChange={(e) => setTransactionNote(e.target.value)} 
                  className={`w-full text-xs rounded-xl p-2.5 outline-none border ${
                    theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                  }`} 
                />
                <select 
                  value={paymentMethod} 
                  onChange={(e) => setPaymentMethod(e.target.value)} 
                  className={`w-full text-xs font-bold rounded-xl p-2.5 outline-none border cursor-pointer ${
                    theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                  }`}
                >
                  {storeSettings.paymentMethods.map(m => (<option key={m} value={m} className={theme === 'dark' ? 'bg-[#181b3b]' : ''}>{m}</option>))}
                </select>
              </div>

              <div className="space-y-1.5 text-xs">
                <div className="flex justify-between text-slate-400"><span>Subtotal:</span><span className="font-bold">{formatMoney(subtotal)}</span></div>
                {discount > 0 && (<div className="flex justify-between text-[#00d2d3]"><span>Diskon ({discount}%):</span><span>-{formatMoney(discountAmount)}</span></div>)}
                {Number(storeSettings.taxPercent) > 0 && (<div className="flex justify-between text-slate-400"><span>Pajak ({storeSettings.taxPercent}%):</span><span>{formatMoney(taxAmount)}</span></div>)}
                <div className={`flex justify-between items-baseline pt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                  <span className="font-black text-xs uppercase text-slate-400">Total Tagihan</span>
                  <span className="text-xl sm:text-2xl font-black text-[#00d2d3]">{formatMoney(grandTotal)}</span>
                </div>
              </div>

              {(paymentMethod === 'Cash' || paymentMethod === 'Hutang') && (
                <div className="space-y-2">
                  <div className="flex gap-1.5">
                    <button onClick={() => handleQuickCash(grandTotal)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200 hover:bg-indigo-600' : 'bg-slate-100'}`}>Uang Pas</button>
                    <button onClick={() => handleQuickCash(50000)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200 hover:bg-indigo-600' : 'bg-slate-100'}`}>50k</button>
                    <button onClick={() => handleQuickCash(100000)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200 hover:bg-indigo-600' : 'bg-slate-100'}`}>100k</button>
                  </div>
                  <input 
                    type="number" 
                    placeholder="Nominal Uang Tunai..." 
                    value={cashReceived} 
                    onChange={(e) => setCashReceived(e.target.value)} 
                    className={`w-full px-3 py-2.5 rounded-xl text-sm font-black outline-none border ${
                      theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                    }`} 
                  />
                  {paymentMethod === 'Cash' && cashReceived && parseInt(cashReceived) >= grandTotal && (
                    <div className="flex justify-between items-center bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 p-2.5 rounded-xl text-xs font-bold">
                      <span>KEMBALIAN</span>
                      <span className="text-sm font-black">{formatMoney(parseInt(cashReceived) - grandTotal)}</span>
                    </div>
                  )}
                </div>
              )}

              <button 
                onClick={handleCheckout} 
                disabled={!isReadyToPay} 
                className="w-full py-3.5 bg-gradient-to-r from-[#6366f1] to-[#a855f7] hover:from-indigo-600 hover:to-purple-600 disabled:opacity-40 text-white rounded-2xl font-black text-sm sm:text-base shadow-lg transition-all flex items-center justify-center gap-2 active:scale-98 cursor-pointer"
              >
                <Icon name="check-circle" className="w-5 h-5" /> Selesaikan & Cetak Nota
              </button>
            </div>
          </div>
        );
      };

      const renderPOS = () => {
        return (
          <div className="flex flex-col lg:flex-row h-[calc(100vh-60px)] lg:h-screen overflow-hidden">
            <div className={`flex-1 flex flex-col h-full overflow-hidden border-r ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-200'}`}>
              <div className={`p-3 sm:p-4 border-b flex flex-col gap-2.5 shrink-0 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <div className="flex items-center gap-2">
                  <div className="relative flex-1">
                    <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" />
                    <input 
                      type="text" 
                      placeholder={isMobileDevice ? "Cari nama produk / kode SKU..." : "Cari nama / scan barcode dengan alat scanner..."} 
                      value={searchQuery} 
                      onChange={(e) => setSearchQuery(e.target.value)} 
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && searchQuery.trim()) {
                          const clean = searchQuery.trim().toUpperCase();
                          const found = products.find(p => (p.sku && p.sku.toUpperCase() === clean) || p.id === clean);
                          if (found) {
                            playScanBeep();
                            addToCart(found);
                            showToast(`+1 ${found.name} masuk keranjang!`);
                            setSearchQuery('');
                            e.preventDefault();
                          }
                        }
                      }}
                      className={`w-full pl-9 pr-3 py-2.5 rounded-2xl outline-none text-xs sm:text-sm font-medium border ${
                        theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white focus:border-[#00d2d3]' : 'bg-slate-100 border-transparent focus:bg-white focus:border-indigo-500'
                      }`} 
                    />
                  </div>

                  {isMobileDevice ? (
                    <button 
                      onClick={() => openScanner('pos')} 
                      className="px-3.5 py-2.5 bg-gradient-to-r from-[#00d2d3] to-[#6366f1] text-white rounded-2xl font-black text-xs flex items-center gap-1.5 shadow-md active:scale-95 transition-all shrink-0 cursor-pointer"
                    >
                      <Icon name="camera" className="w-4 h-4" />
                      <span>Scan Kamera</span>
                    </button>
                  ) : (
                    <div className={`hidden lg:flex items-center gap-1.5 px-3.5 py-2.5 rounded-2xl text-xs font-bold border shrink-0 ${
                      theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-300' : 'bg-slate-100 border-slate-200 text-slate-600'
                    }`}>
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      <Icon name="barcode" className="w-4 h-4 text-[#00d2d3]" />
                      <span>Scanner USB/BT Siap</span>
                    </div>
                  )}

                  <button onClick={() => setShowDraftListModal(true)} className={`p-2.5 rounded-2xl border relative cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-[#00d2d3]' : 'bg-indigo-50 text-indigo-600'}`} title="Pesanan Tertahan"><Icon name="folder" className="w-4 h-4" />{draftOrders.length > 0 && <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">{draftOrders.length}</span>}</button>
                </div>

                <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                  {categories.map(c => (
                    <button 
                      key={c} 
                      onClick={() => setSelectedCategory(c)} 
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all shrink-0 cursor-pointer ${
                        selectedCategory === c 
                          ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-md' 
                          : (theme === 'dark' ? 'bg-[#21254d] text-slate-400 hover:text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200')
                      }`}
                    >
                      {c}
                    </button>
                  ))}
                </div>
              </div>

              <div className={`flex-1 overflow-y-auto p-3 sm:p-4 pb-28 lg:pb-4 ${theme === 'dark' ? 'bg-[#0f1228]' : 'bg-slate-50'}`}>
                <div className="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4">
                  {filteredProducts.map(product => {
                    const isOOS = product.stock === 0; const isLow = product.stock > 0 && product.stock <= 10;
                    return (
                      <button 
                        key={product.id} 
                        onClick={() => addToCart(product)} 
                        disabled={isOOS} 
                        className={`relative p-4 sm:p-5 rounded-3xl border text-left flex flex-col justify-between min-h-[135px] sm:min-h-[150px] transition-all active:scale-[0.98] cursor-pointer ${
                          isOOS 
                            ? 'opacity-50 cursor-not-allowed bg-slate-800/40 border-slate-700' 
                            : (theme === 'dark' 
                                ? 'bg-[#181b3b] border-[#2a2f60] hover:border-[#00d2d3] shadow-lg hover:shadow-cyan-500/10' 
                                : 'bg-white border-slate-200 hover:border-indigo-500 shadow-sm')
                        }`}
                      >
                        {isOOS && (
                          <span className="absolute inset-0 bg-[#0f1228]/80 backdrop-blur-[2px] flex items-center justify-center rounded-3xl font-black text-rose-400 text-sm uppercase tracking-wider rotate-6 z-10">
                            Stok Habis
                          </span>
                        )}
                        
                        <div className="flex justify-between items-start gap-2 mb-2">
                          <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-lg truncate max-w-[110px] ${
                            theme === 'dark' ? 'bg-[#21254d] text-indigo-300' : 'bg-indigo-50 text-indigo-700'
                          }`}>
                            {product.category}
                          </span>
                          {!isOOS && (
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg shrink-0 ${
                              isLow ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : (theme === 'dark' ? 'bg-[#21254d] text-slate-300' : 'bg-slate-100 text-slate-600')
                            }`}>
                              Stok: {product.stock}
                            </span>
                          )}
                        </div>

                        <div className="my-auto py-1">
                          <h4 className={`font-extrabold text-sm sm:text-base leading-snug line-clamp-2 ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>
                            {product.name}
                          </h4>
                          <p className="text-[10px] font-mono text-slate-400 mt-0.5">{product.sku}</p>
                        </div>

                        <div className={`pt-2 mt-1 border-t flex items-baseline justify-between ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                          <p className="font-black text-base sm:text-lg text-[#00d2d3] tracking-tight">
                            {formatMoney(product.price)}
                          </p>
                          <span className="text-[10px] text-slate-400 font-bold hidden sm:inline">+ Tambah</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {cart.length > 0 && (
                <div className="lg:hidden fixed bottom-16 left-3 right-3 z-30 animate-in fade-in slide-in-from-bottom duration-200">
                  <div onClick={() => setShowMobileCartDrawer(true)} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-3.5 rounded-3xl shadow-2xl flex items-center justify-between cursor-pointer border border-indigo-400/30">
                    <div className="flex items-center gap-3">
                      <div className="bg-white/20 p-2 rounded-2xl"><Icon name="shopping-cart" className="w-5 h-5"/></div>
                      <div>
                        <p className="text-xs text-indigo-200 font-semibold">{totalItemCount} Item Terpilih</p>
                        <p className="text-base font-black">{formatMoney(grandTotal)}</p>
                      </div>
                    </div>
                    <span className="bg-white text-indigo-900 font-extrabold text-xs px-3.5 py-2 rounded-2xl flex items-center gap-1 shadow-md">Bayar <Icon name="chevron-right" className="w-4 h-4"/></span>
                  </div>
                </div>
              )}
            </div>

            <div className="hidden lg:flex w-[380px] xl:w-[420px] h-full">
              {renderCartContent()}
            </div>

            {showMobileCartDrawer && (
              <div className="lg:hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex flex-col justify-end">
                <div className="rounded-t-3xl h-[88vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-300">
                  {renderCartContent()}
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderReports = () => {
        const now = new Date(); 
        const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startOfWeek = new Date(todayDate); startOfWeek.setDate(todayDate.getDate() - todayDate.getDay());
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1); 
        const startOfYear = new Date(now.getFullYear(), 0, 1);

        const filteredTrx = transactions.filter(t => {
          const tDate = parseDateStr(t.date);
          if (reportPeriod === 'today') return tDate >= todayDate;
          if (reportPeriod === 'week') return tDate >= startOfWeek;
          if (reportPeriod === 'month') return tDate >= startOfMonth;
          if (reportPeriod === 'year') return tDate >= startOfYear;
          return true;
        });

        const omzet = filteredTrx.reduce((sum, t) => sum + (t.total || 0), 0);
        let hpp = 0; 
        filteredTrx.forEach(t => { 
          (t.items || []).forEach(item => { 
            if (item.product) { 
              const prod = products.find(p => p.id === item.product.id); 
              const cost = prod ? prod.costPrice : (item.product.costPrice || 0); 
              hpp += cost * item.qty; 
            } 
          }); 
        });
        const labaKotor = omzet - hpp; 
        const pengeluaranTotal = expenses.reduce((sum, e) => sum + (e.amount || 0), 0); 
        const labaBersih = labaKotor - pengeluaranTotal;

        return (
          <div className="p-3 sm:p-6 pb-28 lg:pb-8 space-y-4 max-w-6xl mx-auto">
            <div className={`p-4 sm:p-6 rounded-3xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${
              theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200 text-slate-800'
            }`}>
              <div>
                <h2 className="text-xl sm:text-2xl font-black tracking-tight">Laporan Keuangan & Profit</h2>
                <p className={`text-xs mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Analisis omzet penjualan, harga pokok modal, dan laba bersih riil ({storeSettings.name}).</p>
              </div>
              <div className={`flex p-1 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-100 border-slate-200'}`}>
                {['today', 'week', 'month', 'year'].map(p => (
                  <button key={p} onClick={() => setReportPeriod(p)} className={`px-3 py-1.5 rounded-xl text-xs font-bold capitalize whitespace-nowrap cursor-pointer ${reportPeriod === p ? 'bg-indigo-600 text-white shadow-md' : (theme === 'dark' ? 'text-slate-400' : 'text-slate-600')}`}>{p === 'today' ? 'Hari Ini' : p === 'week' ? 'Minggu' : p === 'month' ? 'Bulan Ini' : 'Tahun Ini'}</button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Omzet Penjualan</p>
                <p className="text-lg sm:text-xl font-black text-[#00d2d3] mt-1">{formatMoney(omzet)}</p>
              </div>
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Modal Pokok (HPP)</p>
                <p className="text-lg sm:text-xl font-black text-[#ff8a3d] mt-1">{formatMoney(hpp)}</p>
              </div>
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Beban Operasional</p>
                <p className="text-lg sm:text-xl font-black text-[#ff4b8b] mt-1">{formatMoney(pengeluaranTotal)}</p>
              </div>
              <div className={`p-4 rounded-3xl border bg-gradient-to-br from-indigo-900/60 to-purple-900/60 border-indigo-500/40 text-white`}>
                <p className="text-[10px] text-indigo-300 font-bold uppercase">Laba Bersih Toko</p>
                <p className="text-lg sm:text-xl font-black text-emerald-400 mt-1">{formatMoney(labaBersih)}</p>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className={`flex h-screen overflow-hidden font-sans transition-colors duration-300 ${
          theme === 'dark' ? 'bg-[#0f1228] text-slate-100' : 'bg-[#f4f6fb] text-slate-800'
        }`}>
          {toast.show && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 bg-slate-900/95 text-white backdrop-blur-md border border-slate-700 text-xs font-bold animate-in fade-in zoom-in">

              </div>

                  <div className="overflow-hidden">
                    <p className={`font-bold text-xs truncate ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>{currentUser.name}</p>

              </div>
            </div>

                { id: 'inventory', icon: 'package', label: 'Form Stok & Barang', roles: ['owner', 'admin', 'kasir'] },
                { id: 'customers', icon: 'users', label: 'Pelanggan & Piutang', roles: ['owner', 'admin'] },
                { id: 'suppliers', icon: 'truck', label: 'Supplier & Hutang', roles: ['owner'] },
                { id: 'expenses', icon: 'receipt', label: 'Biaya Pengeluaran', roles: ['owner'] },
                { id: 'reports', icon: 'pie-chart', label: 'Laporan Profit', roles: ['owner'] },
                { id: 'transactions', icon: 'history', label: 'Riwayat Nota', roles: ['owner', 'admin', 'kasir'] },
                { id: 'settings', icon: 'settings', label: 'Pengaturan Toko', roles: ['owner'] }

                  <button 
                    key={item.id} 
                    onClick={() => setActiveTab(item.id)}

                      isActive 
                        ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/20 translate-x-1'

                  >
                    <Icon name={item.icon} className={`w-4 h-4 ${isActive ? 'text-[#00d2d3]' : ''}`} />
                    <span>{item.label}</span>
                  </button>

                  theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-amber-300 hover:bg-[#282d5e]' : 'bg-slate-100 border-slate-200 text-slate-700'

                          <div className="flex justify-between items-start">
                            <span className={`text-[10px] font-mono px-2 py-0.5 rounded-lg font-bold ${theme === 'dark' ? 'bg-[#21254d] text-slate-300' : 'bg-slate-100 text-slate-600'}`}>{p.sku}</span>

                          <h4 className="font-extrabold text-sm mt-2.5">{p.name}</h4>

                            <span className="font-extrabold text-xs text-[#00d2d3] bg-cyan-500/10 border border-cyan-500/20 px-2 py-0.5 rounded-lg">{trx.id}</span>

                          <p className="text-lg font-black mt-2 text-white">{formatMoney(trx.total)}</p>

                      </div>
                    ))}
                  </div>
                </div>

                          <div className="flex justify-between"><h4 className="font-bold text-sm">{s.name}</h4><span className="text-[10px] text-slate-400 font-semibold">{s.phone || '-'}</span></div>

                        </div>

                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className={`p-4 sm:p-6 rounded-3xl border flex justify-between items-center ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                    <div><h2 className="text-xl font-black">Catatan Pengeluaran</h2><p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Beban operasional toko.</p></div>
                    <button onClick={() => setIsExpenseModalOpen(true)} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-3.5 py-2 rounded-2xl text-xs font-bold cursor-pointer">+ Beban</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {expenses.map(e => (
                      <div key={e.id} className={`p-4 rounded-3xl border shadow-sm flex justify-between items-center ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                        <div>
                          <span className="text-[10px] font-bold bg-[#ff4b8b]/20 text-[#ff4b8b] px-2 py-0.5 rounded-lg border border-pink-500/30">{e.category}</span>
                          <p className="font-bold text-xs mt-1">{e.note}</p>
                          <p className="text-[10px] text-slate-400">{e.date}</p>
                        </div>
                        <div className="text-right">
                          <p className="font-black text-sm text-[#ff4b8b]">{formatMoney(e.amount)}</p>
                          <button onClick={() => handleDeleteExpense(e.id)} className="text-[10px] text-slate-400 hover:text-rose-400 mt-1 cursor-pointer">Hapus</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-4xl mx-auto space-y-4">
                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <h3 className="font-extrabold text-sm flex items-center gap-2">
                      <Icon name="zap" className="w-4 h-4 text-[#00d2d3]"/> Status Akun & Cloud Sync PC ⇄ HP
                    </h3>
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 p-3.5 rounded-2xl bg-[#21254d]/50 border border-[#2a2f60]">
                      <div>
                        <p className="text-xs font-bold">
                          Akun Toko: {authSession?.name || 'Toko'} {isDemoUser ? '(Mode Demo)' : `(${authSession?.email})`}
                        </p>
                        <p className="text-[11px] text-emerald-400 font-semibold mt-0.5">
                          ✅ Real-Time Sync Aktif • Kode Vault: `{syncKey}`
                        </p>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => {
                          broadcastCurrentState();
                          showToast('⚡ Sinkronisasi data ke seluruh perangkat berhasil!');
                        }} className="px-3.5 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-xs rounded-xl shadow-md cursor-pointer flex items-center gap-1.5">
                          <Icon name="refresh-cw" className="w-3.5 h-3.5"/>
                          <span>Sinkronkan Sekarang</span>
                        </button>
                        <button onClick={handleLogout} className="px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow-md cursor-pointer">
                          Keluar Akun
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <h3 className="font-extrabold text-sm flex items-center gap-2"><Icon name="download" className="w-4 h-4 text-[#00d2d3]"/> Cadangan File Lokal (.JSON)</h3>
                    <p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Unduh seluruh data toko ke file cadangan atau pulihkan data kapan saja.</p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
                      <button onClick={handleBackupDatabase} className="py-2.5 px-3 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 text-white shadow-md cursor-pointer"><Icon name="download" className="w-4 h-4"/> Download Backup (.json)</button>
                      <label className={`py-2.5 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer text-center border ${
                        theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200' : 'bg-slate-100 border-slate-200'
                      }`}><Icon name="upload" className="w-4 h-4 text-[#00d2d3]"/> Pulihkan Data<input ref={fileInputRef} type="file" accept=".json" onChange={handleRestoreDatabase} className="hidden" /></label>
                    </div>
                  </div>

                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <h3 className={`font-extrabold text-sm border-b pb-2 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>Identitas Toko & Nota</h3>
                    <form onSubmit={(e) => { e.preventDefault(); showToast('Pengaturan toko disimpan!'); }} className="space-y-3 text-xs">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="font-bold text-slate-400 mb-1 block">Nama Toko *</label>
                          <input type="text" required value={storeSettings.name} onChange={(e) => setStoreSettings({...storeSettings, name: e.target.value})} className={`w-full px-3 py-2.5 rounded-xl font-bold border outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                        </div>
                        <div>
                          <label className="font-bold text-slate-400 mb-1 block">Tagline / Slogan</label>
                          <input type="text" value={storeSettings.tagline} onChange={(e) => setStoreSettings({...storeSettings, tagline: e.target.value})} className={`w-full px-3 py-2.5 rounded-xl border outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                        </div>
                      </div>
                      <button type="submit" className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black shadow-md cursor-pointer">
                        Simpan Identitas Toko
                      </button>
                    </form>
                  </div>
                </div>
              )}
            </div>
          </div>

          {}
          {scannerModal.isOpen && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 animate-in fade-in duration-200">

                <div className="p-4 border-b border-[#2a2f60] flex justify-between items-center bg-[#181b3b] text-white shrink-0">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-xl bg-cyan-500/20 text-[#00d2d3] flex items-center justify-center border border-cyan-500/30">
                      <Icon name="camera" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-black text-sm">
                        {scannerModal.target === 'pos' ? 'Live Barcode Scanner' : 'Scan Barcode Produk'}
                      </h3>
                      <p className="text-[10px] text-slate-400">Arahkan barcode ke kotak bidik laser</p>
                    </div>
                  </div>
                  <button onClick={closeScannerModal} className="p-2 bg-[#21254d] hover:bg-slate-700 text-slate-400 hover:text-white rounded-xl transition-colors cursor-pointer">
                    <Icon name="x" className="w-5 h-5"/>
                  </button>
                </div>

                <div id="scanner-video-container" className="relative bg-black w-full aspect-[3/4] sm:aspect-[4/3] flex items-center justify-center overflow-hidden">

                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-[#0f1228] text-white z-20 gap-2">
                      <div className="w-9 h-9 border-2 border-cyan-500/30 border-t-[#00d2d3] rounded-full animate-spin"></div>
                      <p className="text-xs text-slate-300 font-bold">Menghubungkan ke kamera HP...</p>
                    </div>
                  )}

                  {!scannerModal.isLoadingCamera && !scannerModal.errorMsg && (
                    <div className="absolute inset-0 pointer-events-none flex items-center justify-center p-6 z-20">
                      <div className="relative w-64 h-44 border-2 border-[#00d2d3]/80 rounded-2xl overflow-hidden shadow-2xl">
                        <div className="scanner-laser-line"></div>
                        <div className="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-[#00d2d3] rounded-tl-lg"></div>
                        <div className="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-[#00d2d3] rounded-tr-lg"></div>
                        <div className="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-[#00d2d3] rounded-bl-lg"></div>
                        <div className="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-[#00d2d3] rounded-br-lg"></div>
                      </div>
                    </div>
                  )}

                  {scannerModal.errorMsg && (
                    <div className="absolute inset-3 bg-[#0f1228]/95 border border-slate-700 rounded-2xl p-4 flex flex-col items-center justify-center text-center z-30 space-y-3">
                      <div className="w-10 h-10 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center">
                        <Icon name="alert-triangle" className="w-5 h-5" />
                      </div>
                      <p className="text-[11px] text-slate-300 max-w-[280px]">{scannerModal.errorMsg}</p>
                    </div>
                  )}
                </div>

                <div className="p-4 bg-[#181b3b] border-t border-[#2a2f60] text-white space-y-3 shrink-0">
                  {scannerModal.lastScanned && (
                    <div className="p-2 bg-cyan-950/80 border border-cyan-700 text-[#00d2d3] rounded-xl text-center text-xs font-bold animate-in zoom-in">
                      ⚡ Terdeteksi: <span className="font-mono text-white ml-1">{scannerModal.lastScanned}</span>
                    </div>
                  )}

                  <button onClick={closeScannerModal} className="w-full py-2.5 bg-[#21254d] hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl cursor-pointer">
                    Selesai / Tutup Scanner
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Ganti Role */}
          {showRoleSwitcher && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm p-5 space-y-3 border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Ganti Peran Pengguna</h3><button onClick={() => setShowRoleSwitcher(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <div className="space-y-2 pt-2">
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Owner Toko', role: 'owner', avatar: 'OT' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>👑 Owner (Akses Penuh)</span><Icon name="shield-check" className="w-4 h-4 text-indigo-400"/></button>
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Admin Toko', role: 'admin', avatar: 'AT' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>💼 Admin Toko</span><Icon name="user-check" className="w-4 h-4 text-cyan-400"/></button>
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Kasir POS', role: 'kasir', avatar: 'KP' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>🛒 Kasir (POS)</span><Icon name="lock" className="w-4 h-4 text-slate-400"/></button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Verifikasi Password Role */}
          {authModal.show && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm p-5 space-y-3 border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Verifikasi Password</h3><button onClick={() => setAuthModal({ show: false, targetRole: null, password: '' })} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleAuthSubmit} className="space-y-3 pt-2">
                  <input type="password" required autoFocus placeholder="Password role..." value={authModal.password} onChange={(e) => setAuthModal({...authModal, password: e.target.value})} className={`w-full p-3.5 border rounded-2xl text-center text-lg font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} />
                  <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl text-xs shadow-md cursor-pointer">Masuk</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Nota Struk */}
          {viewingTransaction && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
              }`}>
                <div className={`p-4 border-b flex justify-between items-center ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}>
                  <h3 className="font-black text-sm">Nota Transaksi #{viewingTransaction.id}</h3>
                  <button onClick={() => setViewingTransaction(null)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button>
                </div>
                <div className="p-5 flex-1 overflow-y-auto space-y-3 text-xs">
                  <div className={`text-center pb-2 border-b border-dashed ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-300'}`}>
                    <h4 className="font-black text-sm uppercase">{storeSettings.name}</h4>
                    <p className="text-slate-400 text-[10px]">{storeSettings.address}</p>
                    <p className="text-[10px] text-slate-400 mt-1">{viewingTransaction.date} • Kasir: {viewingTransaction.cashier}</p>
                  </div>
                  <div className={`space-y-1.5 border-b border-dashed pb-2 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-300'}`}>
                    {(viewingTransaction.items || []).map((i, idx) => (
                      <div key={idx} className="flex justify-between"><span>{i.product.name} ({i.qty}x)</span><span className="font-bold">{formatMoney((i.product.price - (Number(i.discountRp)||0)) * i.qty)}</span></div>
                    ))}
                  </div>
                  <div className="space-y-1 pt-1 font-semibold">
                    <div className="flex justify-between"><span>Total:</span><span className="font-black text-sm text-[#00d2d3]">{formatMoney(viewingTransaction.total)}</span></div>
                    <div className="flex justify-between text-[11px] text-slate-400"><span>Bayar ({viewingTransaction.paymentMethod}):</span><span>{formatMoney(viewingTransaction.cash)}</span></div>
                    {viewingTransaction.paymentMethod === 'Cash' && <div className="flex justify-between text-[11px] text-emerald-400"><span>Kembalian:</span><span>{formatMoney(viewingTransaction.change)}</span></div>}
                  </div>
                </div>
                <div className={`p-3 border-t grid grid-cols-2 gap-2 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                  <button onClick={() => {
                    let text = `*NOTA - ${storeSettings.name}*\nNo: ${viewingTransaction.id}\nTotal: ${formatMoney(viewingTransaction.total)}\n\nTerima kasih!`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                  }} className="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-md cursor-pointer"><Icon name="message-circle" className="w-4 h-4"/> WhatsApp</button>
                  <button onClick={() => window.print()} className="py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-md cursor-pointer"><Icon name="printer" className="w-4 h-4"/> Cetak</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Tambah/Edit Produk */}
          {isProductModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
              }`}>
                <div className={`p-4 border-b flex justify-between items-center ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}><h3 className="font-black text-sm">{editingProduct ? 'Edit Barang' : 'Tambah Barang Baru'}</h3><button onClick={() => setIsProductModalOpen(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveProduct} className="p-4 overflow-y-auto space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-400 mb-1 block">Kode Barcode / SKU</label>
                    <div className="flex gap-2">
                      <input type="text" placeholder="Scan barcode / ketik SKU" value={productForm.sku} onChange={(e) => setProductForm({...productForm, sku: e.target.value})} className={`flex-1 px-3 py-2.5 border rounded-xl font-mono uppercase outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} />
                      {isMobileDevice && (
                        <button type="button" onClick={() => openScanner('product_form')} className="px-3.5 py-2 bg-gradient-to-r from-[#00d2d3] to-[#6366f1] text-white font-bold rounded-xl flex items-center gap-1 shrink-0 cursor-pointer"><Icon name="camera" className="w-4 h-4"/><span>Scan</span></button>
                      )}
                    </div>
                  </div>
                  <div><label className="font-bold text-slate-400 mb-1 block">Nama Produk *</label><input type="text" required placeholder="Contoh: Es Teh Manis" value={productForm.name} onChange={(e) => setProductForm({...productForm, name: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="font-bold text-slate-400 mb-1 block">Kategori</label><input type="text" required value={productForm.category} onChange={(e) => setProductForm({...productForm, category: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                    <div><label className="font-bold text-slate-400 mb-1 block">Stok Awal</label><input type="number" required value={productForm.stock} onChange={(e) => setProductForm({...productForm, stock: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="font-bold text-slate-400 mb-1 block">Harga Jual (Rp) *</label><input type="number" required value={productForm.price} onChange={(e) => setProductForm({...productForm, price: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl font-black text-[#00d2d3] outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : ''}`} /></div>
                    <div><label className="font-bold text-slate-400 mb-1 block">Harga Modal (Rp)</label><input type="number" required value={productForm.costPrice} onChange={(e) => setProductForm({...productForm, costPrice: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  </div>
                  <button type="submit" disabled={isSaving} className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black text-xs shadow-lg mt-2 cursor-pointer">{isSaving ? 'Menyimpan...' : 'Simpan Barang'}</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Restock */}
          {showRestockModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
              }`}>
                <div className="p-4 border-b border-[#2a2f60] flex justify-between items-center bg-emerald-500/20 text-emerald-400"><h3 className="font-black text-sm flex items-center gap-1.5"><Icon name="plus" className="w-4 h-4"/> Stok Masuk & Hutang</h3><button onClick={() => setShowRestockModal(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveRestock} className="p-4 overflow-y-auto space-y-3 text-xs">
                  <div><label className="font-bold text-slate-400 mb-1 block">Nama Supplier *</label><input type="text" required placeholder="Contoh: Toko Grosir Jaya" value={restockForm.supplier} onChange={(e) => setRestockForm({...restockForm, supplier: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  <div className="space-y-2">
                    <label className="font-bold text-slate-400 block">Daftar Barang Masuk:</label>
                    {restockForm.items.map((it, idx) => (
                      <div key={idx} className="flex gap-2 items-center">
                        <select required value={it.productId} onChange={(e) => updateDynamicList(restockForm, setRestockForm, idx, 'productId', e.target.value)} className={`flex-1 p-2.5 border rounded-xl text-xs outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`}><option value="">-- Pilih Barang --</option>{products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
                        <input type="number" required min="1" placeholder="Qty" value={it.qty} onChange={(e) => updateDynamicList(restockForm, setRestockForm, idx, 'qty', e.target.value)} className={`w-16 p-2.5 border rounded-xl text-center text-xs font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} />
                      </div>
                    ))}
                    <button type="button" onClick={() => addRowDynamicList(restockForm, setRestockForm)} className="text-[11px] font-bold text-[#00d2d3] cursor-pointer">+ Tambah Baris</button>
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-black text-xs shadow-md mt-2 cursor-pointer">Simpan Stok Masuk</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Pengeluaran */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'
              }`}>
                <div className={`p-4 border-b flex justify-between items-center ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}><h3 className="font-black text-sm">Catat Pengeluaran</h3><button onClick={() => setIsExpenseModalOpen(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveExpense} className="p-4 space-y-3 text-xs">
                  <div><label className="font-bold text-slate-400 mb-1 block">Kategori</label><select value={expenseForm.category} onChange={(e) => setExpenseForm({...expenseForm, category: e.target.value})} className={`w-full p-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`}><option value="Listrik">⚡ Listrik</option><option value="Internet">🌐 Internet</option><option value="Sewa">🏠 Sewa Tempat</option><option value="Gaji">👥 Gaji</option><option value="Lainnya">🏷️ Lainnya</option></select></div>
                  <div><label className="font-bold text-slate-400 mb-1 block">Nominal (Rp) *</label><input type="number" required placeholder="Contoh: 150000" value={expenseForm.amount} onChange={(e) => setExpenseForm({...expenseForm, amount: e.target.value})} className={`w-full p-2.5 border rounded-xl font-black text-[#ff4b8b] outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : ''}`} /></div>
                  <div><label className="font-bold text-slate-400 mb-1 block">Keterangan</label><input type="text" placeholder="Misal: Beli token listrik" value={expenseForm.note} onChange={(e) => setExpenseForm({...expenseForm, note: e.target.value})} className={`w-full p-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black text-xs shadow-md mt-1 cursor-pointer">Simpan Beban</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

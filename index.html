                      <div className="flex items-center gap-1">
                        <span className="text-[10px] text-slate-400 font-bold">Disc:</span>
                        <input type="number" placeholder="Rp" value={item.discountRp} onChange={(e) => updateItemDiscount(item.product.id, e.target.value)} className="w-16 bg-slate-50 border border-slate-200 rounded px-1.5 py-0.5 text-xs font-medium outline-none focus:bg-white" />
                      </div>
                      <div className="flex items-center bg-slate-100 rounded-lg border border-slate-200 p-0.5">
                        <button onClick={() => updateQty(item.product.id, -1)} className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-white rounded-md font-bold text-sm">-</button>
                        <span className="w-6 text-center font-bold text-xs text-slate-800">{item.qty}</span>
                        <button onClick={() => updateQty(item.product.id, 1)} className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-white rounded-md font-bold text-sm">+</button>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>

            <div className="p-3 sm:p-4 bg-white border-t border-slate-200 shadow-lg space-y-2.5 shrink-0">
              <div className="grid grid-cols-2 gap-2">
                <input type="text" placeholder="Catatan struk..." value={transactionNote} onChange={(e) => setTransactionNote(e.target.value)} className="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 outline-none focus:bg-white" />
                <select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)} className="w-full text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded-lg p-2 outline-none cursor-pointer">
                  {storeSettings.paymentMethods.map(m => (<option key={m} value={m}>{m}</option>))}
                </select>
              </div>

              <div className="space-y-1 text-xs">
                <div className="flex justify-between text-slate-500"><span>Subtotal:</span><span className="font-semibold text-slate-800">{formatMoney(subtotal)}</span></div>
                {discount > 0 && (<div className="flex justify-between text-emerald-600"><span>Diskon Trx ({discount}%):</span><span>-{formatMoney(discountAmount)}</span></div>)}
                {Number(storeSettings.taxPercent) > 0 && (<div className="flex justify-between text-slate-500"><span>Pajak ({storeSettings.taxPercent}%):</span><span>{formatMoney(taxAmount)}</span></div>)}
                <div className="flex justify-between items-baseline pt-1 border-t border-slate-100"><span className="font-black text-slate-700 text-xs uppercase">Total Tagihan</span><span className="text-xl sm:text-2xl font-black text-indigo-600">{formatMoney(grandTotal)}</span></div>
              </div>

              {(paymentMethod === 'Cash' || paymentMethod === 'Hutang') && (
                <div className="space-y-1.5">
                  <div className="flex gap-1.5">
                    <button onClick={() => handleQuickCash(grandTotal)} className="flex-1 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 active:bg-indigo-50">Uang Pas</button>
                    <button onClick={() => handleQuickCash(50000)} className="flex-1 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 active:bg-indigo-50">50k</button>
                    <button onClick={() => handleQuickCash(100000)} className="flex-1 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 active:bg-indigo-50">100k</button>
                  </div>
                  <input type="number" placeholder="Nominal Uang Tunai Diterima..." value={cashReceived} onChange={(e) => setCashReceived(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 outline-none focus:bg-white" />
                  {paymentMethod === 'Cash' && cashReceived && parseInt(cashReceived) >= grandTotal && (
                    <div className="flex justify-between items-center bg-emerald-50 text-emerald-800 p-2 rounded-lg text-xs font-bold">
                      <span>KEMBALIAN</span>
                      <span className="text-sm font-black">{formatMoney(parseInt(cashReceived) - grandTotal)}</span>
                    </div>
                  )}
                </div>
              )}

              <button onClick={handleCheckout} disabled={!isReadyToPay} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-xl font-bold text-sm sm:text-base shadow-md transition-all flex items-center justify-center gap-2 active:scale-95">
                <Icon name="check-circle" className="w-5 h-5" /> Selesaikan & Cetak Nota
              </button>
            </div>
          </div>
        );
      };

      const renderPOS = () => {
        return (
          <div className="flex flex-col lg:flex-row h-[calc(100vh-60px)] lg:h-screen overflow-hidden bg-slate-100">
            <div className="flex-1 flex flex-col h-full overflow-hidden border-r border-slate-200">
              <div className="p-3 bg-white border-b border-slate-200 flex flex-col gap-2 shrink-0">
                <div className="flex items-center gap-2">
                  <div className="relative flex-1">
                    <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" />
                    <input 
                      type="text" 
                      placeholder={isMobileDevice ? "Cari nama produk / kode SKU..." : "Cari nama / scan barcode dengan alat scanner..."} 
                      value={searchQuery} 
                      onChange={(e) => setSearchQuery(e.target.value)} 
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && searchQuery.trim()) {
                          const clean = searchQuery.trim().toUpperCase();
                          const found = products.find(p => (p.sku && p.sku.toUpperCase() === clean) || p.id === clean);
                          if (found) {
                            playScanBeep();
                            addToCart(found);
                            showToast(`+1 ${found.name} masuk keranjang!`);
                            setSearchQuery('');
                            e.preventDefault();
                          }
                        }
                      }}
                      className="w-full pl-9 pr-3 py-2 bg-slate-100 border border-transparent focus:bg-white focus:border-indigo-500 rounded-xl outline-none text-xs sm:text-sm font-medium" 
                    />
                  </div>

                  {/* Jika di HP: Tampilkan tombol Scan Kamera. Jika di PC: Tampilkan Indikator Alat Scanner Aktif */}
                  {isMobileDevice ? (
                    <button 
                      onClick={() => openScanner('pos')} 
                      className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white rounded-xl font-bold text-xs flex items-center gap-1.5 shadow-sm active:scale-95 transition-all shrink-0"
                      title="Buka Kamera HP untuk Scan Barcode"
                    >
                      <Icon name="camera" className="w-4 h-4 text-white" />
                      <span>Scan Kamera</span>
                    </button>
                  ) : (
                    <div className="hidden lg:flex items-center gap-1.5 px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-slate-600 text-xs font-bold shrink-0" title="Alat Scanner Barcode USB / Bluetooth otomatis aktif dan siap digunakan">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                      <Icon name="barcode" className="w-4 h-4 text-slate-700" />
                      <span>Scanner USB/BT Siap</span>
                    </div>
                  )}

                  <button onClick={() => setShowDraftSaveModal(true)} disabled={cart.length === 0} className="p-2 bg-slate-100 border border-slate-200 rounded-xl text-slate-600 disabled:opacity-40" title="Tahan Pesanan"><Icon name="save" className="w-4 h-4" /></button>
                  <button onClick={() => setShowDraftListModal(true)} className="p-2 bg-indigo-50 border border-indigo-100 rounded-xl text-indigo-600 relative" title="Buka Pesanan Tertahan"><Icon name="folder" className="w-4 h-4" />{draftOrders.length > 0 && <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">{draftOrders.length}</span>}</button>
                </div>

                <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                  {categories.map(c => (
                    <button key={c} onClick={() => setSelectedCategory(c)} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-colors shrink-0 ${selectedCategory === c ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{c}</button>
                  ))}
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-3 sm:p-4 pb-28 lg:pb-4 bg-slate-50">
                <div className="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4">
                  {filteredProducts.map(product => {
                    const isOOS = product.stock === 0; const isLow = product.stock > 0 && product.stock <= 10;
                    return (
                      <button 
                        key={product.id} 
                        onClick={() => addToCart(product)} 
                        disabled={isOOS} 
                        className={`relative p-4 sm:p-5 rounded-2xl border text-left flex flex-col justify-between min-h-[130px] sm:min-h-[145px] transition-all active:scale-[0.98] ${
                          isOOS 
                            ? 'bg-slate-100 border-slate-200 opacity-60 cursor-not-allowed' 
                            : 'bg-white border-slate-200 hover:border-indigo-500 hover:shadow-md shadow-sm'
                        }`}
                      >
                        {isOOS && (
                          <span className="absolute inset-0 bg-white/75 backdrop-blur-[1px] flex items-center justify-center rounded-2xl font-black text-rose-600 text-sm uppercase tracking-wider rotate-6 z-10">
                            Stok Habis
                          </span>
                        )}
                        
                        <div className="flex justify-between items-start gap-2 mb-2">
                          <span className="text-[11px] font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-md truncate max-w-[120px]">
                            {product.category}
                          </span>
                          {!isOOS && (
                            <span className={`text-[11px] font-bold px-2 py-0.5 rounded-md shrink-0 ${
                              isLow ? 'bg-amber-100 text-amber-700 font-black' : 'bg-slate-100 text-slate-600'
                            }`}>
                              Stok: {product.stock}
                            </span>
                          )}
                        </div>

                        <div className="my-auto py-1">
                          <h4 className="font-extrabold text-sm sm:text-base leading-snug text-slate-800 line-clamp-2">
                            {product.name}
                          </h4>
                          <p className="text-[10px] font-mono text-slate-400 mt-0.5">{product.sku}</p>
                        </div>

                        <div className="pt-2 mt-1 border-t border-slate-100 flex items-baseline justify-between">
                          <p className="font-black text-base sm:text-lg text-indigo-600 tracking-tight">
                            {formatMoney(product.price)}
                          </p>
                          <span className="text-[10px] text-slate-400 font-bold hidden sm:inline">+ Tambah</span>
                        </div>
                      </button>
                    )
                  })}
                </div>
              </div>

              {/* Floating Bottom Cart Bar di HP */}
              {cart.length > 0 && (
                <div className="lg:hidden fixed bottom-16 left-3 right-3 z-30 animate-in fade-in slide-in-from-bottom duration-200">
                  <div onClick={() => setShowMobileCartDrawer(true)} className="bg-indigo-600 text-white p-3.5 rounded-2xl shadow-xl flex items-center justify-between cursor-pointer border border-indigo-400">
                    <div className="flex items-center gap-3">
                      <div className="bg-white/20 p-2 rounded-xl"><Icon name="shopping-cart" className="w-5 h-5"/></div>
                      <div>
                        <p className="text-xs text-indigo-200 font-semibold">{totalItemCount} Item Terpilih</p>
                        <p className="text-base font-black">{formatMoney(grandTotal)}</p>
                      </div>
                    </div>
                    <span className="bg-white text-indigo-700 font-bold text-xs px-3 py-2 rounded-xl flex items-center gap-1 shadow-sm">Bayar <Icon name="chevron-right" className="w-4 h-4"/></span>
                  </div>
                </div>
              )}
            </div>

            <div className="hidden lg:flex w-[380px] xl:w-[420px] h-full">
              {renderCartContent()}
            </div>

            {showMobileCartDrawer && (
              <div className="lg:hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex flex-col justify-end">
                <div className="bg-white rounded-t-3xl h-[85vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-300">
                  {renderCartContent()}
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderReports = () => {
        const now = new Date(); const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startOfWeek = new Date(todayDate); startOfWeek.setDate(todayDate.getDate() - todayDate.getDay());
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1); const startOfYear = new Date(now.getFullYear(), 0, 1);

        const filteredTrx = transactions.filter(t => {
          const tDate = parseDateStr(t.date);
          if (reportPeriod === 'today') return tDate >= todayDate; if (reportPeriod === 'week') return tDate >= startOfWeek;
          if (reportPeriod === 'month') return tDate >= startOfMonth; if (reportPeriod === 'year') return tDate >= startOfYear;
          if (reportPeriod === 'custom') { const startC = new Date(customStartDate); const endC = new Date(customEndDate); endC.setHours(23, 59, 59); return tDate >= startC && tDate <= endC; }
          return true;
        });

        const omzet = filteredTrx.reduce((sum, t) => sum + (t.total || 0), 0);
        let hpp = 0; filteredTrx.forEach(t => { (t.items || []).forEach(item => { if (item.product) { const prod = products.find(p => p.id === item.product.id); const cost = prod ? prod.costPrice : (item.product.costPrice || 0); hpp += cost * item.qty; } }); });
        const labaKotor = omzet - hpp; const pengeluaranTotal = expenses.reduce((sum, e) => sum + (e.amount || 0), 0); const labaBersih = labaKotor - pengeluaranTotal;

        return (
          <div className="p-3 sm:p-6 pb-28 lg:pb-8 space-y-4 max-w-6xl mx-auto">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-4 rounded-2xl border border-slate-200">
              <div><h2 className="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">Laporan Keuangan</h2><p className="text-xs text-slate-500 mt-0.5">Analisis omzet, HPP modal, dan laba bersih toko.</p></div>
              <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar w-full sm:w-auto">
                {['today', 'week', 'month', 'year'].map(p => (
                  <button key={p} onClick={() => setReportPeriod(p)} className={`px-3 py-1.5 rounded-xl text-xs font-bold capitalize whitespace-nowrap ${reportPeriod === p ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600'}`}>{p === 'today' ? 'Hari Ini' : p === 'week' ? 'Minggu' : p === 'month' ? 'Bulan Ini' : 'Tahun Ini'}</button>
                ))}
              </div>
            </div>

            <div className="bg-gradient-to-br from-slate-900 to-indigo-950 text-white p-5 rounded-2xl shadow-md space-y-4">
              <h3 className="text-xs sm:text-sm font-bold text-indigo-300 uppercase tracking-wider flex items-center gap-2"><Icon name="pie-chart" className="w-4 h-4"/> Ringkasan Laba Bersih</h3>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <div className="bg-white/10 p-3 rounded-xl"><p className="text-[10px] text-slate-300 font-bold uppercase">Omzet</p><p className="text-sm sm:text-base font-black text-emerald-400 mt-0.5">{formatMoney(omzet)}</p></div>
                <div className="bg-white/10 p-3 rounded-xl"><p className="text-[10px] text-slate-300 font-bold uppercase">HPP (Modal)</p><p className="text-sm sm:text-base font-black text-amber-400 mt-0.5">{formatMoney(hpp)}</p></div>
                <div className="bg-white/10 p-3 rounded-xl"><p className="text-[10px] text-slate-300 font-bold uppercase">Beban/Biaya</p><p className="text-sm sm:text-base font-black text-rose-400 mt-0.5">{formatMoney(pengeluaranTotal)}</p></div>
                <div className="bg-indigo-600/60 p-3 rounded-xl col-span-2 sm:col-span-1 border border-indigo-400/30"><p className="text-[10px] text-indigo-200 font-bold uppercase">Laba Bersih</p><p className="text-base sm:text-lg font-black text-white mt-0.5">{formatMoney(labaBersih)}</p></div>
              </div>
            </div>
          </div>
        );
      };
      return (
        <div className="flex h-screen bg-slate-100 font-sans text-slate-800 overflow-hidden">
          {toast.show && (
            <div className="fixed top-3 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 bg-slate-900/90 text-white backdrop-blur-sm border border-slate-700 text-xs font-bold animate-in fade-in zoom-in">
              <Icon name={toast.type === 'error' ? "alert-circle" : "check-circle"} className={`w-4 h-4 ${toast.type === 'error' ? 'text-rose-400' : 'text-emerald-400'}`} />
              <span>{toast.message}</span>
            </div>
          )}

          {/* Sidebar Desktop */}
          <div className="w-64 bg-slate-800 text-slate-300 flex-col hidden lg:flex shadow-2xl z-30">
            <div className="p-6">
              <div className="flex items-center gap-3 text-white">
                <div className="bg-indigo-500 p-2.5 rounded-xl"><Icon name="store" className="w-6 h-6 text-white"/></div>
                <div><h1 className="text-lg font-black tracking-tight leading-none">{storeSettings.name}</h1><p className="text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Sistem Bisnis</p></div>
              </div>
            </div>
            
            <div className="px-4 mb-3">
              <div className="bg-slate-700/60 p-3 rounded-xl border border-slate-600 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-xs">{currentUser.avatar}</div>
                  <div><p className="font-bold text-xs text-white">{currentUser.name}</p><span className="text-[9px] bg-indigo-500/30 text-indigo-300 px-1.5 py-0.5 rounded font-bold uppercase">{currentUser.role}</span></div>
                </div>
                <button onClick={() => setShowRoleSwitcher(!showRoleSwitcher)} className="text-[10px] text-indigo-300 hover:text-white underline font-bold">Ganti</button>
              </div>
            </div>

            <nav className="flex-1 px-3 space-y-1 overflow-y-auto">
              {[
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard', roles: ['owner', 'admin'] },
                { id: 'pos', icon: 'calculator', label: 'Kasir', roles: ['owner', 'admin', 'kasir'] },
                { id: 'inventory', icon: 'package', label: 'Produk & Stok', roles: ['owner', 'admin', 'kasir'] },
                { id: 'customers', icon: 'users', label: 'Pelanggan & Piutang', roles: ['owner', 'admin'] },
                { id: 'suppliers', icon: 'truck', label: 'Supplier & Hutang', roles: ['owner'] },
                { id: 'expenses', icon: 'receipt', label: 'Pengeluaran', roles: ['owner'] },
                { id: 'reports', icon: 'pie-chart', label: 'Laporan', roles: ['owner'] },
                { id: 'transactions', icon: 'history', label: 'Riwayat Transaksi', roles: ['owner', 'admin', 'kasir'] },
                { id: 'settings', icon: 'settings', label: 'Pengaturan Toko', roles: ['owner'] }
              ].filter(item => item.roles.includes(currentUser.role)).map(item => (
                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all ${activeTab === item.id ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-700/50 hover:text-white'}`}>
                  <Icon name={item.icon} className="w-4 h-4" />{item.label}
                </button>
              ))}
            </nav>
          </div>

          {/* Area Konten Utama */}
          <div className="flex-1 flex flex-col h-screen overflow-hidden">
            <div className="lg:hidden bg-slate-900 text-white px-4 py-2.5 flex items-center justify-between shadow-md z-20 shrink-0">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-xs">{currentUser.avatar}</div>
                <div><h1 className="text-xs font-black tracking-tight leading-none truncate max-w-[140px]">{storeSettings.name}</h1><span className="text-[9px] text-indigo-300 font-bold uppercase">{currentUser.role}</span></div>
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => setShowRoleSwitcher(true)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold text-indigo-300 border border-slate-700">Role</button>
                {notifications.length > 0 && (<button onClick={() => setShowNotificationDrawer(true)} className="p-1.5 bg-slate-800 rounded-lg text-amber-400 relative"><Icon name="bell" className="w-4 h-4"/><span className="w-2 h-2 rounded-full bg-rose-500 absolute top-1 right-1"></span></button>)}
              </div>
            </div>

            <div className="flex-1 overflow-y-auto">
              {activeTab === 'dashboard' && currentUser.role !== 'kasir' && renderDashboard()}
              {activeTab === 'pos' && renderPOS()}
              {activeTab === 'reports' && currentUser.role === 'owner' && renderReports()}

              {activeTab === 'inventory' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-4 rounded-2xl border border-slate-200">
                    <div>
                      <h2 className="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">Katalog Produk & Stok</h2>
                      <p className="text-xs text-slate-500 mt-0.5">Kelola data barang dagangan dan tambah stok dengan scan cepat.</p>
                    </div>
                    <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                      <button 
                        onClick={() => openScanner('inventory_restock')} 
                        className="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-all"
                        title="Scan Barcode Barang untuk Menambah +1 Stok Otomatis"
                      >
                        <Icon name="camera" className="w-4 h-4" />
                        <span>Scan Tambah Stok (+1)</span>
                      </button>
                      <button onClick={() => setShowRestockModal(true)} className="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1"><Icon name="plus" className="w-4 h-4" /> Masuk Form</button>
                      <button onClick={() => setShowStockOutModal(true)} className="flex-1 sm:flex-none bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1"><Icon name="minus" className="w-4 h-4" /> Keluar</button>
                      {currentUser.role !== 'kasir' && (
                        <button onClick={() => { setEditingProduct(null); setProductForm({ sku: '', name: '', costPrice: '', price: '', packPrice: '', stock: '', category: 'Umum', supplier: '' }); setIsProductModalOpen(true); }} className="flex-1 sm:flex-none bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1"><Icon name="plus" className="w-4 h-4" /> + Produk Baru</button>
                      )}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {products.map(p => (
                      <div key={p.id} className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-start">
                            <span className="text-[10px] font-mono bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-bold">{p.sku}</span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${p.stock === 0 ? 'bg-rose-100 text-rose-700' : p.stock <= 10 ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}`}>Stok: {p.stock}</span>
                          </div>
                          <h4 className="font-bold text-slate-800 text-sm mt-2">{p.name}</h4>
                          <p className="text-xs font-bold text-indigo-600 mt-1">{formatMoney(p.price)}</p>
                          {currentUser.role === 'owner' && <p className="text-[10px] text-slate-400 mt-0.5">Modal: {formatMoney(p.costPrice)}</p>}
                        </div>
                        {currentUser.role !== 'kasir' && (
                          <div className="flex justify-end gap-2 mt-3 pt-2 border-t border-slate-100">
                            <button onClick={() => { setEditingProduct(p); setProductForm(p); setIsProductModalOpen(true); }} className="p-1.5 text-indigo-600 bg-indigo-50 rounded-lg text-xs font-bold flex items-center gap-1"><Icon name="edit" className="w-3.5 h-3.5"/> Edit</button>
                            <button onClick={() => handleDeleteProduct(p.id)} className="p-1.5 text-rose-600 bg-rose-50 rounded-lg text-xs font-bold"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'transactions' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className="bg-white p-4 rounded-2xl border border-slate-200"><h2 className="text-xl font-black text-slate-800">Riwayat Penjualan</h2><p className="text-xs text-slate-500 mt-0.5">Seluruh nota transaksi kasir.</p></div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {transactions.length === 0 ? (<p className="text-center py-12 text-slate-400 text-xs col-span-full">Belum ada transaksi.</p>) : (
                      transactions.map(trx => (
                        <div key={trx.id} onClick={() => setViewingTransaction(trx)} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-indigo-400 transition-colors">
                          <div className="flex justify-between items-start"><span className="font-bold text-xs text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-lg">{trx.id}</span><span className="text-[10px] text-slate-400">{trx.date}</span></div>
                          <p className="text-lg font-black text-slate-800 mt-2">{formatMoney(trx.total)}</p>
                          <div className="flex justify-between items-center text-xs text-slate-500 mt-2 pt-2 border-t border-slate-100"><span>{trx.customerName || 'Umum'}</span><span className="font-bold">{trx.paymentMethod || 'Cash'}</span></div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}

              {activeTab === 'customers' && currentUser.role !== 'kasir' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200">
                    <div><h2 className="text-xl font-black text-slate-800">Pelanggan & Piutang</h2><p className="text-xs text-slate-500">Catatan piutang langganan.</p></div>
                    <button onClick={() => { setEditingCustomer(null); setCustomerForm({ name: '', phone: '', address: '' }); setIsCustomerModalOpen(true); }} className="bg-indigo-600 text-white px-3 py-2 rounded-xl text-xs font-bold">+ Pelanggan</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {customers.map(c => (
                      <div key={c.id} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between"><h4 className="font-bold text-slate-800 text-sm">{c.name}</h4><span className="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded font-mono">{c.phone || '-'}</span></div>
                          <div className="mt-3 flex justify-between items-center">
                            <div><p className="text-[10px] text-slate-400">Total Belanja</p><p className="font-bold text-xs text-slate-700">{formatMoney(c.totalSpent)}</p></div>
                            <div className="text-right"><p className="text-[10px] text-amber-500 font-bold">Piutang</p><p className="font-black text-sm text-amber-600">{formatMoney(c.debt)}</p></div>
                          </div>
                        </div>
                        <div className="flex justify-end gap-2 mt-3 pt-2 border-t border-slate-100">
                          {c.debt > 0 && <button onClick={() => { setPaymentModalCustomer(c); setCustomerPayAmount(c.debt.toString()); }} className="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-xs font-bold">Bayar</button>}
                          <button onClick={() => { setEditingCustomer(c); setCustomerForm(c); setIsCustomerModalOpen(true); }} className="p-1.5 text-indigo-600 bg-indigo-50 rounded-lg"><Icon name="edit" className="w-3.5 h-3.5"/></button>
                          <button onClick={() => handleDeleteCustomer(c.id)} className="p-1.5 text-rose-600 bg-rose-50 rounded-lg"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'suppliers' && currentUser.role === 'owner' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200">
                    <div><h2 className="text-xl font-black text-slate-800">Supplier & Hutang Usaha</h2><p className="text-xs text-slate-500">Daftar vendor toko.</p></div>
                    <button onClick={() => { setEditingSupplier(null); setSupplierForm({ name: '', contactPerson: '', phone: '', address: '' }); setIsSupplierModalOpen(true); }} className="bg-indigo-600 text-white px-3 py-2 rounded-xl text-xs font-bold">+ Supplier</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {suppliers.map(s => (
                      <div key={s.id} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between"><h4 className="font-bold text-slate-800 text-sm">{s.name}</h4><span className="text-[10px] text-slate-400 font-semibold">{s.phone || '-'}</span></div>
                          <div className="mt-3 flex justify-between items-center">
                            <div><p className="text-[10px] text-slate-400">Total Beli</p><p className="font-bold text-xs text-slate-700">{formatMoney(s.totalPurchases)}</p></div>
                            <div className="text-right"><p className="text-[10px] text-amber-500 font-bold">Hutang Toko</p><p className="font-black text-sm text-amber-600">{formatMoney(s.debt)}</p></div>
                          </div>
                        </div>
                        <div className="flex justify-end gap-2 mt-3 pt-2 border-t border-slate-100">
                          {s.debt > 0 && <button onClick={() => { setPaymentModalSupplier(s); setSupplierPayAmount(s.debt.toString()); }} className="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-xs font-bold">Bayar</button>}
                          <button onClick={() => { setEditingSupplier(s); setSupplierForm(s); setIsSupplierModalOpen(true); }} className="p-1.5 text-indigo-600 bg-indigo-50 rounded-lg"><Icon name="edit" className="w-3.5 h-3.5"/></button>
                          <button onClick={() => handleDeleteSupplier(s.id)} className="p-1.5 text-rose-600 bg-rose-50 rounded-lg"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'expenses' && currentUser.role === 'owner' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200">
                    <div><h2 className="text-xl font-black text-slate-800">Catatan Pengeluaran</h2><p className="text-xs text-slate-500">Listrik, sewa, gaji, internet.</p></div>
                    <button onClick={() => setIsExpenseModalOpen(true)} className="bg-indigo-600 text-white px-3 py-2 rounded-xl text-xs font-bold">+ Beban</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {expenses.map(e => (
                      <div key={e.id} className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                        <div>
                          <span className="text-[10px] font-bold bg-rose-50 text-rose-700 px-2 py-0.5 rounded">{e.category}</span>
                          <p className="font-bold text-slate-800 text-xs mt-1">{e.note}</p>
                          <p className="text-[10px] text-slate-400">{e.date}</p>
                        </div>
                        <div className="text-right">
                          <p className="font-black text-sm text-rose-600">{formatMoney(e.amount)}</p>
                          <button onClick={() => handleDeleteExpense(e.id)} className="text-[10px] text-slate-400 hover:text-rose-600 mt-1">Hapus</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'settings' && currentUser.role === 'owner' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-4xl mx-auto space-y-4">
                  <div className="bg-slate-900 text-white p-4 sm:p-6 rounded-2xl shadow-md space-y-3">
                    <h3 className="font-bold text-sm flex items-center gap-2"><Icon name="hard-drive" className="w-4 h-4 text-indigo-400"/> Cadangan Data (.JSON)</h3>
                    <p className="text-xs text-slate-300">Unduh data kasir ke file .json atau pulihkan data saat ganti perangkat.</p>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-2">
                      <button onClick={handleBackupDatabase} className="py-2.5 px-3 bg-indigo-600 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5"><Icon name="download" className="w-4 h-4"/> Backup (.json)</button>
                      <label className="py-2.5 px-3 bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer text-center"><Icon name="upload" className="w-4 h-4 text-emerald-400"/> Pulihkan Data<input ref={fileInputRef} type="file" accept=".json" onChange={handleRestoreDatabase} className="hidden" /></label>
                      <button onClick={handleResetAllData} className="py-2.5 px-3 bg-rose-950/60 border border-rose-800 rounded-xl text-xs font-bold text-rose-300">Reset Data Toko</button>
                    </div>
                  </div>

                  <div className="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                    <h3 className="font-bold text-sm text-slate-800 border-b border-slate-100 pb-2">Identitas Toko & Nota</h3>
                    <form onSubmit={handleSaveSettings} className="space-y-3 text-xs">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="font-bold text-slate-500 mb-1 block">Nama Toko *</label>
                          <input type="text" required value={storeSettings.name} onChange={(e) => setStoreSettings({...storeSettings, name: e.target.value})} className="w-full px-3 py-2 border rounded-xl font-bold" />
                        </div>
                        <div>
                          <label className="font-bold text-slate-500 mb-1 block">Tagline / Slogan</label>
                          <input type="text" value={storeSettings.tagline} onChange={(e) => setStoreSettings({...storeSettings, tagline: e.target.value})} className="w-full px-3 py-2 border rounded-xl" />
                        </div>
                        <div>
                          <label className="font-bold text-slate-500 mb-1 block">Nomor WhatsApp / Telp</label>
                          <input type="text" value={storeSettings.phone} onChange={(e) => setStoreSettings({...storeSettings, phone: e.target.value})} className="w-full px-3 py-2 border rounded-xl font-mono" />
                        </div>
                        <div>
                          <label className="font-bold text-slate-500 mb-1 block">Prefix Invoice</label>
                          <input type="text" value={storeSettings.invoicePrefix} onChange={(e) => setStoreSettings({...storeSettings, invoicePrefix: e.target.value})} className="w-full px-3 py-2 border rounded-xl font-mono" />
                        </div>
                      </div>
                      <div>
                        <label className="font-bold text-slate-500 mb-1 block">Alamat Toko</label>
                        <textarea value={storeSettings.address} onChange={(e) => setStoreSettings({...storeSettings, address: e.target.value})} className="w-full px-3 py-2 border rounded-xl min-h-[60px]" />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="font-bold text-slate-500 mb-1 block">Pajak Penjualan (%)</label>
                          <input type="number" min="0" max="100" value={storeSettings.taxPercent} onChange={(e) => setStoreSettings({...storeSettings, taxPercent: e.target.value})} className="w-full px-3 py-2 border rounded-xl" />
                        </div>
                        <div>
                          <label className="font-bold text-slate-500 mb-1 block">Default Diskon (%)</label>
                          <input type="number" min="0" max="100" value={storeSettings.defaultDiscount} onChange={(e) => setStoreSettings({...storeSettings, defaultDiscount: e.target.value})} className="w-full px-3 py-2 border rounded-xl" />
                        </div>
                      </div>
                      <div>
                        <label className="font-bold text-slate-500 mb-1 block">Catatan Bawah Struk (Footer)</label>
                        <textarea value={storeSettings.receiptFooter} onChange={(e) => setStoreSettings({...storeSettings, receiptFooter: e.target.value})} className="w-full px-3 py-2 border rounded-xl min-h-[60px]" />
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 transition-all">
                        <Icon name="save" className="w-4 h-4"/> Simpan Identitas Toko
                      </button>
                    </form>
                  </div>

                  <div className="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                    <h3 className="font-bold text-sm text-slate-800 border-b border-slate-100 pb-2 flex items-center gap-2">
                      <Icon name="lock" className="w-4 h-4 text-indigo-600"/> Pengaturan Password Akun
                    </h3>
                    <form onSubmit={(e) => { e.preventDefault(); showToast('Password role berhasil diperbarui!'); }} className="space-y-3 text-xs">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="font-bold text-slate-500 mb-1 block">Password Baru Owner</label>
                          <input type="text" value={rolePasswords.owner} onChange={(e) => setRolePasswords({...rolePasswords, owner: e.target.value})} className="w-full px-3 py-2 border rounded-xl font-bold" />
                        </div>
                        <div>
                          <label className="font-bold text-slate-500 mb-1 block">Password Baru Admin</label>
                          <input type="text" value={rolePasswords.admin} onChange={(e) => setRolePasswords({...rolePasswords, admin: e.target.value})} className="w-full px-3 py-2 border rounded-xl font-bold" />
                        </div>
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold flex items-center justify-center gap-1.5">
                        <Icon name="shield-check" className="w-4 h-4"/> Update Password
                      </button>
                    </form>
                  </div>
                </div>
              )}
            </div>

            {/* Bottom Nav Mobile */}
            <div className="lg:hidden bg-white border-t border-slate-200 flex items-center justify-around py-1.5 px-2 z-30 pb-safe shrink-0 shadow-lg">
              {[
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard', roles: ['owner', 'admin'] },
                { id: 'pos', icon: 'calculator', label: 'Kasir', roles: ['owner', 'admin', 'kasir'] },
                { id: 'inventory', icon: 'package', label: 'Produk', roles: ['owner', 'admin', 'kasir'] },
                { id: 'transactions', icon: 'history', label: 'Riwayat', roles: ['owner', 'admin', 'kasir'] },
                { id: 'reports', icon: 'pie-chart', label: 'Laporan', roles: ['owner'] },
                { id: 'settings', icon: 'settings', label: 'Toko', roles: ['owner'] }
              ].filter(item => item.roles.includes(currentUser.role)).map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition-all ${
                    activeTab === item.id ? 'text-indigo-600 font-extrabold bg-indigo-50' : 'text-slate-400 font-semibold'
                  }`}
                >
                  <Icon name={item.icon} className="w-4 h-4 mb-0.5" />
                  <span className="text-[10px]">{item.label}</span>
                </button>
              ))}
            </div>
          </div>

          {/* MODAL LIVE VIDEO BARCODE SCANNER */}
          {scannerModal.isOpen && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 animate-in fade-in duration-200">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md overflow-hidden shadow-2xl flex flex-col max-h-[92vh]">
                
                {/* Header Scanner */}
                <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900 text-white shrink-0">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                      <Icon name="camera" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-black text-sm">
                        {scannerModal.target === 'pos' ? 'Live Barcode Scanner' : 'Scan Barcode Produk'}
                      </h3>
                      <p className="text-[10px] text-slate-400">Arahkan barcode ke dalam kotak bidik</p>
                    </div>
                  </div>
                  
                  <button 
                    onClick={closeScannerModal} 
                    className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-xl transition-colors"
                  >
                    <Icon name="x" className="w-5 h-5"/>
                  </button>
                </div>

                {/* Live Camera Viewfinder */}
                <div id="scanner-video-container" className="relative bg-black w-full aspect-[3/4] sm:aspect-[4/3] flex items-center justify-center overflow-hidden">
                  <div id="scanner-reader" className="w-full h-full"></div>

                  {/* Loading Spinner saat Kamera Menghubungkan */}
                  {scannerModal.isLoadingCamera && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 text-white z-20 gap-2">
                      <div className="w-9 h-9 border-2 border-emerald-500/30 border-t-emerald-500 rounded-full animate-spin"></div>
                      <p className="text-xs text-slate-300 font-bold">Menghubungkan ke kamera HP...</p>
                      <p className="text-[10px] text-slate-500">Ketuk 'Izinkan' jika muncul pop-up browser</p>
                    </div>
                  )}

                  {/* Loading Analisis Foto */}
                  {isProcessingImage && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 text-white z-30 gap-2">
                      <div className="w-9 h-9 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
                      <p className="text-xs text-indigo-300 font-bold">Membaca Barcode dari Foto...</p>
                    </div>
                  )}

                  {/* Laser Bidik Scanner Aktif */}
                  {!scannerModal.isLoadingCamera && !scannerModal.errorMsg && !isProcessingImage && (
                    <div className="absolute inset-0 pointer-events-none flex items-center justify-center p-6 z-20">
                      <div className="relative w-64 h-44 border-2 border-emerald-400/80 rounded-2xl overflow-hidden">
                        <div className="scanner-laser-line"></div>
                        <div className="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-emerald-400 rounded-tl-lg"></div>
                        <div className="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-emerald-400 rounded-tr-lg"></div>
                        <div className="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-emerald-400 rounded-bl-lg"></div>
                        <div className="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-emerald-400 rounded-br-lg"></div>
                      </div>
                    </div>
                  )}

                  {/* Pesan Error & Opsi Alternatif */}
                  {scannerModal.errorMsg && !isProcessingImage && (
                    <div className="absolute inset-3 bg-slate-900/95 border border-slate-700 rounded-2xl p-4 flex flex-col items-center justify-center text-center z-30 space-y-3">
                      <div className="w-10 h-10 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center">
                        <Icon name="alert-triangle" className="w-5 h-5" />
                      </div>
                      <div>
                        <h4 className="text-xs font-black text-white uppercase">Akses Kamera Terhalang</h4>
                        <p className="text-[11px] text-slate-300 mt-1 leading-relaxed max-w-[280px]">
                          {scannerModal.errorMsg}
                        </p>
                      </div>
                      <div className="flex flex-col gap-2 w-full max-w-[240px]">
                        <button 
                          onClick={startLiveCamera}
                          className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white rounded-xl text-xs font-bold shadow-md"
                        >
                          Coba Sambungkan Lagi
                        </button>
                        <button 
                          type="button"
                          onClick={() => cameraNativeInputRef.current && cameraNativeInputRef.current.click()}
                          className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-md"
                        >
                          <Icon name="camera" className="w-4 h-4"/>
                          <span>Ambil Foto Barcode</span>
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                {/* Input File Kamera Tersembunyi (Native Camera Capture) */}
                <input 
                  type="file" 
                  accept="image/*" 
                  capture="environment" 
                  ref={cameraNativeInputRef} 
                  onChange={handleImageFileScan} 
                  className="hidden" 
                />
                <input 
                  type="file" 
                  accept="image/*" 
                  ref={galleryInputRef} 
                  onChange={handleImageFileScan} 
                  className="hidden" 
                />

                {/* Footer Kontrol Scanner */}
                <div className="p-4 bg-slate-900 border-t border-slate-800 text-white space-y-3 shrink-0">
                  {/* Tombol Cadangan Ambil Foto & Galeri */}
                  <div className="grid grid-cols-2 gap-2">
                    <button 
                      type="button"
                      onClick={() => cameraNativeInputRef.current && cameraNativeInputRef.current.click()}
                      className="py-2.5 px-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm transition-all active:scale-95"
                    >
                      <Icon name="camera" className="w-4 h-4" />
                      <span>Foto Barcode</span>
                    </button>
                    <button 
                      type="button"
                      onClick={() => galleryInputRef.current && galleryInputRef.current.click()}
                      className="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border border-slate-700 transition-all active:scale-95"
                    >
                      <Icon name="image" className="w-4 h-4" />
                      <span>Dari Galeri</span>
                    </button>
                  </div>

                  {scannerModal.target === 'pos' && (
                    <div className="flex items-center justify-between bg-slate-800/80 p-2.5 rounded-2xl border border-slate-700">
                      <div className="flex items-center gap-2">
                        <Icon name="repeat" className="w-4 h-4 text-emerald-400" />
                        <div>
                          <p className="text-xs font-bold">Scan Beruntun</p>
                          <p className="text-[10px] text-slate-400">Scan banyak barang tanpa menutup kamera</p>
                        </div>
                      </div>
                      <label className="relative inline-flex items-center cursor-pointer">
                        <input 
                          type="checkbox" 
                          checked={scannerModal.continuousMode} 
                          onChange={(e) => setScannerModal(prev => ({ ...prev, continuousMode: e.target.checked }))} 
                          className="sr-only peer" 
                        />
                        <div className="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                      </label>
                    </div>
                  )}

                  {scannerModal.lastScanned && (
                    <div className="p-2 bg-emerald-950/80 border border-emerald-700 text-emerald-300 rounded-xl text-center text-xs font-bold animate-in zoom-in duration-150">
                      ⚡ Terdeteksi: <span className="font-mono text-white ml-1">{scannerModal.lastScanned}</span>
                    </div>
                  )}

                  <button 
                    onClick={closeScannerModal} 
                    className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-300 hover:text-white text-xs font-bold rounded-xl transition-all"
                  >
                    Selesai / Tutup Scanner
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Modal Ganti Role */}
          {showRoleSwitcher && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-sm p-5 space-y-3 animate-in slide-in-from-bottom duration-200">
                <div className="flex justify-between items-center"><h3 className="font-bold text-sm text-slate-800">Ganti Akun Pengguna</h3><button onClick={() => setShowRoleSwitcher(false)}><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <div className="space-y-2 pt-2">
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Bapak Owner', role: 'owner', avatar: 'BO' })} className="w-full p-3 rounded-xl border border-slate-200 text-left flex justify-between items-center font-bold text-xs hover:bg-slate-50"><span>👑 Owner (Akses Penuh)</span><Icon name="shield-check" className="w-4 h-4 text-indigo-600"/></button>
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Ibu Admin', role: 'admin', avatar: 'IA' })} className="w-full p-3 rounded-xl border border-slate-200 text-left flex justify-between items-center font-bold text-xs hover:bg-slate-50"><span>💼 Admin Toko</span><Icon name="user-check" className="w-4 h-4 text-blue-600"/></button>
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Mas Kasir', role: 'kasir', avatar: 'MK' })} className="w-full p-3 rounded-xl border border-slate-200 text-left flex justify-between items-center font-bold text-xs hover:bg-slate-50"><span>🛒 Kasir (POS)</span><Icon name="lock" className="w-4 h-4 text-slate-600"/></button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Auth Password */}
          {authModal.show && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-sm p-5 space-y-3 animate-in slide-in-from-bottom duration-200">
                <div className="flex justify-between items-center"><h3 className="font-bold text-sm text-slate-800">Verifikasi Password</h3><button onClick={() => setAuthModal({ show: false, targetRole: null, password: '' })}><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleAuthSubmit} className="space-y-3 pt-2">
                  <input type="password" required autoFocus placeholder="Password role..." value={authModal.password} onChange={(e) => setAuthModal({...authModal, password: e.target.value})} className="w-full p-3 border rounded-xl text-center text-lg font-bold" />
                  <button type="submit" className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl text-xs">Masuk</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Nota Struk */}
          {viewingTransaction && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom duration-200">
                <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h3 className="font-bold text-slate-800 text-sm">Nota #{viewingTransaction.id}</h3>
                  <button onClick={() => setViewingTransaction(null)}><Icon name="x" className="w-5 h-5 text-slate-400"/></button>
                </div>
                <div className="p-5 flex-1 overflow-y-auto space-y-3 text-xs">
                  <div className="text-center pb-2 border-b border-dashed border-slate-300">
                    <h4 className="font-black text-sm uppercase">{storeSettings.name}</h4>
                    <p className="text-slate-400 text-[10px]">{storeSettings.address}</p>
                    <p className="text-[10px] text-slate-500 mt-1">{viewingTransaction.date} • Kasir: {viewingTransaction.cashier}</p>
                  </div>
                  <div className="space-y-1.5 border-b border-dashed border-slate-300 pb-2">
                    {(viewingTransaction.items || []).map((i, idx) => (
                      <div key={idx} className="flex justify-between"><span>{i.product.name} ({i.qty}x)</span><span className="font-bold">{formatMoney((i.product.price - (Number(i.discountRp)||0)) * i.qty)}</span></div>
                    ))}
                  </div>
                  <div className="space-y-1 pt-1 font-semibold">
                    <div className="flex justify-between"><span>Total:</span><span className="font-black text-sm text-indigo-600">{formatMoney(viewingTransaction.total)}</span></div>
                    <div className="flex justify-between text-[11px] text-slate-500"><span>Bayar ({viewingTransaction.paymentMethod}):</span><span>{formatMoney(viewingTransaction.cash)}</span></div>
                    {viewingTransaction.paymentMethod === 'Cash' && <div className="flex justify-between text-[11px] text-emerald-600"><span>Kembalian:</span><span>{formatMoney(viewingTransaction.change)}</span></div>}
                  </div>
                </div>
                <div className="p-3 bg-slate-50 border-t border-slate-100 grid grid-cols-2 gap-2">
                  <button onClick={() => {
                    let text = `*NOTA - ${storeSettings.name}*\nNo: ${viewingTransaction.id}\nTotal: ${formatMoney(viewingTransaction.total)}\n\nTerima kasih!`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                  }} className="py-2.5 bg-emerald-600 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5"><Icon name="message-circle" className="w-4 h-4"/> WhatsApp</button>
                  <button onClick={() => window.print()} className="py-2.5 bg-slate-800 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5"><Icon name="printer" className="w-4 h-4"/> Cetak</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Tambah/Edit Produk */}
          {isProductModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom duration-200">
                <div className="p-4 border-b border-slate-100 flex justify-between items-center"><h3 className="font-bold text-sm text-slate-800">{editingProduct ? 'Edit Barang' : 'Tambah Barang Baru'}</h3><button onClick={() => setIsProductModalOpen(false)}><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveProduct} className="p-4 overflow-y-auto space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-500 mb-1 block">Kode Barcode / SKU</label>
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        placeholder={isMobileDevice ? "Otomatis jika kosong" : "Scan dengan alat scanner / ketik SKU"} 
                        value={productForm.sku} 
                        onChange={(e) => setProductForm({...productForm, sku: e.target.value})} 
                        className="flex-1 px-3 py-2 border rounded-xl font-mono uppercase" 
                      />
                      {isMobileDevice ? (
                        <button 
                          type="button" 
                          onClick={() => openScanner('product_form')} 
                          className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl flex items-center gap-1 shrink-0"
                          title="Scan Barcode Lewat Kamera HP"
                        >
                          <Icon name="camera" className="w-4 h-4"/>
                          <span>Scan</span>
                        </button>
                      ) : (
                        <span className="px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-slate-500 font-bold text-xs flex items-center gap-1">
                          <Icon name="barcode" className="w-4 h-4"/>
                          <span>Scan Fisik</span>
                        </span>
                      )}
                    </div>
                  </div>
                  <div><label className="font-bold text-slate-500 mb-1 block">Nama Produk *</label><input type="text" required placeholder="Contoh: Es Teh Manis" value={productForm.name} onChange={(e) => setProductForm({...productForm, name: e.target.value})} className="w-full px-3 py-2 border rounded-xl font-bold" /></div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="font-bold text-slate-500 mb-1 block">Kategori</label><input type="text" required value={productForm.category} onChange={(e) => setProductForm({...productForm, category: e.target.value})} className="w-full px-3 py-2 border rounded-xl" /></div>
                    <div><label className="font-bold text-slate-500 mb-1 block">Stok Awal</label><input type="number" required value={productForm.stock} onChange={(e) => setProductForm({...productForm, stock: e.target.value})} className="w-full px-3 py-2 border rounded-xl font-bold" /></div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="font-bold text-slate-500 mb-1 block">Harga Jual (Rp) *</label><input type="number" required value={productForm.price} onChange={(e) => setProductForm({...productForm, price: e.target.value})} className="w-full px-3 py-2 border rounded-xl font-black text-indigo-600" /></div>
                    <div><label className="font-bold text-slate-500 mb-1 block">Harga Modal (Rp)</label><input type="number" required value={productForm.costPrice} onChange={(e) => setProductForm({...productForm, costPrice: e.target.value})} className="w-full px-3 py-2 border rounded-xl" /></div>
                  </div>
                  <button type="submit" disabled={isSaving} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-xs mt-2">{isSaving ? 'Menyimpan...' : 'Simpan Barang'}</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Restock */}
          {showRestockModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom duration-200">
                <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-emerald-50 text-emerald-800"><h3 className="font-bold text-sm flex items-center gap-1.5"><Icon name="plus" className="w-4 h-4"/> Stok Masuk & Hutang</h3><button onClick={() => setShowRestockModal(false)}><Icon name="x" className="w-5 h-5"/></button></div>
                <form onSubmit={handleSaveRestock} className="p-4 overflow-y-auto space-y-3 text-xs">
                  <div><label className="font-bold text-slate-500 mb-1 block">Nama Supplier *</label><input type="text" required placeholder="Contoh: Toko Grosir Jaya" value={restockForm.supplier} onChange={(e) => setRestockForm({...restockForm, supplier: e.target.value})} className="w-full px-3 py-2 border rounded-xl" /></div>
                  <div className="space-y-2">
                    <label className="font-bold text-slate-500 block">Daftar Barang Masuk:</label>
                    {restockForm.items.map((it, idx) => (
                      <div key={idx} className="flex gap-2 items-center">
                        <select required value={it.productId} onChange={(e) => updateDynamicList(restockForm, setRestockForm, idx, 'productId', e.target.value)} className="flex-1 p-2 border rounded-xl text-xs"><option value="">-- Pilih Barang --</option>{products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
                        <input type="number" required min="1" placeholder="Qty" value={it.qty} onChange={(e) => updateDynamicList(restockForm, setRestockForm, idx, 'qty', e.target.value)} className="w-16 p-2 border rounded-xl text-center text-xs font-bold" />
                      </div>
                    ))}
                    <button type="button" onClick={() => addRowDynamicList(restockForm, setRestockForm)} className="text-[11px] font-bold text-indigo-600">+ Tambah Baris</button>
                  </div>
                  <button type="submit" className="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold text-xs mt-2">Simpan Stok Masuk</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Pengeluaran */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-sm max-h-[90vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom duration-200">
                <div className="p-4 border-b border-slate-100 flex justify-between items-center"><h3 className="font-bold text-sm text-slate-800">Catat Pengeluaran</h3><button onClick={() => setIsExpenseModalOpen(false)}><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveExpense} className="p-4 space-y-3 text-xs">
                  <div><label className="font-bold text-slate-500 mb-1 block">Kategori</label><select value={expenseForm.category} onChange={(e) => setExpenseForm({...expenseForm, category: e.target.value})} className="w-full p-2 border rounded-xl"><option value="Listrik">⚡ Listrik</option><option value="Internet">🌐 Internet</option><option value="Sewa">🏠 Sewa Tempat</option><option value="Gaji">👥 Gaji</option><option value="Lainnya">🏷️ Lainnya</option></select></div>
                  <div><label className="font-bold text-slate-500 mb-1 block">Nominal (Rp) *</label><input type="number" required placeholder="Contoh: 150000" value={expenseForm.amount} onChange={(e) => setExpenseForm({...expenseForm, amount: e.target.value})} className="w-full p-2 border rounded-xl font-black text-rose-600" /></div>
                  <div><label className="font-bold text-slate-500 mb-1 block">Keterangan</label><input type="text" placeholder="Misal: Beli token listrik" value={expenseForm.note} onChange={(e) => setExpenseForm({...expenseForm, note: e.target.value})} className="w-full p-2 border rounded-xl" /></div>
                  <button type="submit" className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-xs mt-1">Simpan Beban</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-sizing: border-box;
    }
    
    body { 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      margin: 0; 
      padding: 0;
      overscroll-behavior-y: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Scrollbar Halus Modern */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }
    
    .lucide-icon { display: inline-flex; align-items: center; justify-content: center; }

    /* Penanganan Notch & Home Bar HP */
    .pb-safe { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
    .pt-safe { padding-top: calc(0.75rem + env(safe-area-inset-top, 0px)); }

    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animasi Laser Bidik Scanner */
    @keyframes scanLaser {
      0% { top: 12%; opacity: 0.85; }
      50% { top: 88%; opacity: 1; }
      100% { top: 12%; opacity: 0.85; }
    }
    .scanner-laser-line {
      position: absolute;
      left: 8%;
      right: 8%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00d2d3, #22c55e, #00d2d3, transparent);
      box-shadow: 0 0 16px 3px rgba(0, 210, 211, 0.9);
      animation: scanLaser 2s infinite ease-in-out;
      border-radius: 9999px;
      z-index: 25;
      pointer-events: none;
    }

    /* Penyesuaian Viewport Video Scanner */
    #scanner-reader {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      background: #000 !important;
      border: none !important;
      overflow: hidden !important;
    }
    #scanner-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }
    #scanner-reader canvas, #scanner-reader__dashboard {
      display: none !important;
    }

    .glow-cyan { box-shadow: 0 0 20px -5px rgba(0, 210, 211, 0.4); }
    .glow-indigo { box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.5); }
  </style>
</head>
<body class="bg-[#0f1228] text-slate-100 antialiased select-none dark">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

      signInWithCustomToken, 
      signInAnonymously,

    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

      getFirestore,

    const { useState, useEffect, useMemo, useRef, useCallback, Component } = React;

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'pospro-pos-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyDemoKeyPosProModern2026",
          authDomain: "pospro-modern.firebaseapp.com",
          projectId: "pospro-modern",
          storageBucket: "pospro-modern.appspot.com",
          messagingSenderId: "1029384756",
          appId: "1:1029384756:web:987654321fedcba"
        };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("POSPro App Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#0f1228] text-white flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-[#181b3b] p-6 rounded-3xl border border-[#2a2f60] max-w-md w-full shadow-2xl">
                <div className="w-14 h-14 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                  <i data-lucide="triangle-alert" className="w-8 h-8"></i>
                </div>
                <h2 className="text-lg font-black text-white">Terjadi Kendala Sistem</h2>
                <p className="text-xs text-slate-400 mt-2">Data kasir Anda tetap aman di memori. Silakan klik tombol di bawah untuk memuat ulang aplikasi.</p>
                <div className="mt-6 flex flex-col gap-2">
                  <button

                  >
                    Muat Ulang Aplikasi

              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const Icon = ({ name, className = "w-5 h-5", title }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          try {
            iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
            window.lucide.createIcons({ root: iconRef.current, nameAttr: 'data-lucide' });
          } catch (e) {}
        }
      }, [name, className]);
      return <span ref={iconRef} className={`lucide-icon shrink-0 ${className}`} title={title || name} />;
    };

    const generateId = () => Math.random().toString(36).substr(2, 9);
    const formatMoney = (amount) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount || 0);

    const parseDateStr = (dateStr) => {
      if (!dateStr) return new Date();
      try {
        const parts = String(dateStr).split(', ');
        if (parts.length !== 2) return new Date();
        const [d, m, y] = parts[0].split('/');
        const [hr, min, sec] = parts[1].split('.');
        return new Date(y, m - 1, d, hr, min, sec);
      } catch (e) {
        return new Date();
      }
    };

    const playScanBeep = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1850, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    };

    const defaultSettings = {
      name: 'POSPro Store', tagline: 'Sistem Kasir & Manajemen UMKM Modern', phone: '081234567890', address: 'Jl. Bisnis Sukses No. 88',
      receiptFooter: 'Terima kasih atas kunjungan Anda!\nBarang yang dibeli tidak dapat ditukar.', invoicePrefix: 'INV-', taxPercent: 0, defaultDiscount: 0, currency: 'IDR',
      paymentMethods: ['Cash', 'Debit', 'Transfer', 'QRIS', 'E-wallet', 'Hutang']
    };

    const defaultProducts = [
      { id: '1', sku: 'BRG-001', name: 'Kopi Susu Gula Aren', costPrice: 12000, price: 18000, packPrice: 0, stock: 45, category: 'Minuman', supplier: 'PT. Kopi Nusantara' },
      { id: '2', sku: 'BRG-002', name: 'Nasi Goreng Spesial', costPrice: 15000, price: 25000, packPrice: 0, stock: 20, category: 'Makanan', supplier: 'Pasar Induk' },
      { id: '3', sku: 'BRG-003', name: 'Es Teh Manis Jumbo', costPrice: 2500, price: 6000, packPrice: 0, stock: 80, category: 'Minuman', supplier: 'PT. Sumber Segar' },
      { id: '4', sku: 'BRG-004', name: 'Roti Bakar Coklat Keju', costPrice: 10000, price: 17000, packPrice: 0, stock: 15, category: 'Makanan', supplier: 'Bakery Prima' },
      { id: '5', sku: 'BRG-005', name: 'Keripik Kentang Renyah', costPrice: 6000, price: 10000, packPrice: 0, stock: 35, category: 'Snack', supplier: 'Sentra Camilan' }
    ];

    const demoTransactions = [
      {
        id: 'INV-829104',
        date: new Date().toLocaleString('id-ID'),
        items: [{ product: defaultProducts[0], qty: 2, discountRp: 0 }, { product: defaultProducts[1], qty: 1, discountRp: 0 }],
        subtotal: 61000, discount: 0, tax: 0, total: 61000, cash: 100000, change: 39000, paymentMethod: 'Cash',
        customerName: 'Pelanggan Umum', cashier: 'Kasir Utama'
      },
      {
        id: 'INV-731902',
        date: new Date(Date.now() - 3600000).toLocaleString('id-ID'),
        items: [{ product: defaultProducts[2], qty: 3, discountRp: 0 }, { product: defaultProducts[4], qty: 2, discountRp: 0 }],
        subtotal: 38000, discount: 0, tax: 0, total: 38000, cash: 38000, change: 0, paymentMethod: 'QRIS',
        customerName: 'Budi Santoso', cashier: 'Kasir Utama'
      }
    ];

    function App() {
      const [authUser, setAuthUser] = useState(null);
      const [isAuthLoading, setIsAuthLoading] = useState(true);
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [isDemoMode, setIsDemoMode] = useState(false);
      const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);

      const [theme, setTheme] = useState('dark');

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          document.body.className = "bg-[#0f1228] text-slate-100 antialiased select-none dark";
        } else {
          root.classList.remove('dark');
          document.body.className = "bg-[#f4f6fb] text-slate-800 antialiased select-none";
        }
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      const [activeTab, setActiveTab] = useState('dashboard');
      
      const [isMobileDevice, setIsMobileDevice] = useState(() => {
        return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 1024;
      });

      useEffect(() => {
        const handleResize = () => {
          setIsMobileDevice(/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 1024);
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const [currentUserRole, setCurrentUserRole] = useState({ name: 'Owner Toko', role: 'owner', avatar: 'OT' });
      const [showRoleSwitcher, setShowRoleSwitcher] = useState(false);
      const [showMobileCartDrawer, setShowMobileCartDrawer] = useState(false);

      const currentUser = currentUserRole;

      const [authModal, setAuthModal] = useState({ show: false, targetRole: null, password: '' });
      const [rolePasswords, setRolePasswords] = useState({ owner: 'owner123', admin: 'admin123' });

      // State Data Aplikasi
      const [storeSettings, setStoreSettings] = useState(defaultSettings);
      const [products, setProducts] = useState(defaultProducts);
      const [transactions, setTransactions] = useState([]);
      const [draftOrders, setDraftOrders] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [suppliers, setSuppliers] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [isCloudSyncing, setIsCloudSyncing] = useState(false);

      // Pantau Status Login Pengguna
      useEffect(() => {
        let isMounted = true;
        const unsubscribe = onAuthStateChanged(auth, async (user) => {
          if (!isMounted) return;
          if (user) {
            setAuthUser(user);
            setIsDemoMode(false);
            setCurrentUserRole({
              name: user.displayName || user.email?.split('@')[0] || 'Pemilik Toko',
              role: 'owner',
              avatar: (user.displayName || user.email || 'OT').slice(0, 2).toUpperCase()
            });
            setIsAuthLoading(false);
          } else {
            // Cek Custom Token jika ada di runtime environment
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              try {
                await signInWithCustomToken(auth, __initial_auth_token);
              } catch (err) {
                setAuthUser(null);
                setIsAuthLoading(false);
              }
            } else {
              setAuthUser(null);
              setIsAuthLoading(false);
            }
          }
        });

        return () => {
          isMounted = false;
          unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (!authUser) return;

        const userId = authUser.uid;
        // Strict path: /artifacts/{appId}/users/{userId}/store_data/main_store_data
        const userStoreDocRef = doc(db, 'artifacts', appId, 'users', userId, 'store_data', 'main_store_data');

        const unsubscribeDoc = onSnapshot(userStoreDocRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data.storeSettings) setStoreSettings(data.storeSettings);
            if (data.products) setProducts(data.products);
            if (data.transactions) setTransactions(data.transactions);
            if (data.draftOrders) setDraftOrders(data.draftOrders);
            if (data.customers) setCustomers(data.customers);
            if (data.suppliers) setSuppliers(data.suppliers);
            if (data.expenses) setExpenses(data.expenses);
            if (data.rolePasswords) setRolePasswords(data.rolePasswords);
          } else {
            // Setup awal untuk akun Google baru
            const initStore = {
              storeSettings: { 
                ...defaultSettings, 
                name: authUser.displayName ? `Toko ${authUser.displayName}` : 'Toko Saya' 
              },
              products: defaultProducts,
              transactions: [],
              draftOrders: [],
              customers: [],
              suppliers: [],
              expenses: [],
              rolePasswords: { owner: 'owner123', admin: 'admin123' },
              createdAt: new Date().toISOString(),
              userEmail: authUser.email || '',
              userName: authUser.displayName || 'Pemilik Toko'
            };

            setStoreSettings(initStore.storeSettings);
            setProducts(initStore.products);
            setTransactions(initStore.transactions);

            setDoc(userStoreDocRef, initStore).catch((err) => console.error("Error initial store setup:", err));
          }
        }, (error) => {
          console.error("Firestore user sync error:", error);
        });

        return () => unsubscribeDoc();
      }, [authUser]);

      const syncToCloud = useCallback(async (overrides = {}) => {
        if (!authUser) return;
        const userId = authUser.uid;
        const userStoreDocRef = doc(db, 'artifacts', appId, 'users', userId, 'store_data', 'main_store_data');
        
        setIsCloudSyncing(true);
        try {
          await setDoc(userStoreDocRef, {
            storeSettings: overrides.storeSettings || storeSettings,
            products: overrides.products || products,
            transactions: overrides.transactions || transactions,
            draftOrders: overrides.draftOrders || draftOrders,
            customers: overrides.customers || customers,
            suppliers: overrides.suppliers || suppliers,
            expenses: overrides.expenses || expenses,
            rolePasswords: overrides.rolePasswords || rolePasswords,
            lastUpdated: new Date().toISOString(),
            userEmail: authUser.email || '',
            userName: authUser.displayName || ''
          }, { merge: true });
        } catch (e) {
          console.error("Gagal sinkronisasi data cloud:", e);
        } finally {
          setIsCloudSyncing(false);
        }
      }, [authUser, storeSettings, products, transactions, draftOrders, customers, suppliers, expenses, rolePasswords]);

      // Handle Login Google
      const handleGoogleLogin = async () => {
        setIsLoggingIn(true);
        try {
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          await signInWithPopup(auth, provider);
          showToast('Berhasil masuk dengan Akun Google!');
        } catch (err) {
          console.error("Google Auth error:", err);
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
              showToast('Berhasil terhubung akun!');
            } else {
              await signInAnonymously(auth);
              showToast('Masuk dengan sesi cloud privat');
            }
          } catch (anonErr) {
            showToast('Gagal masuk: ' + (err.message || 'Periksa koneksi'), 'error');
          }
        } finally {
          setIsLoggingIn(false);
        }
      };

      // Handle Masuk Mode Demo
      const handleEnterDemoMode = () => {
        setIsDemoMode(true);
        setStoreSettings({ ...defaultSettings, name: 'Toko Demo POSPro' });
        setProducts(defaultProducts);
        setTransactions(demoTransactions);
        setCustomers([
          { id: 'CUST-001', name: 'Budi Santoso', phone: '081298765432', address: 'Jakarta Selatan', totalTrx: 1, totalSpent: 38000, debt: 0 },
          { id: 'CUST-002', name: 'Siti Rahma', phone: '085712349988', address: 'Bandung', totalTrx: 0, totalSpent: 0, debt: 50000 }
        ]);
        setSuppliers([
          { id: 'SUP-001', name: 'PT. Kopi Nusantara', contactPerson: 'Hendra', phone: '0811223344', address: 'Jakarta', totalPurchases: 540000, debt: 0 }
        ]);
        setExpenses([
          { id: 'EXP-101', date: new Date().toLocaleDateString('id-ID'), category: 'Listrik', amount: 150000, note: 'Token Listrik Toko' }
        ]);
        setCurrentUserRole({ name: 'Kasir Demo', role: 'owner', avatar: 'DM' });
        showToast('Masuk sebagai Mode Demo! Data siap dicoba.');
      };

      // Handle Logout
      const handleExecuteLogout = async () => {

          }
          setIsDemoMode(false);
          showToast('Berhasil keluar.');
        } catch (e) {
          showToast('Gagal keluar akun', 'error');
        }
      };

      const [cart, setCart] = useState([]);
      const [discount, setDiscount] = useState(0);
      const [cashReceived, setCashReceived] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Semua');
      const [paymentMethod, setPaymentMethod] = useState('Cash');
      const [transactionNote, setTransactionNote] = useState('');
      
      const [showDraftSaveModal, setShowDraftSaveModal] = useState(false);
      const [draftNameInput, setDraftNameInput] = useState('');
      const [showDraftListModal, setShowDraftListModal] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      // State Scanner Kamera Barcode
      const [scannerModal, setScannerModal] = useState({
        isOpen: false,
        target: 'pos',
        continuousMode: true,
        lastScanned: null,
        errorMsg: '',
        isLoadingCamera: false
      });
      const [isProcessingImage, setIsProcessingImage] = useState(false);
      const scannerInstanceRef = useRef(null);
      const lastScanTimeRef = useRef(0);
      const cameraNativeInputRef = useRef(null);
      const galleryInputRef = useRef(null);

      // Modals
      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [productForm, setProductForm] = useState({ sku: '', name: '', costPrice: '', price: '', packPrice: '', stock: '', category: 'Umum', supplier: '' });

      const [showRestockModal, setShowRestockModal] = useState(false);
      const [restockForm, setRestockForm] = useState({ supplier: '', date: new Date().toISOString().split('T')[0], items: [{ productId: '', qty: '' }], totalBill: '', paidAmount: '', paymentStatus: 'Lunas' });

      const [showStockOutModal, setShowStockOutModal] = useState(false);
      const [stockOutForm, setStockOutForm] = useState({ reason: 'Barang rusak', date: new Date().toISOString().split('T')[0], items: [{ productId: '', qty: '' }] });

      const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
      const [editingCustomer, setEditingCustomer] = useState(null);
      const [customerForm, setCustomerForm] = useState({ name: '', phone: '', address: '' });
      const [selectedCustomerPOS, setSelectedCustomerPOS] = useState('');

      const [isSupplierModalOpen, setIsSupplierModalOpen] = useState(false);
      const [editingSupplier, setEditingSupplier] = useState(null);
      const [supplierForm, setSupplierForm] = useState({ name: '', contactPerson: '', phone: '', address: '' });

      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [expenseForm, setExpenseForm] = useState({ category: 'Listrik', amount: '', date: new Date().toISOString().split('T')[0], note: '' });

      const [paymentModalCustomer, setPaymentModalCustomer] = useState(null);
      const [customerPayAmount, setCustomerPayAmount] = useState('');

      const [paymentModalSupplier, setPaymentModalSupplier] = useState(null);
      const [supplierPayAmount, setSupplierPayAmount] = useState('');

      const [viewingTransaction, setViewingTransaction] = useState(null);
      const [reportPeriod, setReportPeriod] = useState('month');

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const fileInputRef = useRef(null);

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 2500);
      };

      const addToCart = useCallback((product) => {
        if (!product) return false;
        if (product.stock <= 0) { 
          showToast('Stok barang habis!', 'error'); 
          return false; 
        }
        let success = true;
        setCart(prevCart => {
          const existingItem = prevCart.find(item => item.product.id === product.id);
          if (existingItem) {
            if (existingItem.qty >= product.stock) {
              showToast(`Maksimal stok tercapai untuk ${product.name}!`, 'error');
              success = false;
              return prevCart;
            }
            return prevCart.map(item => item.product.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          } else {
            return [...prevCart, { product, qty: 1, discountRp: '' }];
          }

      const addRowDynamicList = (state, setState) => {
        setState({ ...state, items: [...state.items, { productId: '', qty: '' }] });
      };

      const updateDynamicList = (state, setState, index, field, value) => {
        const items = [...state.items];
        items[index][field] = value;
        setState({ ...state, items });
      };

      const categories = useMemo(() => ['Semua', ...Array.from(new Set(products.map(p => p.category || 'Umum')))], [products]);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchesCat = selectedCategory === 'Semua' || p.category === selectedCategory;
          const q = searchQuery.toLowerCase();
          const matchesSearch = p.name.toLowerCase().includes(q) || (p.sku && p.sku.toLowerCase().includes(q));
          return matchesCat && matchesSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      const renderDashboard = () => {
        const totalNilaiPenjualan = transactions.reduce((sum, t) => sum + (t.subtotal || t.total || 0), 0);
        const totalNilaiAkhir = transactions.reduce((sum, t) => sum + (t.total || 0), 0);
        
        let totalHPP = 0;
        transactions.forEach(t => {
          (t.items || []).forEach(item => {
            if (item.product) {
              const prod = products.find(p => p.id === item.product.id);
              const cost = prod ? prod.costPrice : (item.product.costPrice || 0);
              totalHPP += cost * item.qty;
            }
          });
        });

        const totalPengeluaran = expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
        const totalProfit = (totalNilaiAkhir - totalHPP) - totalPengeluaran;

        const categoryStats = [
          { name: 'Jenis 1 (Minuman)', cat: 'Minuman', color: '#ff4b8b' },
          { name: 'Jenis 2 (Makanan)', cat: 'Makanan', color: '#00d2d3' },
          { name: 'Jenis 3 (Snack/Umum)', cat: 'Snack', color: '#ff8a3d' }
        ].map((c) => {
          const prodsInCat = products.filter(p => p.category && p.category.toLowerCase().includes(c.cat.toLowerCase()));
          const stock = prodsInCat.reduce((sum, p) => sum + (p.stock || 0), 0);
          
          let sold = 0;
          let sales = 0;
          transactions.forEach(t => {
            (t.items || []).forEach(i => {
              if (i.product && prodsInCat.some(p => p.id === i.product.id)) {
                sold += i.qty;
                sales += ((i.product.price - (Number(i.discountRp) || 0)) * i.qty);
              }
            });
          });

          const total = stock + sold;
          const percentage = total > 0 ? Math.round((sold / total) * 100) : 50;

          return {
            title: c.name,
            stock,
            sold,
            total,
            sales,
            percentage,
            color: c.color
          };
        });

        const productStats = products.slice(0, 10).map((p, idx) => {
          let sold = 0;
          transactions.forEach(t => {
            (t.items || []).forEach(i => {
              if (i.product && i.product.id === p.id) {
                sold += i.qty;
              }
            });
          });
          const initial = p.stock + sold;
          const remaining = p.stock;
          const soldPercentage = initial > 0 ? Math.round((sold / initial) * 100) : 0;
          const labelLaku = soldPercentage >= 70 ? 'Barang Sangat Laku' : soldPercentage >= 40 ? 'Barang Laku' : 'Barang Kurang Laku';

          return {
            name: `Barang ${idx + 1}`,
            fullName: p.name,
            initial,
            sold,
            remaining,
            soldPercentage,
            labelLaku
          };
        });

        const maxBarVal = Math.max(...productStats.map(ps => Math.max(ps.initial, ps.sold, ps.remaining, 10)), 50);

        return (
          <div className="p-3 sm:p-6 pb-28 lg:pb-8 space-y-4 max-w-7xl mx-auto">
            {/* Banner Mode Demo jika aktif */}
            {isDemoMode && (
              <div className="bg-gradient-to-r from-amber-500/20 via-orange-500/20 to-purple-500/20 border border-amber-500/40 p-3 sm:p-4 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-3 shadow-lg">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-2xl bg-amber-500/30 text-amber-300 flex items-center justify-center shrink-0">
                    <Icon name="sparkles" className="w-5 h-5"/>
                  </div>
                  <div>
                    <h4 className="text-xs sm:text-sm font-black text-white">Anda Sedang Menggunakan Mode Demo</h4>
                    <p className="text-[11px] text-amber-200/80">Data tersimpan sementara. Hubungkan akun Google untuk menyimpan data toko Anda ke Cloud.</p>
                  </div>
                </div>
                <button 
                  onClick={handleGoogleLogin} 
                  className="w-full sm:w-auto px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-md shrink-0"
                >
                  <Icon name="cloud" className="w-4 h-4"/>
                  <span>Simpan ke Akun Google</span>
                </button>
              </div>
            )}

            {/* BARIS 1: 3 Donut Chart Kategori & 4 Kotak Metrik KPI */}

                {categoryStats.map((cat, idx) => {
                  const strokeDashoffset = 283 - (283 * cat.percentage) / 100;
                  return (
                    <div 
                      key={idx} 
                      className={`p-4 rounded-3xl border flex flex-col items-center justify-between text-center transition-all ${
                        theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-lg' : 'bg-white border-slate-200 shadow-sm'

                          {cat.title}
                        </span>
                      </div>

                      <div className="relative w-28 h-28 my-3 flex items-center justify-center">
                        <svg className="w-full h-full -rotate-90" viewBox="0 0 112 112">
                          <circle
                            cx="56"
                            cy="56"
                            r="45"
                            stroke={theme === 'dark' ? '#21254d' : '#e2e8f0'}
                            strokeWidth="12"
                            fill="transparent"
                          />
                          <circle
                            cx="56"
                            cy="56"
                            r="45"
                            stroke={cat.color}
                            strokeWidth="12"
                            strokeDasharray="283"
                            strokeDashoffset={strokeDashoffset}
                            strokeLinecap="round"
                            fill="transparent"
                            style={{ transition: 'stroke-dashoffset 0.8s ease' }}

                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                          <span className={`text-xl font-black ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>
                            {cat.percentage}%
                          </span>
                        </div>

                        <span className="absolute -top-1 left-2 text-[9px] font-bold text-slate-400">{cat.stock}</span>
                        <span className="absolute -bottom-1 left-2 text-[9px] font-bold text-slate-400">{cat.sold}</span>
                        <span className="absolute top-1/2 -right-1 -translate-y-1/2 text-[9px] font-bold text-slate-400">{cat.total}</span>
                      </div>

                      <div className="w-full mt-1">
                        <div className="w-full py-1.5 px-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-black text-xs shadow-md">

                        <p className={`text-[10px] font-bold mt-1.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>

                      </div>
                    </div>

                    <div className="w-8 h-8 rounded-xl bg-pink-500/20 text-[#ff4b8b] flex items-center justify-center border border-pink-500/30">
                      <Icon name="banknote" className="w-4 h-4"/>
                    </div>
                    <span className={`text-[11px] font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Nilai Penjualan
                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-[#ff4b8b] tracking-tight truncate">

                    </h3>
                    <p className={`text-[10px] mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Total Nilai Penjualan
                    </p>
                  </div>
                </div>

                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${
                  theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-lg' : 'bg-white border-slate-200 shadow-sm'
                }`}>
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-cyan-500/20 text-[#00d2d3] flex items-center justify-center border border-cyan-500/30">
                      <Icon name="wallet" className="w-4 h-4"/>
                    </div>
                    <span className={`text-[11px] font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Akhir Penjualan
                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-[#00d2d3] tracking-tight truncate">
                      {formatMoney(totalNilaiAkhir)}

                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${

                  <div className="mt-3">

                  </div>
                </div>

                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${
                  theme === 'dark' ? 'bg-gradient-to-br from-[#1e1b4b] to-[#181b3b] border-indigo-500/40 text-white shadow-lg' : 'bg-indigo-50 border-indigo-200'

                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center border border-indigo-500/30">

                    </div>
                    <span className="text-[11px] font-bold uppercase tracking-wider text-indigo-400">

                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-emerald-400 tracking-tight truncate">
                      {formatMoney(totalProfit)}
                    </h3>
                    <p className={`text-[10px] mt-0.5 ${theme === 'dark' ? 'text-indigo-200' : 'text-indigo-600'}`}>
                      Total Nilai Profit
                    </p>
                  </div>
                </div>

              </div>

            </div>

            {/* BARIS 2: Grafik Persediaan Barang & Grafik Barang Laku Horizontal */}

              <div className={`lg:col-span-7 p-4 sm:p-6 rounded-3xl border flex flex-col justify-between transition-all ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-xl' : 'bg-white border-slate-200 shadow-sm text-slate-800'
              }`}>
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
                  <div className="flex items-center gap-2">
                    <Icon name="bar-chart-3" className="w-5 h-5 text-[#00d2d3]" />
                    <h3 className="font-extrabold text-sm sm:text-base tracking-tight">Grafik Persediaan Barang</h3>
                  </div>

                  <div className="flex items-center gap-3 text-[10px] font-bold">
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#00d2d3]"></span> Jumlah Awal</span>
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#ff8a3d]"></span> Terjual</span>
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#ff4b8b]"></span> Jumlah Akhir</span>
                  </div>
                </div>

                <div className="h-60 sm:h-72 flex items-end gap-2 sm:gap-4 pt-4 border-b border-slate-700/50 pb-2 overflow-x-auto no-scrollbar">
                  {productStats.map((item, idx) => {
                    const hInitial = (item.initial / maxBarVal) * 100;
                    const hSold = (item.sold / maxBarVal) * 100;
                    const hRemaining = (item.remaining / maxBarVal) * 100;

                    return (
                      <div key={idx} className="flex-1 min-w-[50px] flex flex-col items-center h-full justify-end group">
                        <div className="flex items-end justify-center gap-1 w-full h-[82%]">
                          <div className="w-2.5 sm:w-3.5 bg-[#00d2d3] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hInitial}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#00d2d3] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.initial}
                            </span>
                          </div>
                          <div className="w-2.5 sm:w-3.5 bg-[#ff8a3d] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hSold}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#ff8a3d] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.sold}
                            </span>
                          </div>
                          <div className="w-2.5 sm:w-3.5 bg-[#ff4b8b] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hRemaining}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#ff4b8b] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.remaining}
                            </span>
                          </div>
                        </div>

                        <p className={`mt-2 text-[10px] font-bold truncate max-w-[55px] text-center ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>
                          {item.name}
                        </p>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className={`lg:col-span-5 p-4 sm:p-6 rounded-3xl border flex flex-col justify-between transition-all ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-xl' : 'bg-white border-slate-200 shadow-sm text-slate-800'
              }`}>
                <div className="flex items-center gap-2 mb-4">
                  <Icon name="activity" className="w-5 h-5 text-[#00d2d3]" />
                  <h3 className="font-extrabold text-sm sm:text-base tracking-tight">Grafik Barang Laku</h3>
                </div>

                <div className="space-y-3 flex-1 flex flex-col justify-center">
                  {productStats.slice(0, 6).map((item, idx) => (
                    <div key={idx} className="space-y-1">
                      <div className="flex justify-between items-center text-xs">
                        <span className={`font-bold truncate max-w-[140px] ${theme === 'dark' ? 'text-slate-300' : 'text-slate-700'}`}>
                          {item.fullName}
                        </span>
                        <span className="text-[10px] font-bold text-[#00d2d3]">
                          {item.labelLaku} ; {item.soldPercentage}%
                        </span>
                      </div>
                      <div className={`w-full h-3 rounded-full overflow-hidden ${theme === 'dark' ? 'bg-[#21254d]' : 'bg-slate-100'}`}>
                        <div 
                          className="h-full bg-gradient-to-r from-[#00d2d3] to-[#6366f1] rounded-full transition-all duration-700" 
                          style={{ width: `${item.soldPercentage}%` }}
                        ></div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex justify-between text-[9px] font-bold text-slate-400 pt-3 border-t border-slate-700/40 mt-3">
                  <span>0%</span>
                  <span>20%</span>
                  <span>40%</span>
                  <span>60%</span>
                  <span>80%</span>
                  <span>100%</span>
                </div>
              </div>

            </div>

          </div>
        );
      };

      if (isAuthLoading) {
        return (
          <div className="min-h-screen bg-[#0f1228] text-white flex flex-col items-center justify-center p-6 text-center">
            <div className="w-12 h-12 border-4 border-indigo-500/30 border-t-[#00d2d3] rounded-full animate-spin mb-4"></div>
            <p className="text-sm font-bold text-slate-300">Menghubungkan ke POSPro...</p>
          </div>
        );
      }

      if (!authUser && !isDemoMode) {
        return (
          <div className="min-h-screen bg-[#0f1228] text-white flex items-center justify-center p-4 relative overflow-hidden">
            {/* Background Glow Blobs */}
            <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none -translate-x-1/2 -translate-y-1/2"></div>
            <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none translate-x-1/2 translate-y-1/2"></div>
            
            <div className="w-full max-w-md bg-[#181b3b] border border-[#2a2f60] rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 space-y-6">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center mx-auto shadow-lg glow-indigo">
                  <Icon name="store" className="w-7 h-7 text-white"/>

                <p className="text-xs text-slate-400">Sistem Kasir, Manajemen Stok & Analisis Bisnis Toko</p>
              </div>

              {/* Card List Keunggulan */}
              <div className="bg-[#21254d]/60 border border-[#2a2f60] rounded-2xl p-3.5 space-y-2 text-xs">

                  className="w-full py-3.5 px-4 bg-white hover:bg-slate-100 text-slate-900 rounded-2xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-3 shadow-xl active:scale-[0.98] transition-all disabled:opacity-60"

        const isReadyToPay = cart.length > 0 && (isPaymentExact || (paymentMethod === 'Cash' && cashReceived && parseInt(cashReceived) >= grandTotal) || (paymentMethod === 'Hutang')); 

        return (
          <div className={`flex flex-col h-full ${theme === 'dark' ? 'bg-[#181b3b] text-white' : 'bg-white text-slate-800'}`}>
            <div className={`p-4 border-b flex flex-col gap-2.5 shrink-0 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
              <div className="flex justify-between items-center">
                <h2 className="font-extrabold flex items-center gap-2 text-sm sm:text-base">
                  <Icon name="shopping-bag" className="w-5 h-5 text-[#00d2d3]" /> Rincian Pesanan
                </h2>
                <div className="flex items-center gap-2">
                  <span className="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 text-xs font-black px-2.5 py-1 rounded-full">
                    {totalItemCount} Item
                  </span>
                  <button onClick={() => setShowMobileCartDrawer(false)} className="lg:hidden p-1 text-slate-400 hover:text-white bg-slate-800 rounded-lg">
                    <Icon name="x" className="w-5 h-5"/>
                  </button>
                </div>
              </div>
              <div className={`flex items-center gap-2 rounded-2xl p-2 border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50 border-slate-200'}`}>
                <Icon name="user" className="w-4 h-4 text-slate-400 ml-1 shrink-0" />
                <select 
                  value={selectedCustomerPOS} 
                  onChange={(e) => setSelectedCustomerPOS(e.target.value)} 
                  className="w-full bg-transparent border-none outline-none text-xs sm:text-sm font-semibold cursor-pointer"
                >
                  <option value="" className={theme === 'dark' ? 'bg-[#181b3b] text-white' : ''}>Pelanggan Umum (Walk-in)</option>
                  {customers.map(c => <option key={c.id} value={c.id} className={theme === 'dark' ? 'bg-[#181b3b] text-white' : ''}>{c.name}</option>)}
                </select>
              </div>
            </div>

            <div className={`flex-1 overflow-y-auto p-3 space-y-2.5 ${theme === 'dark' ? 'bg-[#0f1228]/50' : 'bg-slate-50'}`}>
              {cart.length === 0 ? (
                <div className="h-full min-h-[180px] flex flex-col items-center justify-center text-slate-400 opacity-60 space-y-2">
                  <Icon name="shopping-bag" className="w-12 h-12" />
                  <p className="text-xs font-bold">Keranjang masih kosong</p>
                  <p className="text-[10px]">Pilih produk atau scan barcode fisik kemasan.</p>
                </div>
              ) : (
                cart.map(item => (
                  <div key={item.product.id} className={`p-3 rounded-2xl border flex flex-col shadow-sm transition-all ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'
                  }`}>
                    <div className="flex justify-between items-start">
                      <div className="flex-1 pr-2">
                        <p className="font-extrabold text-xs sm:text-sm line-clamp-1">{item.product.name}</p>
                        <div className="flex items-center gap-2 mt-0.5">
                          <span className="text-[#00d2d3] font-bold text-xs">{formatMoney(item.product.price)}</span>
                          {item.discountRp > 0 && <span className="text-[10px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded font-bold">- {formatMoney(item.discountRp)}</span>}
                        </div>
                      </div>
                      <button onClick={() => removeFromCart(item.product.id)} className="p-1 text-slate-400 hover:text-rose-400 transition-colors">
                        <Icon name="trash-2" className="w-4 h-4" />
                      </button>
                    </div>
                    <div className={`flex justify-between items-center pt-2 mt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                      <div className="flex items-center gap-1">
                        <span className="text-[10px] text-slate-400 font-bold">Disc:</span>
                        <input 
                          type="number" 
                          placeholder="Rp" 
                          value={item.discountRp} 
                          onChange={(e) => updateItemDiscount(item.product.id, e.target.value)} 
                          className={`w-16 rounded-lg px-2 py-0.5 text-xs font-medium outline-none border ${
                            theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                          }`} 
                        />
                      </div>
                      <div className={`flex items-center rounded-xl border p-0.5 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-100 border-slate-200'}`}>
                        <button onClick={() => updateQty(item.product.id, -1)} className="w-7 h-7 flex items-center justify-center hover:bg-white/10 rounded-lg font-bold text-sm">-</button>
                        <span className="w-7 text-center font-bold text-xs">{item.qty}</span>
                        <button onClick={() => updateQty(item.product.id, 1)} className="w-7 h-7 flex items-center justify-center hover:bg-white/10 rounded-lg font-bold text-sm">+</button>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>

            <div className={`p-4 border-t shadow-2xl space-y-3 shrink-0 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
              <div className="grid grid-cols-2 gap-2">
                <input 
                  type="text" 
                  placeholder="Catatan struk..." 
                  value={transactionNote} 
                  onChange={(e) => setTransactionNote(e.target.value)} 
                  className={`w-full text-xs rounded-xl p-2.5 outline-none border ${
                    theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                  }`} 
                />
                <select 
                  value={paymentMethod} 
                  onChange={(e) => setPaymentMethod(e.target.value)} 
                  className={`w-full text-xs font-bold rounded-xl p-2.5 outline-none border cursor-pointer ${
                    theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                  }`}
                >
                  {storeSettings.paymentMethods.map(m => (<option key={m} value={m} className={theme === 'dark' ? 'bg-[#181b3b]' : ''}>{m}</option>))}
                </select>
              </div>

              <div className="space-y-1.5 text-xs">
                <div className="flex justify-between text-slate-400"><span>Subtotal:</span><span className="font-bold">{formatMoney(subtotal)}</span></div>
                {discount > 0 && (<div className="flex justify-between text-[#00d2d3]"><span>Diskon ({discount}%):</span><span>-{formatMoney(discountAmount)}</span></div>)}
                {Number(storeSettings.taxPercent) > 0 && (<div className="flex justify-between text-slate-400"><span>Pajak ({storeSettings.taxPercent}%):</span><span>{formatMoney(taxAmount)}</span></div>)}
                <div className={`flex justify-between items-baseline pt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                  <span className="font-black text-xs uppercase text-slate-400">Total Tagihan</span>
                  <span className="text-xl sm:text-2xl font-black text-[#00d2d3]">{formatMoney(grandTotal)}</span>
                </div>
              </div>

              {(paymentMethod === 'Cash' || paymentMethod === 'Hutang') && (
                <div className="space-y-2">
                  <div className="flex gap-1.5">
                    <button onClick={() => handleQuickCash(grandTotal)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200 hover:bg-indigo-600' : 'bg-slate-100'}`}>Uang Pas</button>
                    <button onClick={() => handleQuickCash(50000)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200 hover:bg-indigo-600' : 'bg-slate-100'}`}>50k</button>
                    <button onClick={() => handleQuickCash(100000)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200 hover:bg-indigo-600' : 'bg-slate-100'}`}>100k</button>
                  </div>
                  <input 
                    type="number" 
                    placeholder="Nominal Uang Tunai..." 
                    value={cashReceived} 
                    onChange={(e) => setCashReceived(e.target.value)} 
                    className={`w-full px-3 py-2.5 rounded-xl text-sm font-black outline-none border ${
                      theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                    }`} 
                  />
                  {paymentMethod === 'Cash' && cashReceived && parseInt(cashReceived) >= grandTotal && (
                    <div className="flex justify-between items-center bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 p-2.5 rounded-xl text-xs font-bold">
                      <span>KEMBALIAN</span>
                      <span className="text-sm font-black">{formatMoney(parseInt(cashReceived) - grandTotal)}</span>
                    </div>
                  )}
                </div>
              )}

              <button 
                onClick={handleCheckout} 
                disabled={!isReadyToPay} 
                className="w-full py-3.5 bg-gradient-to-r from-[#6366f1] to-[#a855f7] hover:from-indigo-600 hover:to-purple-600 disabled:opacity-40 text-white rounded-2xl font-black text-sm sm:text-base shadow-lg transition-all flex items-center justify-center gap-2 active:scale-98"
              >
                <Icon name="check-circle" className="w-5 h-5" /> Selesaikan & Cetak Nota
              </button>
            </div>
          </div>
        );
      };

      const renderPOS = () => {
        return (
          <div className="flex flex-col lg:flex-row h-[calc(100vh-60px)] lg:h-screen overflow-hidden">
            <div className={`flex-1 flex flex-col h-full overflow-hidden border-r ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-200'}`}>
              <div className={`p-3 sm:p-4 border-b flex flex-col gap-2.5 shrink-0 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <div className="flex items-center gap-2">
                  <div className="relative flex-1">
                    <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" />
                    <input 
                      type="text" 
                      placeholder={isMobileDevice ? "Cari nama produk / kode SKU..." : "Cari nama / scan barcode dengan alat scanner..."} 
                      value={searchQuery} 
                      onChange={(e) => setSearchQuery(e.target.value)} 
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && searchQuery.trim()) {
                          const clean = searchQuery.trim().toUpperCase();
                          const found = products.find(p => (p.sku && p.sku.toUpperCase() === clean) || p.id === clean);
                          if (found) {
                            playScanBeep();
                            addToCart(found);
                            showToast(`+1 ${found.name} masuk keranjang!`);
                            setSearchQuery('');
                            e.preventDefault();
                          }
                        }
                      }}
                      className={`w-full pl-9 pr-3 py-2.5 rounded-2xl outline-none text-xs sm:text-sm font-medium border ${
                        theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white focus:border-[#00d2d3]' : 'bg-slate-100 border-transparent focus:bg-white focus:border-indigo-500'
                      }`} 
                    />
                  </div>

                  {isMobileDevice ? (
                    <button 
                      onClick={() => openScanner('pos')} 
                      className="px-3.5 py-2.5 bg-gradient-to-r from-[#00d2d3] to-[#6366f1] text-white rounded-2xl font-black text-xs flex items-center gap-1.5 shadow-md active:scale-95 transition-all shrink-0"
                    >
                      <Icon name="camera" className="w-4 h-4" />
                      <span>Scan Kamera</span>
                    </button>
                  ) : (
                    <div className={`hidden lg:flex items-center gap-1.5 px-3.5 py-2.5 rounded-2xl text-xs font-bold border shrink-0 ${
                      theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-300' : 'bg-slate-100 border-slate-200 text-slate-600'
                    }`}>
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      <Icon name="barcode" className="w-4 h-4 text-[#00d2d3]" />
                      <span>Scanner USB/BT Siap</span>
                    </div>
                  )}

                  <button onClick={() => setShowDraftSaveModal(true)} disabled={cart.length === 0} className={`p-2.5 rounded-2xl border disabled:opacity-30 ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-300' : 'bg-slate-100'}`} title="Tahan Pesanan"><Icon name="save" className="w-4 h-4" /></button>
                  <button onClick={() => setShowDraftListModal(true)} className={`p-2.5 rounded-2xl border relative ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-[#00d2d3]' : 'bg-indigo-50 text-indigo-600'}`} title="Pesanan Tertahan"><Icon name="folder" className="w-4 h-4" />{draftOrders.length > 0 && <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">{draftOrders.length}</span>}</button>
                </div>

                <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                  {categories.map(c => (
                    <button 
                      key={c} 
                      onClick={() => setSelectedCategory(c)} 
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all shrink-0 ${
                        selectedCategory === c 
                          ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-md' 
                          : (theme === 'dark' ? 'bg-[#21254d] text-slate-400 hover:text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200')
                      }`}
                    >
                      {c}
                    </button>
                  ))}
                </div>
              </div>

              <div className={`flex-1 overflow-y-auto p-3 sm:p-4 pb-28 lg:pb-4 ${theme === 'dark' ? 'bg-[#0f1228]' : 'bg-slate-50'}`}>
                <div className="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4">
                  {filteredProducts.map(product => {
                    const isOOS = product.stock === 0; const isLow = product.stock > 0 && product.stock <= 10;
                    return (
                      <button 
                        key={product.id} 
                        onClick={() => addToCart(product)} 
                        disabled={isOOS} 
                        className={`relative p-4 sm:p-5 rounded-3xl border text-left flex flex-col justify-between min-h-[135px] sm:min-h-[150px] transition-all active:scale-[0.98] ${
                          isOOS 
                            ? 'opacity-50 cursor-not-allowed bg-slate-800/40 border-slate-700' 
                            : (theme === 'dark' 
                                ? 'bg-[#181b3b] border-[#2a2f60] hover:border-[#00d2d3] shadow-lg hover:shadow-cyan-500/10' 
                                : 'bg-white border-slate-200 hover:border-indigo-500 shadow-sm')
                        }`}
                      >
                        {isOOS && (
                          <span className="absolute inset-0 bg-[#0f1228]/80 backdrop-blur-[2px] flex items-center justify-center rounded-3xl font-black text-rose-400 text-sm uppercase tracking-wider rotate-6 z-10">
                            Stok Habis
                          </span>
                        )}
                        
                        <div className="flex justify-between items-start gap-2 mb-2">
                          <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-lg truncate max-w-[110px] ${
                            theme === 'dark' ? 'bg-[#21254d] text-indigo-300' : 'bg-indigo-50 text-indigo-700'
                          }`}>
                            {product.category}
                          </span>
                          {!isOOS && (
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg shrink-0 ${
                              isLow ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : (theme === 'dark' ? 'bg-[#21254d] text-slate-300' : 'bg-slate-100 text-slate-600')
                            }`}>
                              Stok: {product.stock}
                            </span>
                          )}
                        </div>

                        <div className="my-auto py-1">
                          <h4 className={`font-extrabold text-sm sm:text-base leading-snug line-clamp-2 ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>
                            {product.name}
                          </h4>
                          <p className="text-[10px] font-mono text-slate-400 mt-0.5">{product.sku}</p>
                        </div>

                        <div className={`pt-2 mt-1 border-t flex items-baseline justify-between ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                          <p className="font-black text-base sm:text-lg text-[#00d2d3] tracking-tight">
                            {formatMoney(product.price)}
                          </p>
                          <span className="text-[10px] text-slate-400 font-bold hidden sm:inline">+ Tambah</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {cart.length > 0 && (
                <div className="lg:hidden fixed bottom-16 left-3 right-3 z-30 animate-in fade-in slide-in-from-bottom duration-200">
                  <div onClick={() => setShowMobileCartDrawer(true)} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-3.5 rounded-3xl shadow-2xl flex items-center justify-between cursor-pointer border border-indigo-400/30">
                    <div className="flex items-center gap-3">
                      <div className="bg-white/20 p-2 rounded-2xl"><Icon name="shopping-cart" className="w-5 h-5"/></div>
                      <div>
                        <p className="text-xs text-indigo-200 font-semibold">{totalItemCount} Item Terpilih</p>
                        <p className="text-base font-black">{formatMoney(grandTotal)}</p>
                      </div>
                    </div>
                    <span className="bg-white text-indigo-900 font-extrabold text-xs px-3.5 py-2 rounded-2xl flex items-center gap-1 shadow-md">Bayar <Icon name="chevron-right" className="w-4 h-4"/></span>
                  </div>
                </div>
              )}
            </div>

            <div className="hidden lg:flex w-[380px] xl:w-[420px] h-full">
              {renderCartContent()}
            </div>

            {showMobileCartDrawer && (
              <div className="lg:hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex flex-col justify-end">
                <div className="rounded-t-3xl h-[88vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-300">
                  {renderCartContent()}
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderReports = () => {
        const now = new Date(); 
        const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startOfWeek = new Date(todayDate); startOfWeek.setDate(todayDate.getDate() - todayDate.getDay());
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1); 
        const startOfYear = new Date(now.getFullYear(), 0, 1);

        const filteredTrx = transactions.filter(t => {
          const tDate = parseDateStr(t.date);
          if (reportPeriod === 'today') return tDate >= todayDate;
          if (reportPeriod === 'week') return tDate >= startOfWeek;
          if (reportPeriod === 'month') return tDate >= startOfMonth;
          if (reportPeriod === 'year') return tDate >= startOfYear;
          return true;
        });

        const omzet = filteredTrx.reduce((sum, t) => sum + (t.total || 0), 0);
        let hpp = 0; 
        filteredTrx.forEach(t => { 
          (t.items || []).forEach(item => { 
            if (item.product) { 
              const prod = products.find(p => p.id === item.product.id); 
              const cost = prod ? prod.costPrice : (item.product.costPrice || 0); 
              hpp += cost * item.qty; 
            } 
          }); 
        });
        const labaKotor = omzet - hpp; 
        const pengeluaranTotal = expenses.reduce((sum, e) => sum + (e.amount || 0), 0); 
        const labaBersih = labaKotor - pengeluaranTotal;

        return (
          <div className="p-3 sm:p-6 pb-28 lg:pb-8 space-y-4 max-w-6xl mx-auto">
            <div className={`p-4 sm:p-6 rounded-3xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${
              theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200 text-slate-800'
            }`}>
              <div>
                <h2 className="text-xl sm:text-2xl font-black tracking-tight">Laporan Keuangan & Profit</h2>
                <p className={`text-xs mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Analisis omzet penjualan, harga pokok modal, dan laba bersih riil.</p>
              </div>
              <div className={`flex p-1 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-100 border-slate-200'}`}>
                {['today', 'week', 'month', 'year'].map(p => (
                  <button key={p} onClick={() => setReportPeriod(p)} className={`px-3 py-1.5 rounded-xl text-xs font-bold capitalize whitespace-nowrap ${reportPeriod === p ? 'bg-indigo-600 text-white shadow-md' : (theme === 'dark' ? 'text-slate-400' : 'text-slate-600')}`}>{p === 'today' ? 'Hari Ini' : p === 'week' ? 'Minggu' : p === 'month' ? 'Bulan Ini' : 'Tahun Ini'}</button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Omzet Penjualan</p>
                <p className="text-lg sm:text-xl font-black text-[#00d2d3] mt-1">{formatMoney(omzet)}</p>
              </div>
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Modal Pokok (HPP)</p>
                <p className="text-lg sm:text-xl font-black text-[#ff8a3d] mt-1">{formatMoney(hpp)}</p>
              </div>
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Beban Operasional</p>
                <p className="text-lg sm:text-xl font-black text-[#ff4b8b] mt-1">{formatMoney(pengeluaranTotal)}</p>
              </div>
              <div className={`p-4 rounded-3xl border bg-gradient-to-br from-indigo-900/60 to-purple-900/60 border-indigo-500/40 text-white`}>
                <p className="text-[10px] text-indigo-300 font-bold uppercase">Laba Bersih Toko</p>
                <p className="text-lg sm:text-xl font-black text-emerald-400 mt-1">{formatMoney(labaBersih)}</p>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className={`flex h-screen overflow-hidden font-sans transition-colors duration-300 ${
          theme === 'dark' ? 'bg-[#0f1228] text-slate-100' : 'bg-[#f4f6fb] text-slate-800'
        }`}>
          {toast.show && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 bg-slate-900/95 text-white backdrop-blur-md border border-slate-700 text-xs font-bold animate-in fade-in zoom-in">
              <Icon name={toast.type === 'error' ? "alert-circle" : "check-circle"} className={`w-4 h-4 ${toast.type === 'error' ? 'text-rose-400' : 'text-emerald-400'}`} />
              <span>{toast.message}</span>
            </div>
          )}

          {/* Sidebar Desktop */}
          <div className={`w-64 flex-col hidden lg:flex shadow-2xl z-30 border-r transition-all ${

              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center font-black text-white shadow-lg">

                <div>
                  <h1 className={`text-base font-black tracking-tight leading-none ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>
                    {storeSettings.name}
                  </h1>
                  <div className="flex items-center gap-1 mt-1">
                    <p className="text-[10px] font-bold text-[#00d2d3] uppercase tracking-widest">
                      {isDemoMode ? 'MODE DEMO' : 'CLOUD SYNC'}
                    </p>
                    {isCloudSyncing && <span className="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>}
                  </div>
                </div>
              </div>
            </div>
            
            {/* User Info Card */}
            <div className="px-4 mb-2">
              <div className={`p-3 rounded-2xl border flex items-center justify-between ${
                theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50 border-slate-200'
              }`}>
                <div className="flex items-center gap-2.5 overflow-hidden">
                  <div className="w-8 h-8 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-bold flex items-center justify-center text-xs shadow-md shrink-0">
                    {currentUser.avatar}
                  </div>
                  <div className="overflow-hidden">
                    <p className={`font-bold text-xs truncate ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>{currentUser.name}</p>
                    <div className="flex items-center gap-1.5 mt-0.5">
                      <span className="text-[9px] bg-indigo-500/20 text-indigo-400 px-1.5 py-0.5 rounded font-bold uppercase">{currentUser.role}</span>

                        <span className="text-[9px] text-slate-400 truncate max-w-[80px]" title={authUser.email}>
                          {authUser.email.split('@')[0]}
                        </span>
                      ) : isDemoMode ? (
                        <span className="text-[9px] text-amber-400 font-bold">Tamu</span>
                      ) : null}
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-1">
                  <button onClick={() => setShowRoleSwitcher(!showRoleSwitcher)} className="text-[10px] text-[#00d2d3] hover:underline font-bold px-1 py-0.5">Role</button>
                  <button 
                    onClick={() => setShowLogoutConfirm(true)} 
                    className="text-slate-400 hover:text-rose-400 p-1" 
                    title={isDemoMode ? "Keluar Demo" : "Keluar Akun Google"}
                  >
                    <Icon name="log-out" className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            </div>

            <nav className="flex-1 px-3 space-y-1.5 overflow-y-auto pt-2">

                { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard Data', roles: ['owner', 'admin'] },
                { id: 'pos', icon: 'calculator', label: 'Kasir (POS)', roles: ['owner', 'admin', 'kasir'] },
                { id: 'inventory', icon: 'package', label: 'Form Stok & Barang', roles: ['owner', 'admin', 'kasir'] },
                { id: 'customers', icon: 'users', label: 'Pelanggan & Piutang', roles: ['owner', 'admin'] },
                { id: 'suppliers', icon: 'truck', label: 'Supplier & Hutang', roles: ['owner'] },
                { id: 'expenses', icon: 'receipt', label: 'Biaya Pengeluaran', roles: ['owner'] },
                { id: 'reports', icon: 'pie-chart', label: 'Laporan Profit', roles: ['owner'] },
                { id: 'transactions', icon: 'history', label: 'Riwayat Nota', roles: ['owner', 'admin', 'kasir'] },
                { id: 'settings', icon: 'settings', label: 'Pengaturan Toko', roles: ['owner'] }
              ].filter(item => item.roles.includes(currentUser.role)).map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button 
                    key={item.id} 
                    onClick={() => setActiveTab(item.id)} 
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-bold transition-all ${
                      isActive 
                        ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/20 translate-x-1' 
                        : (theme === 'dark' ? 'hover:bg-[#21254d] text-slate-400 hover:text-white' : 'hover:bg-slate-100 text-slate-600')
                    }`}
                  >
                    <Icon name={item.icon} className={`w-4 h-4 ${isActive ? 'text-[#00d2d3]' : ''}`} />
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </nav>

            <div className={`p-4 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-200'}`}>
              <button 
                onClick={toggleTheme}
                className={`w-full py-2.5 px-3 rounded-2xl border flex items-center justify-between text-xs font-bold transition-all ${
                  theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-amber-300 hover:bg-[#282d5e]' : 'bg-slate-100 border-slate-200 text-slate-700'
                }`}
              >
                <span className="flex items-center gap-2">
                  <Icon name={theme === 'dark' ? "sun" : "moon"} className="w-4 h-4 text-amber-400" />
                  <span>{theme === 'dark' ? 'Mode Terang' : 'Mode Gelap'}</span>
                </span>
                <span className="text-[10px] uppercase opacity-70">{theme}</span>
              </button>
            </div>
          </div>

            {/* Topbar Mobile */}

            }`}>

                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center font-black text-xs text-white shrink-0">
                  {currentUser.avatar}
                </div>
                <div className="overflow-hidden">
                  <h1 className="text-xs font-black tracking-tight leading-none truncate max-w-[130px]">{storeSettings.name}</h1>
                  <span className="text-[9px] text-[#00d2d3] font-bold uppercase">{isDemoMode ? 'Demo' : currentUser.role}</span>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button 
                  onClick={toggleTheme} 
                  className={`p-2 rounded-xl border ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-amber-300' : 'bg-slate-100 border-slate-200 text-slate-700'}`}

                >
                  <Icon name={theme === 'dark' ? "sun" : "moon"} className="w-4 h-4" />
                </button>
                <button onClick={() => setShowRoleSwitcher(true)} className={`px-2 py-1.5 rounded-xl text-[10px] font-bold border ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-[#00d2d3]' : 'bg-slate-100 border-slate-200'}`}>Role</button>
                <button 
                  onClick={() => setShowLogoutConfirm(true)} 
                  className="p-2 text-slate-400 hover:text-rose-400 bg-slate-800/40 rounded-xl"

                  <Icon name="log-out" className="w-4 h-4" />
                </button>
              </div>
            </div>

                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">

                  }`}>
                    <div>
                      <h2 className="text-xl sm:text-2xl font-black tracking-tight">Katalog Produk & Stok</h2>
                      <p className={`text-xs mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Kelola data stok dan tambah stok cepat dengan kamera barcode.</p>
                    </div>
                    <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                      <button 
                        onClick={() => openScanner('inventory_restock')}

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POSPro - Sistem Kasir & Manajemen Toko Berlisensi</title>
  
  <!-- Tailwind CSS & Konfigurasi Tema -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0f1228',
              card: '#181b3b',
              card2: '#21254d',
              border: '#2a2f60',
              accent: '#6366f1',
              cyan: '#00d2d3',
              pink: '#ff4b8b',
              orange: '#ff8a3d',
              purple: '#8b5cf6'
            }
          }
        }
      }
    }
  </script>

  <!-- Pustaka React, Lucide Icon, Html5Qrcode Scanner, & MQTT Realtime Sync -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-sizing: border-box;
    }
    
    body { 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      margin: 0; 
      padding: 0;
      overscroll-behavior-y: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }
    
    .lucide-icon { display: inline-flex; align-items: center; justify-content: center; }
    .pb-safe { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
    .pt-safe { padding-top: calc(0.75rem + env(safe-area-inset-top, 0px)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes scanLaser {
      0% { top: 12%; opacity: 0.85; }
      50% { top: 88%; opacity: 1; }
      100% { top: 12%; opacity: 0.85; }
    }
    .scanner-laser-line {
      position: absolute;
      left: 8%;
      right: 8%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00d2d3, #22c55e, #00d2d3, transparent);
      box-shadow: 0 0 16px 3px rgba(0, 210, 211, 0.9);
      animation: scanLaser 2s infinite ease-in-out;
      border-radius: 9999px;
      z-index: 25;
      pointer-events: none;
    }

    #scanner-reader {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      background: #000 !important;
      border: none !important;
      overflow: hidden !important;
    }
    #scanner-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }
    #scanner-reader canvas, #scanner-reader__dashboard {
      display: none !important;
    }
  </style>
</head>
<body class="bg-[#0f1228] text-slate-100 antialiased select-none dark">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback, Component } = React;

    // =========================================================================
    // ⚙️ KONFIGURASI BACKEND GOOGLE APPS SCRIPT
    // =========================================================================
    const GOOGLE_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxuFSxfNHcc3t4pc2a_vKH-dEwGjTUfrgmv6o5hESpPBySkSf0Ju8FWNHrz-edH9gc/exec";
    const APP_SECRET_TOKEN = "POSPRO_SECURITY_KEY_2026_X9";

    // Komponen Penangkap Kesalahan Runtime (ErrorBoundary)
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("POSPro Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#0f1228] text-white flex flex-col items-center justify-center p-6 text-center font-sans">
              <div className="bg-[#181b3b] p-6 rounded-3xl border border-[#2a2f60] max-w-md w-full shadow-2xl space-y-4">
                <div className="w-14 h-14 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto">
                  <i data-lucide="alert-triangle" className="w-8 h-8"></i>
                </div>
                <h2 className="text-lg font-black text-white">Memuat Ulang POSPro</h2>
                <p className="text-xs text-slate-400">Data kasir Anda tersimpan dengan aman. Klik tombol di bawah untuk memuat ulang.</p>
                <button 
                  onClick={() => window.location.reload()} 
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl text-xs shadow-lg transition-all cursor-pointer"
                >
                  Muat Ulang Sekarang
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Helper Ikon Lucide
    const Icon = ({ name, className = "w-5 h-5", title }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          try {
            iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
            window.lucide.createIcons({ root: iconRef.current, nameAttr: 'data-lucide' });
          } catch (e) {}
        }
      }, [name, className]);
      return <span ref={iconRef} className={`lucide-icon shrink-0 ${className}`} title={title || name} />;
    };

    // Helper Format Mata Uang dan Tanggal
    const generateId = () => Math.random().toString(36).substr(2, 9);
    const formatMoney = (amount) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount || 0);

    const parseDateStr = (dateStr) => {
      if (!dateStr) return new Date();
      try {
        const parts = String(dateStr).split(', ');
        if (parts.length !== 2) return new Date();
        const [d, m, y] = parts[0].split('/');
        const [hr, min, sec] = parts[1].split('.');
        return new Date(y, m - 1, d, hr, min, sec);
      } catch (e) {
        return new Date();
      }
    };

    // Audio beep untuk pemindai barcode
    const playScanBeep = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1900, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    };

    // Data Bawaan / Master Template
    const defaultSettings = {
      name: 'Toko Saya', tagline: 'Sistem Kasir Pintar & Terlisensi', phone: '081234567890', address: 'Jl. Bisnis Sukses No. 88',
      receiptFooter: 'Terima kasih atas kunjungan Anda!\nBarang yang dibeli tidak dapat ditukar.', invoicePrefix: 'INV-', taxPercent: 0, defaultDiscount: 0, currency: 'IDR',
      paymentMethods: ['Cash', 'Debit', 'Transfer', 'QRIS', 'E-wallet', 'Hutang']
    };

    const defaultProducts = [
      { id: '1', sku: 'BRG-001', name: 'Kopi Susu Gula Aren', costPrice: 12000, price: 18000, packPrice: 0, stock: 45, category: 'Minuman', supplier: 'PT. Kopi Nusantara' },
      { id: '2', sku: 'BRG-002', name: 'Nasi Goreng Spesial', costPrice: 15000, price: 25000, packPrice: 0, stock: 20, category: 'Makanan', supplier: 'Pasar Induk' },
      { id: '3', sku: 'BRG-003', name: 'Es Teh Manis Jumbo', costPrice: 2500, price: 6000, packPrice: 0, stock: 80, category: 'Minuman', supplier: 'PT. Sumber Segar' },
      { id: '4', sku: 'BRG-004', name: 'Roti Bakar Coklat Keju', costPrice: 10000, price: 17000, packPrice: 0, stock: 15, category: 'Makanan', supplier: 'Bakery Prima' },
      { id: '5', sku: 'BRG-005', name: 'Keripik Kentang Renyah', costPrice: 6000, price: 10000, packPrice: 0, stock: 35, category: 'Snack', supplier: 'Sentra Camilan' }
    ];

    const loadFromLocal = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    };

    const saveToLocal = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    };

    function App() {
      // 1. STATE LISENSI GOOGLE SHEETS
      const [licenseData, setLicenseData] = useState(() => loadFromLocal('pospro_cloud_license', null));
      const [licenseInputKey, setLicenseInputKey] = useState('');
      const [licenseStoreName, setLicenseStoreName] = useState('');
      const [licenseError, setLicenseError] = useState('');
      const [isVerifyingLicense, setIsVerifyingLicense] = useState(false);
      const [showExtendModal, setShowExtendModal] = useState(false);
      const [extendInputKey, setExtendInputKey] = useState('');
      const [isExtendingLicense, setIsExtendingLicense] = useState(false);

      // Multi-tenant Isolation Prefix berdasarkan Vault ID Lisensi
      const userStoragePrefix = useMemo(() => {
        if (!licenseData || !licenseData.vaultId) return 'pospro_default_vault';
        return `pospro_vault_${licenseData.vaultId}`;
      }, [licenseData]);

      // Status Validitas & Sisa Hari Lisensi
      const licenseStatus = useMemo(() => {
        if (!licenseData) return { isActivated: false, isExpired: true, daysRemaining: 0, label: 'Belum Terdaftar' };
        if (licenseData.isDemo) return { isActivated: true, isDemo: true, isExpired: false, daysRemaining: 999, label: 'Mode Uji Coba (Demo)' };
        if (licenseData.durationDays >= 9999 || licenseData.isLifetime) {
          return { isActivated: true, isLifetime: true, isExpired: false, daysRemaining: 99999, label: 'Aktif Selamanya (Lifetime)' };
        }

        const now = Date.now();
        const expiry = new Date(licenseData.expiresAt).getTime();
        const diffMs = expiry - now;
        const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

        return {
          isActivated: true,
          isExpired: daysLeft <= 0,
          daysRemaining: Math.max(0, daysLeft),
          expiryDateStr: new Date(licenseData.expiresAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
          label: daysLeft > 0 ? `${daysLeft} Hari Lagi (s/d ${new Date(licenseData.expiresAt).toLocaleDateString('id-ID')})` : 'Lisensi Telah Kedaluwarsa'
        };
      }, [licenseData]);

      const [theme, setTheme] = useState(() => loadFromLocal('pospro_theme', 'dark'));

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          document.body.className = "bg-[#0f1228] text-slate-100 antialiased select-none dark";
        } else {
          root.classList.remove('dark');
          document.body.className = "bg-[#f4f6fb] text-slate-800 antialiased select-none";
        }
        saveToLocal('pospro_theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      const [activeTab, setActiveTab] = useState('pos');
      
      const [isMobileDevice, setIsMobileDevice] = useState(() => {
        return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 1024;
      });

      useEffect(() => {
        const handleResize = () => {
          setIsMobileDevice(/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 1024);
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const [currentUserRole, setCurrentUserRole] = useState({ 
        name: 'Kasir Toko', 
        role: 'kasir', 
        avatar: 'KS' 
      });
      const [showRoleSwitcher, setShowRoleSwitcher] = useState(false);
      const [showMobileCartDrawer, setShowMobileCartDrawer] = useState(false);

      const currentUser = currentUserRole;

      const [authModal, setAuthModal] = useState({ show: false, targetRole: null, password: '' });
      const [rolePasswords, setRolePasswords] = useState(() => loadFromLocal(`${userStoragePrefix}_passwords`, { owner: 'owner123', admin: 'admin123' }));

      // Data Toko & Produk Terisolasi per Akun/Lisensi
      const [storeSettings, setStoreSettings] = useState(() => {
        const saved = loadFromLocal(`${userStoragePrefix}_settings`, null);
        if (saved) return saved;
        return { ...defaultSettings, name: licenseData?.storeName || 'Toko Saya' };
      });

      const [products, setProducts] = useState(() => {
        return loadFromLocal(`${userStoragePrefix}_products`, defaultProducts);
      });

      const [transactions, setTransactions] = useState(() => {
        return loadFromLocal(`${userStoragePrefix}_transactions`, []);
      });

      const [draftOrders, setDraftOrders] = useState(() => loadFromLocal(`${userStoragePrefix}_drafts`, []));
      const [customers, setCustomers] = useState(() => {
        return loadFromLocal(`${userStoragePrefix}_customers`, [
          { id: 'CUST-001', name: 'Pelanggan Tetap', phone: '081298765432', address: 'Kota', totalTrx: 0, totalSpent: 0, debt: 0 }
        ]);
      });

      const [suppliers, setSuppliers] = useState(() => {
        return loadFromLocal(`${userStoragePrefix}_suppliers`, [
          { id: 'SUP-001', name: 'PT. Kopi Nusantara', contactPerson: 'Hendra', phone: '0811223344', address: 'Jakarta', totalPurchases: 0, debt: 0 }
        ]);
      });

      const [expenses, setExpenses] = useState(() => {
        return loadFromLocal(`${userStoragePrefix}_expenses`, [
          { id: 'EXP-101', date: new Date().toLocaleDateString('id-ID'), category: 'Listrik', amount: 50000, note: 'Token Listrik Awal' }
        ]);
      });

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const fileInputRef = useRef(null);
      const [syncStatusMsg, setSyncStatusMsg] = useState('Data Tersimpan');
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const isRemoteUpdatingRef = useRef(false);
      const lastSavedStateRef = useRef(null);
      const lastLocalUpdateTimestampRef = useRef(loadFromLocal(`${userStoragePrefix}_last_ts`, 0));
      const mqttClientRef = useRef(null);
      const deviceIdRef = useRef(Math.random().toString(36).substring(7));

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 2800);
      };

      useEffect(() => {
        if (!licenseData || licenseData.isDemo) return;

        const topic = `pospro/store_channel/${licenseData.vaultId || 'general'}`;
        let client;

        try {
          client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            keepalive: 60,
            clientId: `pospro_${deviceIdRef.current}_${Math.random().toString(16).substr(2, 6)}`,
            clean: true,
            reconnectPeriod: 2500
          });

          mqttClientRef.current = client;

          client.on('connect', () => {
            client.subscribe(topic, { qos: 1 }, (err) => {
              if (!err) {
                setSyncStatusMsg('Tersinkron Real-Time');
                setLastSyncTime(new Date());
              }
            });
          });

          client.on('message', (receivedTopic, messageBuffer) => {
            try {
              const payload = JSON.parse(messageBuffer.toString());
              if (!payload || payload.senderId === deviceIdRef.current) return;

              if (payload.type === 'STORE_STATE_UPDATE') {
                const incomingData = payload.data;
                const incomingTs = payload.ts || 0;
                const localTs = lastLocalUpdateTimestampRef.current || 0;

                if (incomingTs > localTs) {
                  isRemoteUpdatingRef.current = true;
                  lastLocalUpdateTimestampRef.current = incomingTs;
                  saveToLocal(`${userStoragePrefix}_last_ts`, incomingTs);

                  if (incomingData.storeSettings) { saveToLocal(`${userStoragePrefix}_settings`, incomingData.storeSettings); setStoreSettings(incomingData.storeSettings); }
                  if (incomingData.products) { saveToLocal(`${userStoragePrefix}_products`, incomingData.products); setProducts(incomingData.products); }
                  if (incomingData.transactions) { saveToLocal(`${userStoragePrefix}_transactions`, incomingData.transactions); setTransactions(incomingData.transactions); }
                  if (incomingData.customers) { saveToLocal(`${userStoragePrefix}_customers`, incomingData.customers); setCustomers(incomingData.customers); }
                  if (incomingData.suppliers) { saveToLocal(`${userStoragePrefix}_suppliers`, incomingData.suppliers); setSuppliers(incomingData.suppliers); }
                  if (incomingData.expenses) { saveToLocal(`${userStoragePrefix}_expenses`, incomingData.expenses); setExpenses(incomingData.expenses); }
                  if (incomingData.draftOrders) { saveToLocal(`${userStoragePrefix}_drafts`, incomingData.draftOrders); setDraftOrders(incomingData.draftOrders); }
                  if (incomingData.rolePasswords) { saveToLocal(`${userStoragePrefix}_passwords`, incomingData.rolePasswords); setRolePasswords(incomingData.rolePasswords); }

                  lastSavedStateRef.current = JSON.stringify(incomingData);
                  setLastSyncTime(new Date());
                  showToast('⚡ Data otomatis tersinkron dari perangkat lain!');

                  setTimeout(() => { isRemoteUpdatingRef.current = false; }, 400);
                }
              }
            } catch (e) {
              console.warn("MQTT Parse error:", e);
            }
          });
        } catch (err) {
          console.warn("MQTT Connection error:", err);
        }

        return () => {
          if (client) {
            try { client.end(true); } catch (e) {}
          }
        };
      }, [userStoragePrefix, licenseData]);

      const broadcastCurrentState = useCallback(() => {
        if (!mqttClientRef.current || !mqttClientRef.current.connected || !licenseData || licenseData.isDemo) return;

        const currentTs = Date.now();
        lastLocalUpdateTimestampRef.current = currentTs;
        saveToLocal(`${userStoragePrefix}_last_ts`, currentTs);

        const storePayload = {
          type: 'STORE_STATE_UPDATE',
          senderId: deviceIdRef.current,
          ts: currentTs,
          data: {
            storeSettings, products, transactions, customers, suppliers, expenses, draftOrders, rolePasswords
          }
        };

        const topic = `pospro/store_channel/${licenseData.vaultId || 'general'}`;
        mqttClientRef.current.publish(topic, JSON.stringify(storePayload), { qos: 1 });
        setLastSyncTime(new Date());
        setSyncStatusMsg('Tersinkronisasi Real-Time');
      }, [userStoragePrefix, licenseData, storeSettings, products, transactions, customers, suppliers, expenses, draftOrders, rolePasswords]);

      const handleActivateLicense = async (e) => {
        e.preventDefault();
        setLicenseError('');

        const cleanKey = licenseInputKey.trim().toUpperCase();
        const cleanStoreName = licenseStoreName.trim();

        if (!cleanKey || !cleanStoreName) {
          setLicenseError('Nama Toko dan Kode Lisensi wajib diisi!');
          return;
        }

        setIsVerifyingLicense(true);

        try {
          if (!GOOGLE_SCRIPT_WEBAPP_URL || GOOGLE_SCRIPT_WEBAPP_URL.includes("PASTE_YOUR_APPS_SCRIPT_URL_HERE")) {
            const newVaultId = "vault_" + Math.random().toString(36).substring(2, 9);
            const demoLic = {
              key: cleanKey,
              storeName: cleanStoreName,
              durationDays: cleanKey.includes('LIFE') ? 9999 : 30,
              vaultId: newVaultId,
              activatedAt: new Date().toISOString(),
              expiresAt: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString(),
              isDemo: false
            };
            saveToLocal('pospro_cloud_license', demoLic);
            setLicenseData(demoLic);
            setStoreSettings(prev => ({ ...prev, name: cleanStoreName }));
            showToast(`✅ Lisensi Offline Berhasil Diaktifkan untuk "${cleanStoreName}"!`);
            setIsVerifyingLicense(false);
            return;
          }

          const apiUrl = `${GOOGLE_SCRIPT_WEBAPP_URL}?action=activate&key=${encodeURIComponent(cleanKey)}&storeName=${encodeURIComponent(cleanStoreName)}&token=${encodeURIComponent(APP_SECRET_TOKEN)}`;
          const response = await fetch(apiUrl, { method: 'GET' });
          const result = await response.json();

          if (result.success) {
            const newLicense = {
              key: cleanKey,
              storeName: result.storeName || cleanStoreName,
              durationDays: result.durationDays,
              durationLabel: result.durationLabel,
              vaultId: result.vaultId,
              activatedAt: result.activatedAt,
              expiresAt: result.expiresAt,
              isLifetime: result.durationDays >= 9999,
              isDemo: false
            };

            saveToLocal('pospro_cloud_license', newLicense);
            setLicenseData(newLicense);
            setStoreSettings(prev => ({ ...prev, name: newLicense.storeName }));
            showToast(`✅ Lisensi Berhasil Diaktifkan untuk "${newLicense.storeName}"!`);
          } else {
            setLicenseError(result.message || 'Aktivasi gagal. Periksa kembali kode lisensi Anda.');
          }
        } catch (err) {
          setLicenseError('Gagal menghubungi server lisensi Google Sheet. Pastikan koneksi internet aktif.');
        } finally {
          setIsVerifyingLicense(false);
        }
      };

      const handleExtendLicense = async (e) => {
        e.preventDefault();
        const cleanKey = extendInputKey.trim().toUpperCase();
        if (!cleanKey) return;

        setIsExtendingLicense(true);
        try {
          if (!GOOGLE_SCRIPT_WEBAPP_URL || GOOGLE_SCRIPT_WEBAPP_URL.includes("PASTE_YOUR_APPS_SCRIPT_URL_HERE")) {
            const currentExp = new Date(licenseData.expiresAt || Date.now());
            currentExp.setDate(currentExp.getDate() + 30);
            const updatedLic = { ...licenseData, expiresAt: currentExp.toISOString() };
            saveToLocal('pospro_cloud_license', updatedLic);
            setLicenseData(updatedLic);
            setShowExtendModal(false);
            setExtendInputKey('');
            showToast('✅ Lisensi Berhasil Diperpanjang 30 Hari!');
            setIsExtendingLicense(false);
            return;
          }

          const apiUrl = `${GOOGLE_SCRIPT_WEBAPP_URL}?action=extend&key=${encodeURIComponent(cleanKey)}&storeName=${encodeURIComponent(licenseData.storeName)}&vaultId=${encodeURIComponent(licenseData.vaultId)}&token=${encodeURIComponent(APP_SECRET_TOKEN)}`;
          const response = await fetch(apiUrl, { method: 'GET' });
          const result = await response.json();

          if (result.success) {
            const updatedLic = {
              ...licenseData,
              expiresAt: result.expiresAt
            };
            saveToLocal('pospro_cloud_license', updatedLic);
            setLicenseData(updatedLic);
            setShowExtendModal(false);
            setExtendInputKey('');
            showToast(`✅ Lisensi Berhasil Diperpanjang +${result.durationDays} Hari!`);
          } else {
            showToast(result.message || 'Kode perpanjangan tidak valid!', 'error');
          }
        } catch (err) {
          showToast('Gagal memproses perpanjangan di Google Sheets!', 'error');
        } finally {
          setIsExtendingLicense(false);
        }
      };

      const handleDemoTrial = () => {
        const demoLic = {
          key: 'POS-DEMO-TRIAL-0000',
          storeName: 'Toko Demo POSPro',

      const handlePaySupplierDebt = (e) => { 
        e.preventDefault(); 
        const payAmount = Number(supplierPayAmount) || 0; 
        if (payAmount <= 0) { showToast('Masukkan nominal valid', 'error'); return; } 
        if (payAmount > (paymentModalSupplier.debt || 0)) { showToast('Melebihi hutang!', 'error'); return; } 
        setSuppliers(suppliers.map(s => s.id === paymentModalSupplier.id ? { ...s, debt: (s.debt || 0) - payAmount } : s));
        showToast('Pelunasan hutang dicatat.');
        setPaymentModalSupplier(null);
        setSupplierPayAmount('');
      };

      const handleRoleSwitchRequest = (roleObj) => {
        if (roleObj.role === 'owner' || roleObj.role === 'admin') {
          setAuthModal({ show: true, targetRole: roleObj, password: '' });
        } else {
          setCurrentUserRole(roleObj);
          setShowRoleSwitcher(false);
          showToast(`Beralih ke peran ${roleObj.name}`);
        }
      };

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const target = authModal.targetRole;
        if (!target) return;
        const requiredPass = rolePasswords[target.role] || (target.role === 'owner' ? 'owner123' : 'admin123');
        if (authModal.password === requiredPass) {
          setCurrentUserRole(target);
          setAuthModal({ show: false, targetRole: null, password: '' });
          setShowRoleSwitcher(false);
          showToast(`Berhasil masuk sebagai ${target.name}`);
        } else {
          showToast('Password salah!', 'error');
        }
      };

      const handleBackupDatabase = () => {
        const backupData = {
          license: licenseData,
          storeSettings,
          products,
          transactions,
          draftOrders,
          customers,
          suppliers,
          expenses,
          rolePasswords,
          exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_${(licenseData?.storeName || 'toko').toLowerCase().replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Cadangan data berhasil diunduh!');
      };

      const handleRestoreDatabase = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.products) setProducts(data.products);
            if (data.transactions) setTransactions(data.transactions);
            if (data.customers) setCustomers(data.customers);
            if (data.suppliers) setSuppliers(data.suppliers);
            if (data.expenses) setExpenses(data.expenses);
            if (data.storeSettings) setStoreSettings(data.storeSettings);
            if (data.rolePasswords) setRolePasswords(data.rolePasswords);
            showToast('Data berhasil dipulihkan dari file backup!');
          } catch (err) {
            showToast('Gagal memulihkan: Format JSON tidak valid', 'error');
          }
        };
        reader.readAsText(file);
      };

      const addRowDynamicList = (state, setState) => {
        setState({ ...state, items: [...state.items, { productId: '', qty: '' }] });
      };

      const updateDynamicList = (state, setState, index, field, value) => {
        const items = [...state.items];
        items[index][field] = value;
        setState({ ...state, items });
      };

      const categories = useMemo(() => ['Semua', ...new Set(products.map(p => p.category || 'Umum'))], [products]);
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCat = selectedCategory === 'Semua' || p.category === selectedCategory;
          const matchSearch = (p.name || '').toLowerCase().includes(searchQuery.toLowerCase()) || 
                              (p.sku || '').toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      if (!licenseStatus.isActivated || licenseStatus.isExpired) {
        return (
          <div className="min-h-screen bg-[#0f1228] text-slate-100 flex flex-col items-center justify-center p-4 sm:p-6 select-none font-sans relative overflow-hidden">
            <div className="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-cyan-600/15 rounded-full blur-3xl pointer-events-none"></div>

            <div className="bg-[#181b3b] border border-[#2a2f60] rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl space-y-5 text-center relative z-10 animate-in fade-in zoom-in duration-300">
              <div className="space-y-2">
                <div className="w-14 h-14 bg-gradient-to-tr from-indigo-600 via-purple-600 to-[#00d2d3] rounded-2xl flex items-center justify-center mx-auto text-white shadow-lg mb-2">
                  <Icon name="shield-check" className="w-7 h-7 text-white" />
                </div>
                <h1 className="text-xl sm:text-2xl font-black tracking-tight text-white">Aktivasi Lisensi POSPro</h1>
                <p className="text-xs text-slate-400">
                  {licenseStatus.isExpired 
                    ? 'Masa aktif lisensi toko Anda telah berakhir. Masukkan lisensi baru untuk memperpanjang.' 
                    : 'Sistem Kasir & Toko Pintar. Masukkan lisensi untuk membuka toko Anda.'}
                </p>
              </div>

              {licenseError && (
                <div className="p-3 bg-rose-500/20 border border-rose-500/40 rounded-2xl text-xs text-rose-300 font-bold flex items-center gap-2 text-left animate-in fade-in">
                  <Icon name="alert-circle" className="w-4 h-4 shrink-0 text-rose-400" />
                  <span>{licenseError}</span>
                </div>
              )}

              <form onSubmit={handleActivateLicense} className="space-y-3.5 text-left text-xs">
                <div>
                  <label className="text-slate-300 font-bold mb-1.5 block flex items-center gap-1.5">
                    <Icon name="store" className="w-3.5 h-3.5 text-[#00d2d3]" />
                    <span>Nama Toko / Usaha:</span>
                  </label>
                  <input 
                    type="text" 
                    required 
                    placeholder="Contoh: Kopi Janji Senja" 
                    value={licenseStoreName} 
                    onChange={(e) => setLicenseStoreName(e.target.value)} 
                    className="w-full p-3 bg-[#0f1228] border border-[#2a2f60] rounded-xl text-white outline-none focus:border-[#00d2d3] font-medium text-xs sm:text-sm"
                  />
                  <p className="text-[10px] text-slate-400 mt-1">
                    *Nama toko ini akan otomatis tercatat dan terkunci di Google Sheets.
                  </p>
                </div>

                <div>
                  <label className="text-slate-300 font-bold mb-1.5 block flex items-center gap-1.5">
                    <Icon name="key-round" className="w-3.5 h-3.5 text-[#00d2d3]" />
                    <span>Kode Lisensi Google Sheets (1x Pakai):</span>
                  </label>
                  <input 
                    type="text" 
                    required 
                    placeholder="POS-30D-XXXX-YYYY" 
                    value={licenseInputKey} 
                    onChange={(e) => setLicenseInputKey(e.target.value.toUpperCase())} 
                    className="w-full p-3.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl text-[#00d2d3] outline-none focus:border-[#00d2d3] font-mono font-bold text-center tracking-wider text-sm sm:text-base"
                  />
                </div>

                <button
                  type="submit"
                  disabled={isVerifyingLicense}
                  className="w-full py-3.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-700 hover:brightness-110 disabled:opacity-50 text-white rounded-2xl font-black text-xs sm:text-sm shadow-xl active:scale-98 transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                  {isVerifyingLicense ? (
                    <>
                      <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                      <span>Memvalidasi Google Sheets...</span>
                    </>
                  ) : (
                    <>
                      <Icon name="check-circle" className="w-4 h-4" />
                      <span>Aktivasi Lisensi & Buka Kasir</span>
                    </>
                  )}
                </button>
              </form>

              <div className="pt-2 border-t border-[#2a2f60] flex items-center justify-center">
                <button
                  onClick={handleDemoTrial}
                  className="w-full py-2.5 px-3 bg-[#21254d] hover:bg-[#2a2f60] text-slate-300 hover:text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 border border-[#2a2f60] transition-all cursor-pointer"
                >
                  <Icon name="sparkles" className="w-3.5 h-3.5 text-amber-400" />
                  <span>Coba Gratis (Mode Demo Tanpa Lisensi)</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      const renderDashboard = () => {
        const totalNilaiPenjualan = transactions.reduce((sum, t) => sum + (t.subtotal || t.total || 0), 0);
        const totalNilaiAkhir = transactions.reduce((sum, t) => sum + (t.total || 0), 0);
        
        let totalHPP = 0;
        transactions.forEach(t => {
          (t.items || []).forEach(item => {
            if (item.product) {
              const prod = products.find(p => p.id === item.product.id);
              const cost = prod ? prod.costPrice : (item.product.costPrice || 0);
              totalHPP += cost * item.qty;
            }
          });
        });

        const totalPengeluaran = expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
        const totalProfit = (totalNilaiAkhir - totalHPP) - totalPengeluaran;

        const categoryStats = [
          { name: 'Jenis 1 (Minuman)', cat: 'Minuman', color: '#ff4b8b' },
          { name: 'Jenis 2 (Makanan)', cat: 'Makanan', color: '#00d2d3' },
          { name: 'Jenis 3 (Snack/Umum)', cat: 'Snack', color: '#ff8a3d' }
        ].map((c) => {
          const prodsInCat = products.filter(p => p.category && p.category.toLowerCase().includes(c.cat.toLowerCase()));
          const stock = prodsInCat.reduce((sum, p) => sum + (p.stock || 0), 0);
          
          let sold = 0;
          let sales = 0;
          transactions.forEach(t => {
            (t.items || []).forEach(i => {
              if (i.product && prodsInCat.some(p => p.id === i.product.id)) {
                sold += i.qty;
                sales += ((i.product.price - (Number(i.discountRp) || 0)) * i.qty);
              }
            });
          });

          const total = stock + sold;
          const percentage = total > 0 ? Math.round((sold / total) * 100) : 50;

          return {
            title: c.name,
            stock,
            sold,
            total,
            sales,
            percentage,
            color: c.color
          };
        });

        const productStats = products.slice(0, 10).map((p, idx) => {
          let sold = 0;
          transactions.forEach(t => {
            (t.items || []).forEach(i => {
              if (i.product && i.product.id === p.id) {
                sold += i.qty;
              }
            });
          });
          const initial = p.stock + sold;
          const remaining = p.stock;
          const soldPercentage = initial > 0 ? Math.round((sold / initial) * 100) : 0;
          const labelLaku = soldPercentage >= 70 ? 'Barang Sangat Laku' : soldPercentage >= 40 ? 'Barang Laku' : 'Barang Kurang Laku';

          return {
            name: `Barang ${idx + 1}`,
            fullName: p.name,
            initial,
            sold,
            remaining,
            soldPercentage,
            labelLaku
          };
        });

        const maxBarVal = Math.max(...productStats.map(ps => Math.max(ps.initial, ps.sold, ps.remaining, 10)), 50);

        return (
          <div className="p-3 sm:p-6 pb-28 lg:pb-8 space-y-4 max-w-7xl mx-auto">
            {/* Status Lisensi & Sinkronisasi */}
            <div className={`p-4 rounded-3xl border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs ${
              theme === 'dark' ? 'bg-[#181b3b]/90 border-[#2a2f60]' : 'bg-white border-slate-200 shadow-sm'
            }`}>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center">
                  <Icon name="shield-check" className="w-5 h-5 text-[#00d2d3]" />
                </div>
                <div>
                  <h3 className="font-black text-sm flex items-center gap-1.5 flex-wrap">
                    <span>Toko: <strong className="text-[#00d2d3]">{licenseData?.storeName || storeSettings.name}</strong></span>
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">
                      {licenseStatus.label}
                    </span>
                  </h3>
                  <p className="text-[11px] text-slate-400 mt-0.5">
                    Vault ID: <span className="font-mono text-cyan-300">{licenseData?.vaultId || 'Local'}</span> • Sync: <span className="text-emerald-400 font-bold">{syncStatusMsg}</span>
                  </p>
                </div>
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => setShowExtendModal(true)} 
                  className="px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:brightness-110 text-white rounded-xl text-xs font-black shadow-md flex items-center gap-1.5 cursor-pointer"
                >
                  <Icon name="key-round" className="w-3.5 h-3.5" />
                  <span>Perpanjang Lisensi</span>
                </button>
              </div>
            </div>

            {/* Circular Category Gauges */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
              <div className="lg:col-span-7 grid grid-cols-1 sm:grid-cols-3 gap-3">
                {categoryStats.map((cat, idx) => {
                  const strokeDashoffset = 283 - (283 * cat.percentage) / 100;
                  return (
                    <div 
                      key={idx} 
                      className={`p-4 rounded-3xl border flex flex-col items-center justify-between text-center transition-all ${
                        theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-lg' : 'bg-white border-slate-200 shadow-sm'
                      }`}
                    >
                      <div className="flex items-center gap-1.5 self-start">
                        <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: cat.color }}></span>
                        <span className={`text-[11px] font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-300' : 'text-slate-700'}`}>
                          {cat.title}
                        </span>
                      </div>

                      <div className="relative w-28 h-28 my-3 flex items-center justify-center">
                        <svg className="w-full h-full -rotate-90" viewBox="0 0 112 112">
                          <circle
                            cx="56"
                            cy="56"
                            r="45"
                            stroke={theme === 'dark' ? '#21254d' : '#e2e8f0'}
                            strokeWidth="12"
                            fill="transparent"
                          />
                          <circle
                            cx="56"
                            cy="56"
                            r="45"
                            stroke={cat.color}
                            strokeWidth="12"
                            strokeDasharray="283"
                            strokeDashoffset={strokeDashoffset}
                            strokeLinecap="round"
                            fill="transparent"
                            style={{ transition: 'strokeDashoffset 0.8s ease' }}
                          />
                        </svg>
                        
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                          <span className={`text-xl font-black ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>
                            {cat.percentage}%
                          </span>
                        </div>

                        <span className="absolute -top-1 left-2 text-[9px] font-bold text-slate-400">{cat.stock}</span>
                        <span className="absolute -bottom-1 left-2 text-[9px] font-bold text-slate-400">{cat.sold}</span>
                        <span className="absolute top-1/2 -right-1 -translate-y-1/2 text-[9px] font-bold text-slate-400">{cat.total}</span>
                      </div>

                      <div className="w-full mt-1">
                        <div className="w-full py-1.5 px-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-black text-xs shadow-md">
                          {formatMoney(cat.sales)}
                        </div>
                        <p className={`text-[10px] font-bold mt-1.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                          Barang Laku
                        </p>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* 4 Kartu Metrik Keuangan */}
              <div className="lg:col-span-5 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${
                  theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-lg' : 'bg-white border-slate-200 shadow-sm'
                }`}>
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-pink-500/20 text-[#ff4b8b] flex items-center justify-center border border-pink-500/30">
                      <Icon name="banknote" className="w-4 h-4"/>
                    </div>
                    <span className={`text-[11px] font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Nilai Penjualan
                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-[#ff4b8b] tracking-tight truncate">
                      {formatMoney(totalNilaiPenjualan)}
                    </h3>
                    <p className={`text-[10px] mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Total Nilai Penjualan
                    </p>
                  </div>
                </div>

                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${
                  theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-lg' : 'bg-white border-slate-200 shadow-sm'
                }`}>
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-cyan-500/20 text-[#00d2d3] flex items-center justify-center border border-cyan-500/30">
                      <Icon name="wallet" className="w-4 h-4"/>
                    </div>
                    <span className={`text-[11px] font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Akhir Penjualan
                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-[#00d2d3] tracking-tight truncate">
                      {formatMoney(totalNilaiAkhir)}
                    </h3>
                    <p className={`text-[10px] mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Total Nilai Akhir Penjualan
                    </p>
                  </div>
                </div>

                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${
                  theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-lg' : 'bg-white border-slate-200 shadow-sm'
                }`}>
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-[#ff8a3d] flex items-center justify-center border border-amber-500/30">
                      <Icon name="package-minus" className="w-4 h-4"/>
                    </div>
                    <span className={`text-[11px] font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Modal Pokok (HPP)
                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-[#ff8a3d] tracking-tight truncate">
                      {formatMoney(totalHPP)}
                    </h3>
                    <p className={`text-[10px] mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Total Harga Pokok Penjualan
                    </p>
                  </div>
                </div>

                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${
                  theme === 'dark' ? 'bg-gradient-to-br from-[#1e1b4b] to-[#181b3b] border-indigo-500/40 text-white shadow-lg' : 'bg-indigo-50 border-indigo-200'
                }`}>
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center border border-indigo-500/30">
                      <Icon name="trending-up" className="w-4 h-4"/>
                    </div>
                    <span className="text-[11px] font-bold uppercase tracking-wider text-indigo-400">
                      Profit Bersih
                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-emerald-400 tracking-tight truncate">
                      {formatMoney(totalProfit)}
                    </h3>
                    <p className={`text-[10px] mt-0.5 ${theme === 'dark' ? 'text-indigo-200' : 'text-indigo-600'}`}>
                      Total Nilai Profit
                    </p>
                  </div>
                </div>
              </div>
            </div>

            {/* Inventory Chart & Fast Selling Products Progress */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
              <div className={`lg:col-span-7 p-4 sm:p-6 rounded-3xl border flex flex-col justify-between transition-all ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-xl' : 'bg-white border-slate-200 shadow-sm text-slate-800'
              }`}>
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
                  <div className="flex items-center gap-2">
                    <Icon name="bar-chart-3" className="w-5 h-5 text-[#00d2d3]" />
                    <h3 className="font-extrabold text-sm sm:text-base tracking-tight">Grafik Persediaan Barang</h3>
                  </div>

                  <div className="flex items-center gap-3 text-[10px] font-bold">
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#00d2d3]"></span> Jumlah Awal</span>
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#ff8a3d]"></span> Terjual</span>
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#ff4b8b]"></span> Sisa Akhir</span>
                  </div>
                </div>

                <div className="h-60 sm:h-72 flex items-end gap-2 sm:gap-4 pt-4 border-b border-slate-700/50 pb-2 overflow-x-auto no-scrollbar">
                  {productStats.map((item, idx) => {
                    const hInitial = (item.initial / maxBarVal) * 100;
                    const hSold = (item.sold / maxBarVal) * 100;
                    const hRemaining = (item.remaining / maxBarVal) * 100;

                    return (
                      <div key={idx} className="flex-1 min-w-[50px] flex flex-col items-center h-full justify-end group">
                        <div className="flex items-end justify-center gap-1 w-full h-[82%]">
                          <div className="w-2.5 sm:w-3.5 bg-[#00d2d3] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hInitial}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#00d2d3] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.initial}
                            </span>
                          </div>
                          <div className="w-2.5 sm:w-3.5 bg-[#ff8a3d] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hSold}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#ff8a3d] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.sold}
                            </span>
                          </div>
                          <div className="w-2.5 sm:w-3.5 bg-[#ff4b8b] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hRemaining}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#ff4b8b] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.remaining}
                            </span>
                          </div>
                        </div>

                        <p className={`mt-2 text-[10px] font-bold truncate max-w-[55px] text-center ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>
                          {item.name}
                        </p>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className={`lg:col-span-5 p-4 sm:p-6 rounded-3xl border flex flex-col justify-between transition-all ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-xl' : 'bg-white border-slate-200 shadow-sm text-slate-800'
              }`}>
                <div className="flex items-center gap-2 mb-4">
                  <Icon name="activity" className="w-5 h-5 text-[#00d2d3]" />
                  <h3 className="font-extrabold text-sm sm:text-base tracking-tight">Grafik Barang Laku</h3>
                </div>

                <div className="space-y-3 flex-1 flex flex-col justify-center">
                  {productStats.slice(0, 6).map((item, idx) => (
                    <div key={idx} className="space-y-1">
                      <div className="flex justify-between items-center text-xs">
                        <span className={`font-bold truncate max-w-[140px] ${theme === 'dark' ? 'text-slate-300' : 'text-slate-700'}`}>
                          {item.fullName}
                        </span>
                        <span className="text-[10px] font-bold text-[#00d2d3]">
                          {item.labelLaku} ; {item.soldPercentage}%
                        </span>
                      </div>
                      <div className={`w-full h-3 rounded-full overflow-hidden ${theme === 'dark' ? 'bg-[#21254d]' : 'bg-slate-100'}`}>
                        <div 
                          className="h-full bg-gradient-to-r from-[#00d2d3] to-[#6366f1] rounded-full transition-all duration-700" 
                          style={{ width: `${item.soldPercentage}%` }}
                        ></div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex justify-between text-[9px] font-bold text-slate-400 pt-3 border-t border-slate-700/40 mt-3">
                  <span>0%</span>
                  <span>20%</span>
                  <span>40%</span>
                  <span>60%</span>
                  <span>80%</span>
                  <span>100%</span>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderCartContent = () => {
        const isPaymentExact = paymentMethod !== 'Cash' && paymentMethod !== 'Hutang';
        const isReadyToPay = cart.length > 0 && (isPaymentExact || (paymentMethod === 'Cash' && cashReceived && parseInt(cashReceived) >= grandTotal) || (paymentMethod === 'Hutang')); 

        return (
          <div className={`flex flex-col h-full ${theme === 'dark' ? 'bg-[#181b3b] text-white' : 'bg-white text-slate-800'}`}>
            <div className={`p-4 border-b flex flex-col gap-2.5 shrink-0 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
              <div className="flex justify-between items-center">
                <h2 className="font-extrabold flex items-center gap-2 text-sm sm:text-base">
                  <Icon name="shopping-bag" className="w-5 h-5 text-[#00d2d3]" /> Rincian Pesanan
                </h2>
                <div className="flex items-center gap-2">
                  {cart.length > 0 && (
                    <button 
                      onClick={() => { setCart([]); setCashReceived(''); showToast('Keranjang dikosongkan'); }}
                      className="px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-full text-xs font-bold flex items-center gap-1 transition-all cursor-pointer"
                    >
                      <Icon name="trash-2" className="w-3 h-3 text-rose-400" />
                      <span>Hapus</span>
                    </button>
                  )}
                  <span className="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 text-xs font-black px-2.5 py-1 rounded-full">
                    {totalItemCount} Item
                  </span>
                  <button onClick={() => setShowMobileCartDrawer(false)} className="lg:hidden p-1 text-slate-400 hover:text-white bg-slate-800 rounded-lg cursor-pointer">
                    <Icon name="x" className="w-5 h-5"/>
                  </button>
                </div>
              </div>
              <div className={`flex items-center gap-2 rounded-2xl p-2 border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50 border-slate-200'}`}>
                <Icon name="user" className="w-4 h-4 text-slate-400 ml-1 shrink-0" />
                <select 
                  value={selectedCustomerPOS} 
                  onChange={(e) => setSelectedCustomerPOS(e.target.value)} 
                  className="w-full bg-transparent border-none outline-none text-xs sm:text-sm font-semibold cursor-pointer"
                >
                  <option value="" className={theme === 'dark' ? 'bg-[#181b3b] text-white' : ''}>Pelanggan Umum (Walk-in)</option>
                  {customers.map(c => <option key={c.id} value={c.id} className={theme === 'dark' ? 'bg-[#181b3b] text-white' : ''}>{c.name}</option>)}
                </select>
              </div>
            </div>

            <div className={`flex-1 overflow-y-auto p-3 space-y-2.5 ${theme === 'dark' ? 'bg-[#0f1228]/50' : 'bg-slate-50'}`}>
              {cart.length === 0 ? (
                <div className="h-full min-h-[180px] flex flex-col items-center justify-center text-slate-400 opacity-60 space-y-2">
                  <Icon name="shopping-bag" className="w-12 h-12" />
                  <p className="text-xs font-bold">Keranjang masih kosong</p>
                  <p className="text-[10px]">Klik produk di samping atau scan barcode.</p>
                </div>
              ) : (
                cart.map(item => (
                  <div key={item.product.id} className={`p-3 rounded-2xl border flex flex-col shadow-sm transition-all ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'
                  }`}>
                    <div className="flex justify-between items-start">
                      <div className="flex-1 pr-2">
                        <p className="font-extrabold text-xs sm:text-sm line-clamp-1">{item.product.name}</p>
                        <span className="text-[#00d2d3] font-bold text-xs">{formatMoney(item.product.price)}</span>
                      </div>
                      <button onClick={() => removeFromCart(item.product.id)} className="p-1 text-slate-400 hover:text-rose-400 cursor-pointer">
                        <Icon name="trash-2" className="w-4 h-4" />
                      </button>
                    </div>
                    <div className={`flex justify-between items-center pt-2 mt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                      <div className="flex items-center gap-1">
                        <span className="text-[10px] text-slate-400 font-bold">Disc:</span>
                        <input 
                          type="number" 
                          placeholder="Rp" 
                          value={item.discountRp} 
                          onChange={(e) => updateItemDiscount(item.product.id, e.target.value)} 
                          className={`w-16 rounded-lg px-2 py-0.5 text-xs font-medium outline-none border ${
                            theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                          }`} 
                        />
                      </div>
                      <div className={`flex items-center rounded-xl border p-0.5 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-100 border-slate-200'}`}>
                        <button onClick={() => updateQty(item.product.id, -1)} className="w-7 h-7 flex items-center justify-center hover:bg-white/10 rounded-lg font-bold text-sm cursor-pointer">-</button>
                        <input 
                          type="number"
                          value={item.qty}
                          onChange={(e) => setExactQty(item.product.id, e.target.value)}
                          className={`w-8 text-center font-bold text-xs bg-transparent outline-none ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}
                        />
                        <button onClick={() => updateQty(item.product.id, 1)} className="w-7 h-7 flex items-center justify-center hover:bg-white/10 rounded-lg font-bold text-sm cursor-pointer">+</button>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>

            <div className={`p-4 border-t shadow-2xl space-y-3 shrink-0 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
              <div className="grid grid-cols-2 gap-2">
                <input 
                  type="text" 
                  placeholder="Catatan struk..." 
                  value={transactionNote} 
                  onChange={(e) => setTransactionNote(e.target.value)} 
                  className={`w-full text-xs rounded-xl p-2.5 outline-none border ${
                    theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                  }`} 
                />
                <select 
                  value={paymentMethod} 
                  onChange={(e) => setPaymentMethod(e.target.value)} 
                  className={`w-full text-xs font-bold rounded-xl p-2.5 outline-none border cursor-pointer ${
                    theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                  }`}
                >
                  {storeSettings.paymentMethods.map(m => (<option key={m} value={m} className={theme === 'dark' ? 'bg-[#181b3b]' : ''}>{m}</option>))}
                </select>
              </div>

              <div className="space-y-1 text-xs">
                <div className="flex justify-between text-slate-400"><span>Subtotal:</span><span className="font-bold">{formatMoney(subtotal)}</span></div>
                <div className={`flex justify-between items-baseline pt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                  <span className="font-black text-xs uppercase text-slate-400">Total Bayar</span>
                  <span className="text-xl sm:text-2xl font-black text-[#00d2d3]">{formatMoney(grandTotal)}</span>
                </div>
              </div>

              {(paymentMethod === 'Cash' || paymentMethod === 'Hutang') && (
                <div className="space-y-2">
                  <div className="flex gap-1.5">
                    <button onClick={() => handleQuickCash(grandTotal)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200' : 'bg-slate-100'}`}>Uang Pas</button>
                    <button onClick={() => handleQuickCash(50000)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200' : 'bg-slate-100'}`}>50k</button>
                    <button onClick={() => handleQuickCash(100000)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200' : 'bg-slate-100'}`}>100k</button>
                  </div>
                  <input 
                    type="number" 
                    placeholder="Uang Diterima..." 
                    value={cashReceived} 
                    onChange={(e) => setCashReceived(e.target.value)} 
                    className={`w-full px-3 py-2.5 rounded-xl text-sm font-black outline-none border ${
                      theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                    }`} 
                  />
                  {paymentMethod === 'Cash' && cashReceived && parseInt(cashReceived) >= grandTotal && (
                    <div className="flex justify-between items-center bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 p-2.5 rounded-xl text-xs font-bold">
                      <span>KEMBALIAN</span>
                      <span className="text-sm font-black">{formatMoney(parseInt(cashReceived) - grandTotal)}</span>
                    </div>
                  )}
                </div>
              )}

              <button 
                onClick={handleCheckout} 
                disabled={!isReadyToPay} 
                className="w-full py-3.5 bg-gradient-to-r from-[#6366f1] to-[#a855f7] hover:brightness-110 disabled:opacity-40 text-white rounded-2xl font-black text-sm shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer"
              >
                <Icon name="check-circle" className="w-5 h-5" /> Selesaikan & Simpan Nota
              </button>
            </div>
          </div>
        );
      };

      const renderPOS = () => {
        return (
          <div className="flex flex-col lg:flex-row h-[calc(100vh-60px)] lg:h-screen overflow-hidden">
            <div className={`flex-1 flex flex-col h-full overflow-hidden border-r ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-200'}`}>
              <div className={`p-3 sm:p-4 border-b flex flex-col gap-2.5 shrink-0 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <div className="flex items-center gap-2">
                  <div className="relative flex-1">
                    <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" />
                    <input 
                      type="text" 
                      placeholder="Cari nama produk / kode SKU..." 
                      value={searchQuery} 
                      onChange={(e) => setSearchQuery(e.target.value)} 
                      className={`w-full pl-9 pr-3 py-2.5 rounded-2xl outline-none text-xs sm:text-sm font-medium border ${
                        theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-100 border-transparent'
                      }`} 
                    />
                  </div>

                  <button 
                    onClick={() => openScanner('pos')} 
                    className="px-3.5 py-2.5 bg-gradient-to-r from-[#00d2d3] to-[#6366f1] text-white rounded-2xl font-black text-xs flex items-center gap-1.5 shadow-md cursor-pointer"
                  >
                    <Icon name="camera" className="w-4 h-4" />
                    <span>Scan</span>
                  </button>

                  <button 
                    onClick={() => setShowDraftSaveModal(true)} 
                    disabled={cart.length === 0} 
                    className={`p-2.5 rounded-2xl border relative cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed transition-all ${
                      theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-[#00d2d3] hover:bg-[#2a2f60]' : 'bg-indigo-50 border-indigo-100 text-indigo-600 hover:bg-indigo-100'
                    }`} 
                    title="Simpan / Tahan Pesanan (Draft)"
                  >
                    <Icon name="save" className="w-4 h-4" />
                  </button>

                  <button 
                    onClick={() => setShowDraftListModal(true)} 
                    className={`p-2.5 rounded-2xl border relative cursor-pointer transition-all ${
                      theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-[#00d2d3] hover:bg-[#2a2f60]' : 'bg-indigo-50 border-indigo-100 text-indigo-600 hover:bg-indigo-100'
                    }`} 
                    title="Daftar Pesanan Tertahan"
                  >
                    <Icon name="folder" className="w-4 h-4" />
                    {draftOrders.length > 0 && (
                      <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center animate-pulse">
                        {draftOrders.length}
                      </span>
                    )}
                  </button>
                </div>

                <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                  {categories.map(c => (
                    <button 
                      key={c} 
                      onClick={() => setSelectedCategory(c)} 
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all shrink-0 cursor-pointer ${
                        selectedCategory === c 
                          ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-md' 
                          : (theme === 'dark' ? 'bg-[#21254d] text-slate-400 hover:text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200')
                      }`}
                    >
                      {c}
                    </button>
                  ))}
                </div>
              </div>

              <div className={`flex-1 overflow-y-auto p-3 sm:p-4 pb-28 lg:pb-4 ${theme === 'dark' ? 'bg-[#0f1228]' : 'bg-slate-50'}`}>
                <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">
                  {filteredProducts.map(product => {
                    const isOOS = product.stock <= 0;
                    return (
                      <button 
                        key={product.id} 
                        onClick={() => addToCart(product)} 
                        disabled={isOOS} 
                        className={`p-4 rounded-3xl border text-left flex flex-col justify-between min-h-[135px] transition-all cursor-pointer ${
                          isOOS 
                            ? 'opacity-50 cursor-not-allowed bg-slate-800/40 border-slate-700' 
                            : (theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] hover:border-[#00d2d3]' : 'bg-white border-slate-200 shadow-sm')
                        }`}
                      >
                        <div className="flex justify-between items-start">
                          <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-lg ${theme === 'dark' ? 'bg-[#21254d] text-indigo-300' : 'bg-indigo-50 text-indigo-700'}`}>
                            {product.category}
                          </span>
                          <span className="text-[10px] font-bold text-slate-400">Stok: {product.stock}</span>
                        </div>
                        <div className="my-2">
                          <h4 className="font-extrabold text-xs sm:text-sm line-clamp-2">{product.name}</h4>
                          <p className="text-[10px] font-mono text-slate-400">{product.sku}</p>
                        </div>
                        <p className="font-black text-sm sm:text-base text-[#00d2d3]">{formatMoney(product.price)}</p>
                      </button>
                    );
                  })}
                </div>
              </div>

              {cart.length > 0 && (
                <div className="lg:hidden fixed bottom-16 left-3 right-3 z-30">
                  <div onClick={() => setShowMobileCartDrawer(true)} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-3.5 rounded-3xl shadow-2xl flex items-center justify-between cursor-pointer">
                    <span className="font-black text-sm">{totalItemCount} Item • {formatMoney(grandTotal)}</span>
                    <span className="bg-white text-indigo-900 font-extrabold text-xs px-3 py-1.5 rounded-xl">Buka Keranjang</span>
                  </div>
                </div>
              )}
            </div>

            <div className="hidden lg:flex w-[380px] xl:w-[420px] h-full">
              {renderCartContent()}
            </div>

            {showMobileCartDrawer && (
              <div className="lg:hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex flex-col justify-end">
                <div className="rounded-t-3xl h-[88vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom">
                  {renderCartContent()}
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderReports = () => {
        const now = new Date(); 
        const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startOfWeek = new Date(todayDate); startOfWeek.setDate(todayDate.getDate() - todayDate.getDay());
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1); 
        const startOfYear = new Date(now.getFullYear(), 0, 1);

        const filteredTrx = transactions.filter(t => {
          const tDate = parseDateStr(t.date);
          if (reportPeriod === 'today') return tDate >= todayDate;
          if (reportPeriod === 'week') return tDate >= startOfWeek;
          if (reportPeriod === 'month') return tDate >= startOfMonth;
          if (reportPeriod === 'year') return tDate >= startOfYear;
          return true;
        });

        const omzet = filteredTrx.reduce((sum, t) => sum + (t.total || 0), 0);
        let hpp = 0; 
        filteredTrx.forEach(t => { 
          (t.items || []).forEach(item => { 
            if (item.product) { 
              const prod = products.find(p => p.id === item.product.id); 
              const cost = prod ? prod.costPrice : (item.product.costPrice || 0); 
              hpp += cost * item.qty; 
            } 
          }); 
        });
        const labaKotor = omzet - hpp; 
        const pengeluaranTotal = expenses.reduce((sum, e) => sum + (e.amount || 0), 0); 
        const labaBersih = labaKotor - pengeluaranTotal;

        return (
          <div className="p-3 sm:p-6 pb-28 lg:pb-8 space-y-4 max-w-6xl mx-auto">
            <div className={`p-4 sm:p-6 rounded-3xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${
              theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200 text-slate-800'
            }`}>
              <div>
                <h2 className="text-xl sm:text-2xl font-black tracking-tight">Laporan Keuangan & Profit</h2>
                <p className={`text-xs mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Analisis omzet penjualan, harga pokok modal, dan laba bersih riil ({storeSettings.name}).</p>
              </div>
              <div className={`flex p-1 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-100 border-slate-200'}`}>
                {['today', 'week', 'month', 'year'].map(p => (
                  <button key={p} onClick={() => setReportPeriod(p)} className={`px-3 py-1.5 rounded-xl text-xs font-bold capitalize whitespace-nowrap cursor-pointer ${reportPeriod === p ? 'bg-indigo-600 text-white shadow-md' : (theme === 'dark' ? 'text-slate-400' : 'text-slate-600')}`}>{p === 'today' ? 'Hari Ini' : p === 'week' ? 'Minggu' : p === 'month' ? 'Bulan Ini' : 'Tahun Ini'}</button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Omzet Penjualan</p>
                <p className="text-lg sm:text-xl font-black text-[#00d2d3] mt-1">{formatMoney(omzet)}</p>
              </div>
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Modal Pokok (HPP)</p>
                <p className="text-lg sm:text-xl font-black text-[#ff8a3d] mt-1">{formatMoney(hpp)}</p>
              </div>
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Beban Operasional</p>
                <p className="text-lg sm:text-xl font-black text-[#ff4b8b] mt-1">{formatMoney(pengeluaranTotal)}</p>
              </div>
              <div className={`p-4 rounded-3xl border bg-gradient-to-br from-indigo-900/60 to-purple-900/60 border-indigo-500/40 text-white`}>
                <p className="text-[10px] text-indigo-300 font-bold uppercase">Laba Bersih Toko</p>
                <p className="text-lg sm:text-xl font-black text-emerald-400 mt-1">{formatMoney(labaBersih)}</p>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className={`flex h-screen overflow-hidden font-sans transition-colors duration-300 ${
          theme === 'dark' ? 'bg-[#0f1228] text-slate-100' : 'bg-[#f4f6fb] text-slate-800'
        }`}>
          {toast.show && (

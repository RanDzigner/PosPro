              {activeTab === 'suppliers' && currentUser.role === 'owner' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className={`p-4 sm:p-6 rounded-3xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                    <div>
                      <h2 className="text-xl sm:text-2xl font-black">Supplier & Hutang Usaha</h2>
                      <p className={`text-xs mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Daftar vendor toko, produk yang disuplai, dan pelunasan hutang.</p>
                    </div>
                    <button onClick={() => { setEditingSupplier(null); setSupplierForm({ name: '', contactPerson: '', phone: '', address: '' }); setIsSupplierModalOpen(true); }} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-4 py-2.5 rounded-2xl text-xs font-bold flex items-center gap-1.5 shadow-md cursor-pointer hover:brightness-110">
                      <Icon name="truck" className="w-4 h-4"/> + Tambah Supplier
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className={`p-4 rounded-3xl border flex items-center gap-3.5 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                      <div className="w-10 h-10 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center border border-indigo-500/30">
                        <Icon name="truck" className="w-5 h-5"/>
                      </div>
                      <div>
                        <p className="text-[10px] text-slate-400 uppercase font-bold">Total Supplier</p>
                        <p className="text-lg sm:text-xl font-black mt-0.5">{suppliers.length} Vendor</p>
                      </div>
                    </div>

                    <div className={`p-4 rounded-3xl border flex items-center gap-3.5 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                      <div className="w-10 h-10 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
                        <Icon name="banknote" className="w-4 h-4"/>
                      </div>
                      <div>
                        <p className="text-[10px] text-slate-400 uppercase font-bold">Total Pembelian Stok</p>
                        <p className="text-lg sm:text-xl font-black text-emerald-400 mt-0.5">{formatMoney(suppliers.reduce((a, b) => a + (b.totalPurchases || 0), 0))}</p>
                      </div>
                    </div>

                    <div className={`p-4 rounded-3xl border flex items-center gap-3.5 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                      <div className="w-10 h-10 rounded-2xl bg-amber-500/20 text-[#ff8a3d] flex items-center justify-center border border-amber-500/30">
                        <Icon name="credit-card" className="w-5 h-5"/>
                      </div>
                      <div>
                        <p className="text-[10px] text-slate-400 uppercase font-bold">Total Hutang Usaha Toko</p>
                        <p className="text-lg sm:text-xl font-black text-[#ff8a3d] mt-0.5">{formatMoney(suppliers.reduce((a, b) => a + (b.debt || 0), 0))}</p>
                      </div>
                    </div>
                  </div>

                  <div className={`rounded-3xl border overflow-hidden shadow-sm ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse min-w-[750px] text-xs">
                        <thead>
                          <tr className={`border-b uppercase font-bold tracking-wider text-[10px] ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-slate-400' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                            <th className="p-3.5">ID / Nama Supplier</th>
                            <th className="p-3.5">Kontak & Alamat</th>
                            <th className="p-3.5">Produk Disuplai</th>
                            <th className="p-3.5 text-right">Total Pembelian</th>
                            <th className="p-3.5 text-right">Hutang Aktif</th>
                            <th className="p-3.5 text-center">Aksi / Bayar</th>
                          </tr>
                        </thead>
                        <tbody className={`divide-y ${theme === 'dark' ? 'divide-[#2a2f60]' : 'divide-slate-100'}`}>
                          {suppliers.length === 0 ? (
                            <tr><td colSpan="6" className="p-8 text-center text-slate-400">Belum ada data supplier tersimpan.</td></tr>
                          ) : (
                            suppliers.map(s => {
                              const suppliedProducts = products.filter(p => p.supplier && p.supplier.toLowerCase().includes(s.name.toLowerCase()));
                              return (
                                <tr key={s.id} className={`transition-colors ${theme === 'dark' ? 'hover:bg-[#21254d]' : 'hover:bg-slate-50'}`}>
                                  <td className="p-3.5">
                                    <p className="font-extrabold text-sm">{s.name}</p>
                                    <p className="text-[10px] font-mono text-slate-400 mt-0.5">{s.id}</p>
                                    <p className="text-[11px] text-slate-400 mt-0.5">CP: {s.contactPerson || '-'}</p>
                                  </td>
                                  <td className="p-3.5 text-slate-400">
                                    <p className="flex items-center gap-1"><Icon name="phone" className="w-3 h-3 text-[#00d2d3]"/> {s.phone || '-'}</p>
                                    <p className="flex items-center gap-1 text-[11px] mt-0.5"><Icon name="map-pin" className="w-3 h-3 text-slate-500"/> {s.address || '-'}</p>
                                  </td>
                                  <td className="p-3.5">
                                    <div className="flex flex-wrap gap-1 max-w-[200px]">
                                      {suppliedProducts.length > 0 ? suppliedProducts.map(p => (
                                        <span key={p.id} className={`text-[10px] px-2 py-0.5 rounded-md font-bold ${theme === 'dark' ? 'bg-[#21254d] text-indigo-300' : 'bg-indigo-50 text-indigo-700'}`}>
                                          {p.name}
                                        </span>
                                      )) : <span className="text-slate-500 text-[11px]">-</span>}
                                    </div>
                                  </td>
                                  <td className="p-3.5 text-right font-extrabold">{formatMoney(s.totalPurchases)}</td>
                                  <td className="p-3.5 text-right">
                                    {s.debt > 0 ? (
                                      <div>
                                        <span className="bg-amber-500/20 text-[#ff8a3d] border border-amber-500/30 px-2.5 py-0.5 rounded-full text-xs font-black">{formatMoney(s.debt)}</span>
                                        <p className="text-[10px] text-amber-400 font-semibold mt-0.5">Belum Lunas</p>
                                      </div>
                                    ) : (
                                      <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full text-[10px] font-black">LUNAS</span>
                                    )}
                                  </td>
                                  <td className="p-3.5 text-center">
                                    <div className="flex items-center justify-center gap-1.5">
                                      {s.debt > 0 && (
                                        <button onClick={() => { setPaymentModalSupplier(s); setSupplierPayAmount(s.debt.toString()); }} className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold cursor-pointer shadow-sm">
                                          Bayar
                                        </button>
                                      )}
                                      <button onClick={() => { setEditingSupplier(s); setSupplierForm(s); setIsSupplierModalOpen(true); }} className={`p-1.5 rounded-xl border cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-[#00d2d3]' : 'bg-indigo-50 text-indigo-600'}`} title="Edit"><Icon name="edit" className="w-3.5 h-3.5"/></button>
                                      <button onClick={() => handleDeleteSupplier(s.id)} className="p-1.5 text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-xl cursor-pointer" title="Hapus"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                                    </div>
                                  </td>
                                </tr>
                              );
                            })
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'expenses' && currentUser.role === 'owner' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className={`p-4 sm:p-6 rounded-3xl border flex justify-between items-center ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                    <div><h2 className="text-xl font-black">Catatan Pengeluaran</h2><p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Beban operasional toko.</p></div>
                    <button onClick={() => setIsExpenseModalOpen(true)} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-3.5 py-2 rounded-2xl text-xs font-bold cursor-pointer">+ Beban</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {expenses.map(e => (
                      <div key={e.id} className={`p-4 rounded-3xl border shadow-sm flex justify-between items-center ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                        <div>
                          <span className="text-[10px] font-bold bg-[#ff4b8b]/20 text-[#ff4b8b] px-2 py-0.5 rounded-lg border border-pink-500/30">{e.category}</span>
                          <p className="font-bold text-xs mt-1">{e.note}</p>
                          <p className="text-[10px] text-slate-400">{e.date}</p>
                        </div>
                        <div className="text-right">
                          <p className="font-black text-sm text-[#ff4b8b]">{formatMoney(e.amount)}</p>
                          <button onClick={() => handleDeleteExpense(e.id)} className="text-[10px] text-slate-400 hover:text-rose-400 mt-1 cursor-pointer">Hapus</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {}
              {activeTab === 'settings' && currentUser.role === 'owner' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-4xl mx-auto space-y-4">
                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <div className="flex items-center justify-between">
                      <h3 className="font-extrabold text-sm flex items-center gap-2">
                        <Icon name="shield-check" className="w-4 h-4 text-[#00d2d3]"/> Status Lisensi Toko
                      </h3>
                      <span className="px-2.5 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-full text-xs font-bold">
                        {licenseStatus.label}
                      </span>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs pt-2">
                      <div className="p-3 bg-[#0f1228] border border-[#2a2f60] rounded-2xl">
                        <p className="text-slate-400 text-[10px]">Nama Toko Terdaftar</p>
                        <p className="font-bold mt-0.5">{licenseData?.storeName || storeSettings.name}</p>
                      </div>
                      <div className="p-3 bg-[#0f1228] border border-[#2a2f60] rounded-2xl">
                        <p className="text-slate-400 text-[10px]">Vault ID Akun</p>
                        <p className="font-mono text-[#00d2d3] font-bold mt-0.5">{licenseData?.vaultId || 'Local'}</p>
                      </div>
                    </div>
                    <button onClick={() => setShowExtendModal(true)} className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black text-xs shadow-md cursor-pointer">
                      + Masukkan Kode Perpanjangan Lisensi
                    </button>
                  </div>

                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <h3 className="font-extrabold text-sm flex items-center gap-2">
                      <Icon name="download" className="w-4 h-4 text-[#00d2d3]"/> Cadangan File Toko (.JSON)
                    </h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2 text-xs">
                      <button onClick={handleBackupDatabase} className="py-3 px-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-2xl shadow-md cursor-pointer flex items-center justify-center gap-1.5">
                        <Icon name="download" className="w-4 h-4"/> Download Cadangan Data (.json)
                      </button>
                      <label className="py-3 px-3 bg-[#21254d] border border-[#2a2f60] text-slate-200 font-bold rounded-2xl cursor-pointer text-center flex items-center justify-center gap-1.5">
                        <Icon name="upload" className="w-4 h-4 text-[#00d2d3]"/> Pulihkan Data (.json)
                        <input ref={fileInputRef} type="file" accept=".json" onChange={handleRestoreDatabase} className="hidden" />
                      </label>
                    </div>
                  </div>

                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <h3 className={`font-extrabold text-sm border-b pb-2 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>Identitas Toko & Nota</h3>
                    <form onSubmit={(e) => { e.preventDefault(); showToast('Pengaturan toko berhasil disimpan!'); }} className="space-y-3 text-xs">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="font-bold text-slate-400 mb-1 block">Nama Toko *</label>
                          <input type="text" required value={storeSettings.name} onChange={(e) => setStoreSettings({...storeSettings, name: e.target.value})} className={`w-full px-3 py-2.5 rounded-xl font-bold border outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                        </div>
                        <div>
                          <label className="font-bold text-slate-400 mb-1 block">Tagline / Slogan</label>
                          <input type="text" value={storeSettings.tagline} onChange={(e) => setStoreSettings({...storeSettings, tagline: e.target.value})} className={`w-full px-3 py-2.5 rounded-xl border outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                        </div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="font-bold text-slate-400 mb-1 block">No. Telepon Toko</label>
                          <input type="text" value={storeSettings.phone} onChange={(e) => setStoreSettings({...storeSettings, phone: e.target.value})} className={`w-full px-3 py-2.5 rounded-xl border outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                        </div>
                        <div>
                          <label className="font-bold text-slate-400 mb-1 block">Alamat Toko</label>
                          <input type="text" value={storeSettings.address} onChange={(e) => setStoreSettings({...storeSettings, address: e.target.value})} className={`w-full px-3 py-2.5 rounded-xl border outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                        </div>
                      </div>
                      <button type="submit" className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black shadow-md cursor-pointer">
                        Simpan Identitas Toko
                      </button>
                    </form>
                  </div>
                </div>
              )}
            </div>
          </div>

          {}
          {/* Modal Perpanjang Lisensi */}
          {showExtendModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className={`rounded-3xl w-full max-w-md p-6 space-y-4 border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200 text-slate-800'
              }`}>
                <div className="flex justify-between items-center">
                  <h3 className="font-black text-sm flex items-center gap-2">
                    <Icon name="key-round" className="w-4 h-4 text-[#00d2d3]" /> Perpanjang Masa Lisensi Toko
                  </h3>
                  <button onClick={() => setShowExtendModal(false)} className="cursor-pointer">
                    <Icon name="x" className="w-5 h-5 text-slate-400" />
                  </button>
                </div>
                <form onSubmit={handleExtendLicense} className="space-y-3.5 text-xs">
                  <div>
                    <label className="font-bold text-slate-400 block mb-1">Toko:</label>
                    <p className="p-3 bg-[#0f1228] border border-[#2a2f60] rounded-xl font-bold">{licenseData?.storeName || storeSettings.name}</p>
                  </div>
                  <div>
                    <label className="font-bold text-slate-400 block mb-1">Kode Lisensi Baru (Google Sheets):</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="POS-30D-XXXX-YYYY" 
                      value={extendInputKey} 
                      onChange={(e) => setExtendInputKey(e.target.value.toUpperCase())} 
                      className="w-full p-3.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl text-[#00d2d3] font-mono font-black text-center tracking-wider" 
                    />
                  </div>
                  <button type="submit" disabled={isExtendingLicense} className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl shadow-lg cursor-pointer">
                    {isExtendingLicense ? 'Memperbarui di Google Sheets...' : 'Terapkan Perpanjangan'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Barcode Camera Scanner */}
          {scannerModal.isOpen && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-3 animate-in fade-in">
              <div className="bg-[#181b3b] border border-[#2a2f60] rounded-3xl w-full max-w-md overflow-hidden shadow-2xl flex flex-col relative">
                <div className="p-4 border-b border-[#2a2f60] flex items-center justify-between text-white">
                  <span className="font-black text-sm flex items-center gap-2"><Icon name="camera" className="w-4 h-4 text-[#00d2d3]"/> Scanner Barcode Kamera</span>
                  <button onClick={closeScannerModal} className="p-1 text-slate-400 hover:text-white cursor-pointer"><Icon name="x" className="w-5 h-5"/></button>
                </div>
                <div className="relative aspect-square w-full bg-black flex items-center justify-center overflow-hidden">
                  <div id="scanner-reader" className="w-full h-full"></div>
                  <div className="scanner-laser-line"></div>
                </div>
              </div>
            </div>
          )}

          {/* Modal Nota Transaksi */}
          {viewingTransaction && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="rounded-t-3xl sm:rounded-3xl w-full max-w-md bg-[#181b3b] border border-[#2a2f60] text-white max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="p-4 border-b border-[#2a2f60] flex justify-between items-center">
                  <h3 className="font-black text-sm">Nota #{viewingTransaction.id}</h3>
                  <button onClick={() => setViewingTransaction(null)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button>
                </div>
                <div className="p-5 overflow-y-auto space-y-3 text-xs">
                  <div className="text-center pb-2 border-b border-dashed border-[#2a2f60]">
                    <h4 className="font-black text-sm uppercase">{licenseData?.storeName || storeSettings.name}</h4>
                    <p className="text-slate-400 text-[10px]">{viewingTransaction.date} • Kasir: {viewingTransaction.cashier}</p>
                  </div>
                  <div className="space-y-1 border-b border-dashed border-[#2a2f60] pb-2">
                    {(viewingTransaction.items || []).map((i, idx) => (
                      <div key={idx} className="flex justify-between">
                        <span>{i.product.name} ({i.qty}x)</span>
                        <span className="font-bold">{formatMoney((i.product.price - (Number(i.discountRp)||0)) * i.qty)}</span>
                      </div>
                    ))}
                  </div>
                  <div className="flex justify-between font-bold"><span>Total:</span><span className="text-[#00d2d3] font-black">{formatMoney(viewingTransaction.total)}</span></div>
                  {viewingTransaction.paymentMethod === 'Cash' && (
                    <div className="flex justify-between text-[11px] text-emerald-400">
                      <span>Kembalian:</span>
                      <span className="font-bold">{formatMoney(viewingTransaction.change)}</span>
                    </div>
                  )}
                </div>
                <div className="p-3 border-t border-[#2a2f60] grid grid-cols-3 gap-2">
                  <button onClick={() => {
                    let text = `*NOTA - ${storeSettings.name}*\nNo: ${viewingTransaction.id}\nTotal: ${formatMoney(viewingTransaction.total)}\n\nTerima kasih!`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                  }} className="py-2.5 bg-emerald-600 text-white rounded-xl font-bold text-xs cursor-pointer flex items-center justify-center gap-1"><Icon name="message-circle" className="w-3.5 h-3.5"/> WA</button>
                  <button onClick={() => window.print()} className="py-2.5 bg-indigo-600 text-white rounded-xl font-bold text-xs cursor-pointer flex items-center justify-center gap-1"><Icon name="printer" className="w-3.5 h-3.5"/> Cetak</button>
                  <button onClick={() => setViewingTransaction(null)} className="py-2.5 bg-[#21254d] text-white rounded-xl font-bold text-xs cursor-pointer">Tutup</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Konfirmasi Hapus Transaksi (Owner Only) */}
          {deleteTransactionModal.show && deleteTransactionModal.transaction && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className={`rounded-3xl w-full max-w-sm p-6 space-y-4 border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
              }`}>
                <div className="w-12 h-12 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto border border-rose-500/30">
                  <Icon name="trash-2" className="w-6 h-6" />
                </div>
                <div className="text-center space-y-1">
                  <h3 className="font-black text-base">Hapus Riwayat Nota #{deleteTransactionModal.transaction.id}?</h3>
                  <p className="text-xs text-slate-400">Total: <span className="text-[#00d2d3] font-bold">{formatMoney(deleteTransactionModal.transaction.total)}</span></p>
                </div>

                <div className={`p-3 rounded-2xl border text-xs space-y-2 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                  <label className="flex items-center gap-2.5 cursor-pointer">
                    <input 
                      type="checkbox" 
                      checked={deleteTransactionModal.restoreStock} 
                      onChange={(e) => setDeleteTransactionModal({ ...deleteTransactionModal, restoreStock: e.target.checked })} 
                      className="rounded accent-indigo-600 w-4 h-4"
                    />
                    <span className="font-semibold text-slate-300">Kembalikan stok barang yang terjual ke inventaris</span>
                  </label>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button 
                    onClick={() => setDeleteTransactionModal({ show: false, transaction: null, restoreStock: true })} 
                    className={`py-3 rounded-2xl font-bold text-xs border cursor-pointer ${
                      theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-300 hover:bg-slate-700' : 'bg-slate-100 text-slate-700'
                    }`}
                  >
                    Batal
                  </button>
                  <button 
                    onClick={() => handleDeleteTransaction(deleteTransactionModal.transaction, deleteTransactionModal.restoreStock)} 
                    className="py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl font-black text-xs shadow-lg shadow-rose-500/20 cursor-pointer"
                  >
                    Ya, Hapus Nota
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Form Tambah/Edit Produk */}
          {isProductModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="rounded-3xl w-full max-w-md bg-[#181b3b] border border-[#2a2f60] text-white p-5 space-y-3 shadow-2xl">
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">{editingProduct ? 'Edit Barang' : 'Tambah Produk'}</h3><button onClick={() => setIsProductModalOpen(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveProduct} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-400 mb-1 block">Barcode / SKU</label>
                    <div className="flex gap-2">
                      <input type="text" placeholder="SKU Barcode" value={productForm.sku} onChange={(e) => setProductForm({...productForm, sku: e.target.value})} className="flex-1 p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl outline-none" />
                      <button type="button" onClick={() => openScanner('product_form')} className="px-3 py-2 bg-gradient-to-r from-[#00d2d3] to-[#6366f1] text-white font-bold rounded-xl flex items-center gap-1 cursor-pointer"><Icon name="camera" className="w-4 h-4"/><span>Scan</span></button>
                    </div>
                  </div>
                  <div><label className="font-bold text-slate-400 mb-1 block">Nama Barang *</label><input type="text" required placeholder="Nama Produk" value={productForm.name} onChange={(e) => setProductForm({...productForm, name: e.target.value})} className="w-full p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl outline-none" /></div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="font-bold text-slate-400 mb-1 block">Kategori</label><input type="text" required value={productForm.category} onChange={(e) => setProductForm({...productForm, category: e.target.value})} className="w-full p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl outline-none" /></div>
                    <div><label className="font-bold text-slate-400 mb-1 block">Stok</label><input type="number" required value={productForm.stock} onChange={(e) => setProductForm({...productForm, stock: e.target.value})} className="w-full p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl outline-none" /></div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="font-bold text-slate-400 mb-1 block">Harga Jual (Rp) *</label><input type="number" required value={productForm.price} onChange={(e) => setProductForm({...productForm, price: e.target.value})} className="w-full p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl font-bold text-[#00d2d3] outline-none" /></div>
                    <div><label className="font-bold text-slate-400 mb-1 block">Harga Pokok (Rp)</label><input type="number" required value={productForm.costPrice} onChange={(e) => setProductForm({...productForm, costPrice: e.target.value})} className="w-full p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl outline-none" /></div>
                  </div>
                  <button type="submit" disabled={isSaving} className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black text-xs shadow-md mt-2 cursor-pointer">Simpan Produk</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Restock */}
          {showRestockModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
              }`}>
                <div className="p-4 border-b border-[#2a2f60] flex justify-between items-center bg-emerald-500/20 text-emerald-400"><h3 className="font-black text-sm flex items-center gap-1.5"><Icon name="plus" className="w-4 h-4"/> Stok Masuk & Tagihan</h3><button onClick={() => setShowRestockModal(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveRestock} className="p-4 overflow-y-auto space-y-3 text-xs">
                  <div><label className="font-bold text-slate-400 mb-1 block">Nama Supplier *</label><input type="text" required placeholder="Contoh: Toko Grosir Jaya" value={restockForm.supplier} onChange={(e) => setRestockForm({...restockForm, supplier: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  <div className="space-y-2">
                    <label className="font-bold text-slate-400 block">Daftar Barang Masuk:</label>
                    {restockForm.items.map((it, idx) => (
                      <div key={idx} className="flex gap-2 items-center">
                        <select required value={it.productId} onChange={(e) => updateDynamicList(restockForm, setRestockForm, idx, 'productId', e.target.value)} className={`flex-1 p-2.5 border rounded-xl text-xs outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`}><option value="">-- Pilih Barang --</option>{products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
                        <input type="number" required min="1" placeholder="Qty" value={it.qty} onChange={(e) => updateDynamicList(restockForm, setRestockForm, idx, 'qty', e.target.value)} className={`w-16 p-2.5 border rounded-xl text-center text-xs font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} />
                      </div>
                    ))}
                    <button type="button" onClick={() => addRowDynamicList(restockForm, setRestockForm)} className="text-[11px] font-bold text-[#00d2d3] cursor-pointer">+ Tambah Baris</button>
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-black text-xs shadow-md mt-2 cursor-pointer">Simpan Stok Masuk</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Stok Keluar / Rusak */}
          {showStockOutModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
              }`}>
                <div className="p-4 border-b border-[#2a2f60] flex justify-between items-center bg-rose-500/20 text-rose-400"><h3 className="font-black text-sm flex items-center gap-1.5"><Icon name="minus" className="w-4 h-4"/> Stok Keluar / Rusak</h3><button onClick={() => setShowStockOutModal(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveStockOut} className="p-4 overflow-y-auto space-y-3 text-xs">
                  <div><label className="font-bold text-slate-400 mb-1 block">Alasan Pengurangan Stok *</label><input type="text" required placeholder="Contoh: Barang kadaluarsa / pecah" value={stockOutForm.reason} onChange={(e) => setStockOutForm({...stockOutForm, reason: e.target.value})} className={`w-full px-3 py-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  <div className="space-y-2">
                    <label className="font-bold text-slate-400 block">Daftar Barang Keluar:</label>
                    {stockOutForm.items.map((it, idx) => (
                      <div key={idx} className="flex gap-2 items-center">
                        <select required value={it.productId} onChange={(e) => updateDynamicList(stockOutForm, setStockOutForm, idx, 'productId', e.target.value)} className={`flex-1 p-2.5 border rounded-xl text-xs outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`}><option value="">-- Pilih Barang --</option>{products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
                        <input type="number" required min="1" placeholder="Qty" value={it.qty} onChange={(e) => updateDynamicList(stockOutForm, setStockOutForm, idx, 'qty', e.target.value)} className={`w-16 p-2.5 border rounded-xl text-center text-xs font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} />
                      </div>
                    ))}
                    <button type="button" onClick={() => addRowDynamicList(stockOutForm, setStockOutForm)} className="text-[11px] font-bold text-[#00d2d3] cursor-pointer">+ Tambah Baris</button>
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl font-black text-xs shadow-md mt-2 cursor-pointer">Kurangi Stok</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Pengeluaran / Beban */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'
              }`}>
                <div className={`p-4 border-b flex justify-between items-center ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}><h3 className="font-black text-sm">Catat Pengeluaran</h3><button onClick={() => setIsExpenseModalOpen(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleSaveExpense} className="p-4 space-y-3 text-xs">
                  <div><label className="font-bold text-slate-400 mb-1 block">Kategori</label><select value={expenseForm.category} onChange={(e) => setExpenseForm({...expenseForm, category: e.target.value})} className={`w-full p-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`}><option value="Listrik">⚡ Listrik</option><option value="Internet">🌐 Internet</option><option value="Sewa">🏠 Sewa Tempat</option><option value="Gaji">👥 Gaji</option><option value="Lainnya">🏷️ Lainnya</option></select></div>
                  <div><label className="font-bold text-slate-400 mb-1 block">Nominal (Rp) *</label><input type="number" required placeholder="Contoh: 150000" value={expenseForm.amount} onChange={(e) => setExpenseForm({...expenseForm, amount: e.target.value})} className={`w-full p-2.5 border rounded-xl font-black text-[#ff4b8b] outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : ''}`} /></div>
                  <div><label className="font-bold text-slate-400 mb-1 block">Keterangan</label><input type="text" placeholder="Misal: Beli token listrik" value={expenseForm.note} onChange={(e) => setExpenseForm({...expenseForm, note: e.target.value})} className={`w-full p-2.5 border rounded-xl outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} /></div>
                  <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black text-xs shadow-md mt-1 cursor-pointer">Simpan Beban</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Tahan Pesanan (Save Draft) */}
          {showDraftSaveModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className={`rounded-3xl w-full max-w-sm p-6 space-y-4 border shadow-2xl ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Tahan Pesanan Saat Ini</h3><button onClick={() => setShowDraftSaveModal(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <div className="space-y-3 pt-1">
                  <div>
                    <label className="text-[11px] font-bold text-slate-400 mb-1 block">Nama Pelanggan / Nomor Meja *</label>
                    <input type="text" autoFocus placeholder="Misal: Bapak Budi / Meja 04" value={draftNameInput} onChange={(e) => setDraftNameInput(e.target.value)} className={`w-full p-3 border rounded-xl outline-none font-bold text-xs ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                  </div>
                  <button onClick={saveDraft} className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl text-xs shadow-md cursor-pointer">Simpan & Tahan Pesanan</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Daftar Pesanan Tertahan (Draft List) */}
          {showDraftListModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className={`rounded-3xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden border shadow-2xl ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="p-4 border-b border-[#2a2f60] flex justify-between items-center"><h3 className="font-black text-sm flex items-center gap-1.5"><Icon name="folder" className="w-4 h-4 text-[#00d2d3]"/> Pesanan Tertahan (Draft)</h3><button onClick={() => setShowDraftListModal(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <div className="p-4 flex-1 overflow-y-auto space-y-2.5 text-xs">
                  {draftOrders.length === 0 ? (<p className="text-center py-8 text-slate-400">Belum ada pesanan yang ditahan.</p>) : (
                    draftOrders.map(d => (
                      <div key={d.id} className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                        <div>
                          <p className="font-extrabold text-sm">{d.name}</p>
                          <p className="text-[10px] text-slate-400 mt-0.5">{d.cart.length} macam barang • {d.date}</p>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <button onClick={() => { setDraftOrders(draftOrders.filter(item => item.id !== d.id)); showToast('Draft pesanan dihapus'); }} className="p-2 text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-xl cursor-pointer"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                          <button onClick={() => loadDraft(d)} className="px-3 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-bold cursor-pointer shadow-md">Buka</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal Riwayat & Detail Pelanggan */}
          {viewingCustomer && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className={`rounded-3xl w-full max-w-lg p-6 space-y-4 border shadow-2xl ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                <div className="flex justify-between items-center pb-3 border-b border-[#2a2f60]">
                  <h3 className="font-black text-sm flex items-center gap-2">
                    <Icon name="users" className="w-4 h-4 text-[#00d2d3]"/> Profil & Riwayat Pelanggan
                  </h3>
                  <button onClick={() => setViewingCustomer(null)} className="cursor-pointer">
                    <Icon name="x" className="w-5 h-5 text-slate-400" />
                  </button>
                </div>

                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-white font-black text-base flex items-center justify-center">
                    {viewingCustomer.name.substring(0, 2).toUpperCase()}
                  </div>
                  <div>
                    <h4 className="font-black text-base">{viewingCustomer.name}</h4>
                    <p className="text-[11px] font-mono text-slate-400">{viewingCustomer.id} • {viewingCustomer.phone || 'Tanpa No. HP'}</p>
                  </div>
                </div>

                <div className={`p-3.5 rounded-2xl border text-xs space-y-1.5 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                  <p className="text-[10px] text-slate-400 uppercase font-bold">Alamat Lengkap:</p>
                  <p className="font-semibold">{viewingCustomer.address || 'Belum ada alamat tercatat'}</p>
                </div>

                <div className="grid grid-cols-3 gap-2.5 text-center text-xs">
                  <div className={`p-3 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                    <p className="text-[10px] text-slate-400 font-bold">Total Transaksi</p>
                    <p className="font-black text-base mt-0.5">{viewingCustomer.totalTrx || 0}x</p>
                  </div>
                  <div className={`p-3 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                    <p className="text-[10px] text-slate-400 font-bold">Total Belanja</p>
                    <p className="font-black text-sm text-[#00d2d3] mt-0.5">{formatMoney(viewingCustomer.totalSpent)}</p>
                  </div>
                  <div className={`p-3 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                    <p className="text-[10px] text-slate-400 font-bold">Sisa Piutang</p>
                    <p className="font-black text-sm text-[#ff8a3d] mt-0.5">{formatMoney(viewingCustomer.debt)}</p>
                  </div>
                </div>

                {viewingCustomer.debt > 0 && (
                  <button 
                    onClick={() => {
                      const targetCust = viewingCustomer;
                      setViewingCustomer(null);
                      setPaymentModalCustomer(targetCust);
                      setCustomerPayAmount(targetCust.debt.toString());
                    }} 
                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-2xl shadow-md cursor-pointer flex items-center justify-center gap-1.5"
                  >
                    <Icon name="credit-card" className="w-4 h-4"/>
                    <span>Bayar / Lunasi Piutang ({formatMoney(viewingCustomer.debt)})</span>
                  </button>
                )}
              </div>
            </div>
          )}

          {/* Modal Pelunasan Piutang Pelanggan */}
          {paymentModalCustomer && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="rounded-3xl w-full max-w-sm bg-[#181b3b] border border-[#2a2f60] text-white p-5 space-y-3 shadow-2xl">
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Pelunasan Piutang Pelanggan</h3><button onClick={() => setPaymentModalCustomer(null)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handlePayCustomerDebt} className="space-y-3 text-xs">
                  <div><label className="text-slate-400 font-bold block mb-1">Pelanggan:</label><p className="p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl font-bold">{paymentModalCustomer.name}</p></div>
                  <div><label className="text-slate-400 font-bold block mb-1">Sisa Piutang:</label><p className="p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl font-black text-[#ff8a3d]">{formatMoney(paymentModalCustomer.debt)}</p></div>
                  <div><label className="text-slate-400 font-bold block mb-1">Nominal Dibayar (Rp):</label><input type="number" required placeholder="Nominal bayar" value={customerPayAmount} onChange={(e) => setCustomerPayAmount(e.target.value)} className="w-full p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl font-bold text-emerald-400 outline-none" /></div>
                  <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-black text-xs shadow-md cursor-pointer">Simpan Pembayaran</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Pelunasan Hutang Supplier */}
          {paymentModalSupplier && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="rounded-3xl w-full max-w-sm bg-[#181b3b] border border-[#2a2f60] text-white p-5 space-y-3 shadow-2xl">
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Pelunasan Hutang ke Supplier</h3><button onClick={() => setPaymentModalSupplier(null)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handlePaySupplierDebt} className="space-y-3 text-xs">
                  <div><label className="text-slate-400 font-bold block mb-1">Supplier:</label><p className="p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl font-bold">{paymentModalSupplier.name}</p></div>
                  <div><label className="text-slate-400 font-bold block mb-1">Sisa Hutang Toko:</label><p className="p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl font-black text-[#ff8a3d]">{formatMoney(paymentModalSupplier.debt)}</p></div>
                  <div><label className="text-slate-400 font-bold block mb-1">Nominal Dibayar (Rp):</label><input type="number" required placeholder="Nominal bayar" value={supplierPayAmount} onChange={(e) => setSupplierPayAmount(e.target.value)} className="w-full p-2.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl font-bold text-emerald-400 outline-none" /></div>
                  <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-black text-xs shadow-md cursor-pointer">Simpan Pembayaran</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Ganti Role */}
          {showRoleSwitcher && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm p-5 space-y-3 border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Ganti Peran Pengguna</h3><button onClick={() => setShowRoleSwitcher(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <div className="space-y-2 pt-2">
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Owner Toko', role: 'owner', avatar: 'OT' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>👑 Owner (Akses Penuh)</span><Icon name="shield-check" className="w-4 h-4 text-indigo-400"/></button>
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Admin Toko', role: 'admin', avatar: 'AT' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>💼 Admin Toko</span><Icon name="user-check" className="w-4 h-4 text-cyan-400"/></button>
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Kasir POS', role: 'kasir', avatar: 'KP' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>🛒 Kasir (POS)</span><Icon name="lock" className="w-4 h-4 text-slate-400"/></button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Verifikasi Password Role */}
          {authModal.show && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm p-5 space-y-3 border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Verifikasi Password</h3><button onClick={() => setAuthModal({ show: false, targetRole: null, password: '' })} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleAuthSubmit} className="space-y-3 pt-2">
                  <input type="password" required autoFocus placeholder="Password role..." value={authModal.password} onChange={(e) => setAuthModal({...authModal, password: e.target.value})} className={`w-full p-3.5 border rounded-2xl text-center text-lg font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} />
                  <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl text-xs shadow-md cursor-pointer">Masuk</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

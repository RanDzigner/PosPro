<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POSPro - Sistem Kasir Berlisensi & Cloud Sync</title>
  
  <!-- Tailwind CSS & Konfigurasi Tema -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0f1228',
              card: '#181b3b',
              card2: '#21254d',
              border: '#2a2f60',
              accent: '#6366f1',
              cyan: '#00d2d3',
              pink: '#ff4b8b',
              orange: '#ff8a3d',
              purple: '#8b5cf6'
            }
          }
        }
      }
    }

  <!-- Pustaka React, Lucide, Html5Qrcode, dan MQTT Client -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-sizing: border-box;
    }
    
    body { 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      margin: 0; 
      padding: 0;
      overscroll-behavior-y: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }
    
    .lucide-icon { display: inline-flex; align-items: center; justify-content: center; }
    .pb-safe { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
    .pt-safe { padding-top: calc(0.75rem + env(safe-area-inset-top, 0px)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes scanLaser {
      0% { top: 12%; opacity: 0.85; }
      50% { top: 88%; opacity: 1; }
      100% { top: 12%; opacity: 0.85; }
    }
    .scanner-laser-line {
      position: absolute;
      left: 8%;
      right: 8%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00d2d3, #22c55e, #00d2d3, transparent);
      box-shadow: 0 0 16px 3px rgba(0, 210, 211, 0.9);
      animation: scanLaser 2s infinite ease-in-out;
      border-radius: 9999px;
      z-index: 25;
      pointer-events: none;
    }

    #scanner-reader {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      background: #000 !important;
      border: none !important;
      overflow: hidden !important;
    }
    #scanner-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }
    #scanner-reader canvas, #scanner-reader__dashboard {
      display: none !important;
    }
  </style>
</head>
<body class="bg-[#0f1228] text-slate-100 antialiased select-none dark">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback, Component } = React;

    // =========================================================================
    // ⚙️ KONFIGURASI BACKEND GOOGLE APPS SCRIPT (GOOGLE SHEETS LISENSI)
    // =========================================================================
    // Tempelkan URL Web App Google Apps Script Anda (yang berakhiran /exec) di bawah ini:
    const GOOGLE_SCRIPT_WEBAPP_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";
    
    // Kunci token pengaman komunikasi antara Web Vercel & Google Script Anda
    const APP_SECRET_TOKEN = "POSPRO_SECURITY_KEY_2026_X9";

    // Kunci Rahasia Cadangan (Fallback Offline Hash)
    const MASTER_LICENSE_SECRET = "POSPRO_SECRET_KEY_DEV_9824X";

    // Helper normalisasi nama toko agar toleran terhadap spasi dan huruf besar/kecil
    const normalizeStoreName = (name) => {
      return String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
    };

    // Hash Helper untuk memvalidasi Lisensi Key yang TERKUNCI pada Nama Toko (Fallback Offline)
    const generateLicenseChecksum = (storeName, durationCode, serial) => {
      const normName = normalizeStoreName(storeName);
      const combined = `${normName}::${durationCode}::${serial}::${MASTER_LICENSE_SECRET}`;
      let hash = 0;
      for (let i = 0; i < combined.length; i++) {
        const char = combined.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return Math.abs(hash).toString(36).toUpperCase().padStart(4, '0').slice(-4);
    };

    // Fungsi Validasi Kode Lisensi Offline (Digunakan jika Google Script URL belum diisi)
    const verifyLicenseKeyOffline = (rawKey, storeName) => {
      if (!storeName || !storeName.trim()) {
        return { valid: false, message: 'Nama Pemilik / Toko wajib diisi untuk verifikasi lisensi!' };
      }
      if (!rawKey) return { valid: false, message: 'Kode lisensi tidak boleh kosong.' };
      
      const cleanKey = rawKey.trim().toUpperCase();
      const parts = cleanKey.split('-');
      
      if (parts.length !== 4 || parts[0] !== 'POS') {
        return { valid: false, message: 'Format lisensi salah. Contoh format: POS-30D-XXXXX-YYYY' };
      }

      const [prefix, durationCode, serial, checksum] = parts;
      const expectedChecksum = generateLicenseChecksum(storeName, durationCode, serial);

      if (checksum !== expectedChecksum) {
        return { 
          valid: false, 
          message: `Kode Lisensi TIDAK COCOK untuk nama toko "${storeName.trim()}". Kode ini terkunci untuk toko lain atau tidak valid!` 
        };
      }

      let days = 0;
      let label = '';
      if (durationCode === 'LIFE') {
        days = 99999;
        label = 'Permanen (Lifetime)';
      } else if (durationCode.endsWith('D')) {
        days = parseInt(durationCode.replace('D', ''), 10);
        label = `${days} Hari`;
        if (isNaN(days) || days <= 0) {
          return { valid: false, message: 'Durasi lisensi tidak valid.' };
        }
      } else {
        return { valid: false, message: 'Tipe durasi lisensi tidak dikenali.' };
      }

      return {
        valid: true,
        key: cleanKey,
        durationDays: days,
        durationLabel: label,
        serial: serial,
        storeName: storeName.trim()
      };
    };

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("POSPro Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#0f1228] text-white flex flex-col items-center justify-center p-6 text-center font-sans">
              <div className="bg-[#181b3b] p-6 rounded-3xl border border-[#2a2f60] max-w-md w-full shadow-2xl space-y-4">
                <div className="w-14 h-14 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto">
                  <i data-lucide="alert-triangle" className="w-8 h-8"></i>
                </div>
                <h2 className="text-lg font-black text-white">Memuat Ulang Sistem Kasir</h2>
                <p className="text-xs text-slate-400">Data Anda tersimpan dengan aman. Klik tombol di bawah untuk memuat ulang.</p>
                <button 
                  onClick={() => window.location.reload()} 
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl text-xs shadow-lg transition-all cursor-pointer"
                >
                  Muat Ulang Sekarang
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const Icon = ({ name, className = "w-5 h-5", title }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          try {
            iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
            window.lucide.createIcons({ root: iconRef.current, nameAttr: 'data-lucide' });
          } catch (e) {}
        }
      }, [name, className]);
      return <span ref={iconRef} className={`lucide-icon shrink-0 ${className}`} title={title || name} />;
    };

    const generateId = () => Math.random().toString(36).substr(2, 9);
    const formatMoney = (amount) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount || 0);

    const parseDateStr = (dateStr) => {
      if (!dateStr) return new Date();
      try {
        const parts = String(dateStr).split(', ');
        if (parts.length !== 2) return new Date();
        const [d, m, y] = parts[0].split('/');
        const [hr, min, sec] = parts[1].split('.');
        return new Date(y, m - 1, d, hr, min, sec);
      } catch (e) {
        return new Date();
      }
    };

    const playScanBeep = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1900, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    };

    const defaultSettings = {
      name: 'Toko Saya', tagline: 'Sistem Kasir Cloud Sync', phone: '081234567890', address: 'Jl. Bisnis Sukses No. 88',
      receiptFooter: 'Terima kasih atas kunjungan Anda!\nBarang yang dibeli tidak dapat ditukar.', invoicePrefix: 'INV-', taxPercent: 0, defaultDiscount: 0, currency: 'IDR',
      paymentMethods: ['Cash', 'Debit', 'Transfer', 'QRIS', 'E-wallet', 'Hutang']
    };

    const defaultProducts = [
      { id: '1', sku: 'BRG-001', name: 'Kopi Susu Gula Aren', costPrice: 12000, price: 18000, packPrice: 0, stock: 45, category: 'Minuman', supplier: 'PT. Kopi Nusantara' },
      { id: '2', sku: 'BRG-002', name: 'Nasi Goreng Spesial', costPrice: 15000, price: 25000, packPrice: 0, stock: 20, category: 'Makanan', supplier: 'Pasar Induk' },
      { id: '3', sku: 'BRG-003', name: 'Es Teh Manis Jumbo', costPrice: 2500, price: 6000, packPrice: 0, stock: 80, category: 'Minuman', supplier: 'PT. Sumber Segar' },
      { id: '4', sku: 'BRG-004', name: 'Roti Bakar Coklat Keju', costPrice: 10000, price: 17000, packPrice: 0, stock: 15, category: 'Makanan', supplier: 'Bakery Prima' },
      { id: '5', sku: 'BRG-005', name: 'Keripik Kentang Renyah', costPrice: 6000, price: 10000, packPrice: 0, stock: 35, category: 'Snack', supplier: 'Sentra Camilan' }
    ];

    const demoTransactions = [
      {
        id: 'INV-829104',
        date: new Date().toLocaleString('id-ID'),
        items: [{ product: defaultProducts[0], qty: 2, discountRp: 0 }, { product: defaultProducts[1], qty: 1, discountRp: 0 }],
        subtotal: 61000, discount: 0, tax: 0, total: 61000, cash: 100000, change: 39000, paymentMethod: 'Cash',
        customerName: 'Pelanggan Umum', cashier: 'Kasir Utama'
      }
    ];

    const loadFromLocal = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    };

    const saveToLocal = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    };

    const generateStoreSyncKey = (email, password) => {
      const combined = `${email.trim().toLowerCase()}::${password.trim()}`;
      let hash = 0;
      for (let i = 0; i < combined.length; i++) {
        const char = combined.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return `pospro_vault_${Math.abs(hash).toString(36)}`;
    };

    function App() {
      // 1. STATE LISENSI APLIKASI
      const [licenseData, setLicenseData] = useState(() => loadFromLocal('pospro_active_license', null));
      const [licenseInputKey, setLicenseInputKey] = useState('');
      const [licenseOwnerName, setLicenseOwnerName] = useState('');
      const [licenseError, setLicenseError] = useState('');
      const [showExtendLicenseModal, setShowExtendLicenseModal] = useState(false);

      // Hitung Sisa Waktu Lisensi
      const licenseStatus = useMemo(() => {
        if (!licenseData) return { isActivated: false, isExpired: true, daysRemaining: 0 };
        if (licenseData.isDemo) return { isActivated: true, isDemo: true, isExpired: false, daysRemaining: 999, label: 'Mode Uji Coba (Demo)' };
        if (licenseData.isLifetime) return { isActivated: true, isLifetime: true, isExpired: false, daysRemaining: 99999, label: 'Aktif Selamanya (Lifetime)' };

        const now = Date.now();
        const expiry = new Date(licenseData.expiresAt).getTime();
        const diffMs = expiry - now;
        const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

        return {
          isActivated: true,
          isExpired: daysLeft <= 0,
          daysRemaining: Math.max(0, daysLeft),
          expiryDateStr: new Date(licenseData.expiresAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
          label: daysLeft > 0 ? `${daysLeft} Hari Lagi (s/d ${new Date(licenseData.expiresAt).toLocaleDateString('id-ID')})` : 'Lisensi Telah Berakhir'
        };
      }, [licenseData]);

      // Sesi Akun Pengguna otomatis terikat ke Lisensi Key
      const isDemoUser = licenseData?.isDemo === true;
      const syncKey = useMemo(() => {
        if (!licenseData) return 'guest';
        if (licenseData.isDemo) return 'demo_vault';
        return `lic_${licenseData.vaultId || licenseData.serial || generateStoreSyncKey(licenseData.key, MASTER_LICENSE_SECRET)}`;
      }, [licenseData]);

      const userStoragePrefix = `pospro_data_${syncKey}`;
      
      const [isCloudSyncing, setIsCloudSyncing] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const [syncStatusMsg, setSyncStatusMsg] = useState('Cloud Siap Terhubung');
      const [theme, setTheme] = useState(() => loadFromLocal('pospro_theme', 'dark'));
      const [isVerifyingLicense, setIsVerifyingLicense] = useState(false);
      const [isExtendingLicense, setIsExtendingLicense] = useState(false);
      const [extendLicenseKeyInput, setExtendLicenseKeyInput] = useState('');

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          document.body.className = "bg-[#0f1228] text-slate-100 antialiased select-none dark";
        } else {
          root.classList.remove('dark');
          document.body.className = "bg-[#f4f6fb] text-slate-800 antialiased select-none";
        }
        saveToLocal('pospro_theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      const [activeTab, setActiveTab] = useState('pos');
      
      const [isMobileDevice, setIsMobileDevice] = useState(() => {
        return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 1024;
      });

      useEffect(() => {
        const handleResize = () => {
          setIsMobileDevice(/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 1024);
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const [currentUserRole, setCurrentUserRole] = useState({ 
        name: 'Kasir Toko', 
        role: 'kasir', 
        avatar: 'KS' 
      });
      const [showRoleSwitcher, setShowRoleSwitcher] = useState(false);
      const [showMobileCartDrawer, setShowMobileCartDrawer] = useState(false);

      const currentUser = currentUserRole;

      const [authModal, setAuthModal] = useState({ show: false, targetRole: null, password: '' });
      const [rolePasswords, setRolePasswords] = useState(() => loadFromLocal(`${userStoragePrefix}_passwords`, { owner: 'owner123', admin: 'admin123' }));

      const [storeSettings, setStoreSettings] = useState(() => {
        const saved = loadFromLocal(`${userStoragePrefix}_settings`, null);
        if (saved) return saved;
        return isDemoUser ? { ...defaultSettings, name: 'Toko Demo POSPro' } : { ...defaultSettings, name: licenseData?.ownerName || 'Toko Saya' };
      });

      const [products, setProducts] = useState(() => {
        const saved = loadFromLocal(`${userStoragePrefix}_products`, null);
        if (saved) return saved;
        return defaultProducts;
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = loadFromLocal(`${userStoragePrefix}_transactions`, null);
        if (saved) return saved;
        return isDemoUser ? demoTransactions : [];
      });

      const [draftOrders, setDraftOrders] = useState(() => loadFromLocal(`${userStoragePrefix}_drafts`, []));
      const [customers, setCustomers] = useState(() => {
        const saved = loadFromLocal(`${userStoragePrefix}_customers`, null);
        if (saved) return saved;
        return isDemoUser ? [
          { id: 'CUST-001', name: 'Budi Santoso', phone: '081298765432', address: 'Jakarta Selatan', totalTrx: 1, totalSpent: 38000, debt: 0 }
        ] : [];
      });

      const [suppliers, setSuppliers] = useState(() => {
        const saved = loadFromLocal(`${userStoragePrefix}_suppliers`, null);
        if (saved) return saved;
        return isDemoUser ? [
          { id: 'SUP-001', name: 'PT. Kopi Nusantara', contactPerson: 'Hendra', phone: '0811223344', address: 'Jakarta', totalPurchases: 540000, debt: 0 }
        ] : [];
      });

      const [expenses, setExpenses] = useState(() => {
        const saved = loadFromLocal(`${userStoragePrefix}_expenses`, null);
        if (saved) return saved;
        return isDemoUser ? [
          { id: 'EXP-101', date: new Date().toLocaleDateString('id-ID'), category: 'Listrik', amount: 150000, note: 'Token Listrik Toko' }
        ] : [];
      });

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const fileInputRef = useRef(null);
      const isRemoteUpdatingRef = useRef(false);
      const lastSavedStateRef = useRef(null);
      const lastLocalUpdateTimestampRef = useRef(loadFromLocal(`${userStoragePrefix}_last_ts`, 0));
      const mqttClientRef = useRef(null);
      const deviceIdRef = useRef(Math.random().toString(36).substring(7));

      const loadStoreDataFromLocal = useCallback((prefix, ownerName = '') => {
        const savedSettings = loadFromLocal(`${prefix}_settings`, null) || { ...defaultSettings, name: ownerName || 'Toko Saya' };
        const savedProducts = loadFromLocal(`${prefix}_products`, defaultProducts);
        const savedTrx = loadFromLocal(`${prefix}_transactions`, []);
        const savedCust = loadFromLocal(`${prefix}_customers`, []);
        const savedSupp = loadFromLocal(`${prefix}_suppliers`, []);
        const savedExp = loadFromLocal(`${prefix}_expenses`, []);
        const savedDrafts = loadFromLocal(`${prefix}_drafts`, []);
        const savedPass = loadFromLocal(`${prefix}_passwords`, { owner: 'owner123', admin: 'admin123' });

        setStoreSettings(savedSettings);
        setProducts(savedProducts);
        setTransactions(savedTrx);
        setCustomers(savedCust);
        setSuppliers(savedSupp);
        setExpenses(savedExp);
        setDraftOrders(savedDrafts);
        setRolePasswords(savedPass);

        lastLocalUpdateTimestampRef.current = loadFromLocal(`${prefix}_last_ts`, 0);
        
        lastSavedStateRef.current = JSON.stringify({
            storeSettings: savedSettings, products: savedProducts, transactions: savedTrx,
            customers: savedCust, suppliers: savedSupp, expenses: savedExp, draftOrders: savedDrafts, rolePasswords: savedPass
        });
      }, []);

      const handleActivateLicense = async (e) => {
        e.preventDefault();
        setLicenseError('');
        
        const cleanKey = (licenseInputKey || '').trim().toUpperCase();
        const cleanStoreName = (licenseOwnerName || '').trim();

        if (!cleanKey || !cleanStoreName) {
          setLicenseError('Nama Pemilik / Toko dan Kode Lisensi wajib diisi!');
          return;
        }

        setIsVerifyingLicense(true);

        // JIKA GOOGLE_SCRIPT_WEBAPP_URL BELUM DIISI (MODE OFFLINE CHECKSUM FALLBACK)
        if (!GOOGLE_SCRIPT_WEBAPP_URL || GOOGLE_SCRIPT_WEBAPP_URL.includes("PASTE_YOUR_APPS_SCRIPT_URL_HERE")) {
          const verified = verifyLicenseKeyOffline(cleanKey, cleanStoreName);

          if (!verified.valid) {
            setLicenseError(verified.message);
            setIsVerifyingLicense(false);
            return;
          }

          const now = new Date();
          let expiresAt = null;
          if (verified.durationDays < 99999) {
            const expDate = new Date();
            expDate.setDate(expDate.getDate() + verified.durationDays);
            expiresAt = expDate.toISOString();
          }

          const newVaultId = "vault_" + Math.random().toString(36).substring(2, 9);
          const newLicense = {
            key: verified.key,
            ownerName: verified.storeName,
            activatedAt: now.toISOString(),
            expiresAt: expiresAt,
            durationDays: verified.durationDays,
            durationLabel: verified.durationLabel,
            serial: verified.serial,
            vaultId: newVaultId,
            isLifetime: verified.durationDays >= 99999,
            isDemo: false
          };

          const targetPrefix = `pospro_data_lic_${newVaultId}`;
          saveToLocal('pospro_active_license', newLicense);
          setLicenseData(newLicense);
          loadStoreDataFromLocal(targetPrefix, verified.storeName);

          setCurrentUserRole({ name: 'Kasir Toko', role: 'kasir', avatar: 'KS' });
          setActiveTab('pos');
          setLicenseInputKey('');
          setLicenseOwnerName('');
          setShowExtendLicenseModal(false);
          setIsVerifyingLicense(false);
          showToast(`✅ Lisensi Offline Berhasil Diaktifkan untuk "${verified.storeName}"! (${verified.durationLabel})`);
          return;
        }

        // VERIFIKASI LANGSUNG KE BACKEND GOOGLE SHEETS
        try {
          const apiUrl = `${GOOGLE_SCRIPT_WEBAPP_URL}?action=activate&key=${encodeURIComponent(cleanKey)}&storeName=${encodeURIComponent(cleanStoreName)}&token=${encodeURIComponent(APP_SECRET_TOKEN)}`;
          const response = await fetch(apiUrl, { method: 'GET' });
          const result = await response.json();

          if (result.success) {
            const finalStore = result.storeName || cleanStoreName;
            const newLicense = {
              key: cleanKey,
              ownerName: finalStore,
              activatedAt: result.activatedAt,
              expiresAt: result.expiresAt,
              durationDays: result.durationDays,
              durationLabel: result.durationLabel || (result.durationDays >= 9999 ? 'Permanen (Lifetime)' : `${result.durationDays} Hari`),
              serial: cleanKey.replace(/[^A-Z0-9]/g, '').slice(-6),
              vaultId: result.vaultId || `v_${Date.now()}`,
              isLifetime: result.durationDays >= 9999,
              isDemo: false
            };

            const targetPrefix = `pospro_data_lic_${newLicense.vaultId}`;
            saveToLocal('pospro_active_license', newLicense);
            setLicenseData(newLicense);

        const topic = `pospro/store_channel/${syncKey}`;
        let client;

        try {
          client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            keepalive: 60,
            clientId: `pospro_${deviceIdRef.current}_${Math.random().toString(16).substr(2, 6)}`,
            clean: true,
            reconnectPeriod: 2000
          });

          mqttClientRef.current = client;

          client.on('connect', () => {
            client.subscribe(topic, { qos: 1 }, (err) => {
              if (!err) {
                setSyncStatusMsg('Terkoneksi Real-Time PC ⇄ HP');
                client.publish(topic, JSON.stringify({
                  type: 'REQUEST_LATEST_STATE',
                  senderId: deviceIdRef.current,
                  ts: Date.now()
                }));
              }
            });
          });

          client.on('message', (receivedTopic, messageBuffer) => {
            try {
              const payload = JSON.parse(messageBuffer.toString());
              if (!payload || payload.senderId === deviceIdRef.current) return;

              if (payload.type === 'REQUEST_LATEST_STATE') {
                broadcastCurrentState(true);
              } else if (payload.type === 'STORE_STATE_UPDATE') {
                const incomingData = payload.data;
                const incomingTs = payload.ts || 0;
                const localTs = lastLocalUpdateTimestampRef.current || 0;

                if (incomingTs > localTs || (payload.isResponse && incomingTs >= localTs)) {
                  isRemoteUpdatingRef.current = true;
                  lastLocalUpdateTimestampRef.current = incomingTs;
                  saveToLocal(`${userStoragePrefix}_last_ts`, incomingTs);

                  if (incomingData.storeSettings) saveToLocal(`${userStoragePrefix}_settings`, incomingData.storeSettings);
                  if (incomingData.products) saveToLocal(`${userStoragePrefix}_products`, incomingData.products);
                  if (incomingData.transactions) saveToLocal(`${userStoragePrefix}_transactions`, incomingData.transactions);

                  if (incomingData.rolePasswords) saveToLocal(`${userStoragePrefix}_passwords`, incomingData.rolePasswords);

                  if (incomingData.storeSettings) setStoreSettings(incomingData.storeSettings);
                  if (incomingData.products) setProducts(incomingData.products);
                  if (incomingData.transactions) setTransactions(incomingData.transactions);
                  if (incomingData.customers) setCustomers(incomingData.customers);
                  if (incomingData.suppliers) setSuppliers(incomingData.suppliers);
                  if (incomingData.expenses) setExpenses(incomingData.expenses);
                  if (incomingData.draftOrders) setDraftOrders(incomingData.draftOrders);
                  if (incomingData.rolePasswords) setRolePasswords(incomingData.rolePasswords);

                  lastSavedStateRef.current = JSON.stringify(incomingData);

                  setLastSyncTime(new Date());
                  setSyncStatusMsg('Data Terupdate dari Perangkat Lain');
                  showToast('⚡ Data otomatis tersinkron dari perangkat lain!');

                  setTimeout(() => {
                    isRemoteUpdatingRef.current = false;
                  }, 400);
                }
              }
            } catch (e) {
              console.warn("MQTT Parse error:", e);
            }
          });

          client.on('error', () => {
            setSyncStatusMsg('Reconnecting Cloud...');
          });
        } catch (err) {
          console.warn("MQTT Connection error:", err);
        }

        return () => {
          if (client) {
            try { client.end(true); } catch (e) {}
          }
        };

        if (!isResponseToRequest) {

          saveToLocal(`${userStoragePrefix}_last_ts`, currentTs);
        }

        setSyncStatusMsg(isResponseToRequest ? 'Mengirim Data ke Perangkat Lain' : 'Tersinkronisasi Real-Time');

        if (currentUser.role !== 'owner') {

          return;
        }

        let updatedProducts = [...products];
        if (restoreStock && transaction.items) {
          transaction.items.forEach(item => {
            const prodIndex = updatedProducts.findIndex(p => p.id === item.product.id);
            if (prodIndex !== -1) {
              updatedProducts[prodIndex] = {
                ...updatedProducts[prodIndex],
                stock: (updatedProducts[prodIndex].stock || 0) + (Number(item.qty) || 0)
              };
            }
          });
          setProducts(updatedProducts);
        }

        let updatedCustomers = [...customers];
        if (transaction.customerId && transaction.paymentMethod === 'Hutang') {
          const cust = updatedCustomers.find(c => c.id === transaction.customerId);
          if (cust) {
            const unpaidAmount = Math.max(0, transaction.total - (transaction.cash || 0));
            updatedCustomers = updatedCustomers.map(c =>

                ...c, 
                totalTrx: Math.max(0, (c.totalTrx || 1) - 1),

          return false; 
        }
        let success = true;
        setCart(prevCart => {
          const existingItem = prevCart.find(item => item.product.id === product.id);
          if (existingItem) {
            if (existingItem.qty >= product.stock) {
              showToast(`Maksimal stok tercapai untuk ${product.name}!`, 'error');
              success = false;
              return prevCart;
            }
            return prevCart.map(item => item.product.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          } else {
            return [...prevCart, { product, qty: 1, discountRp: '' }];
          }
        });
        return success;

          const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
          const isTypingInSpecialInput = activeTag === 'textarea' || (activeTag === 'input' && document.activeElement.type === 'number');
          if (isTypingInSpecialInput) return;

          const now = Date.now();
          const timeDiff = now - lastKeyTimeRef.current;

          if (timeDiff > 80 && e.key !== 'Enter') barcodeBufferRef.current = '';

          if (e.key === 'Enter') {
            const rawCode = barcodeBufferRef.current.trim() || searchQuery.trim();

              const cleanCode = rawCode.toUpperCase();
              const matchedProduct = products.find(p => (p.sku && p.sku.toUpperCase() === cleanCode) || p.id === cleanCode);
              
              if (activeTab === 'pos') {

              }));
              showToast(`+1 ${matchedProduct.name} (Total: ${nextQty}x)`);
            } else {
              setScannerModal(prev => ({
                ...prev,
                lastScanned: cleanCode,
                feedback: {
                  type: 'warning',
                  title: '⚠️ MAKSIMAL STOK / HABIS',
                  desc: `Stok ${matchedProduct.name} tidak mencukupi untuk ditambah lagi.`,
                  code: cleanCode,
                  scanCount: currentQty,
                  countLabel: 'Jumlah Maksimal'
                }
              }));
            }
            if (!scannerModal.continuousMode) closeScannerModal();
          } else {
            setScannerModal(prev => ({
              ...prev,
              lastScanned: cleanCode,
              feedback: {
                type: 'error',
                title: '⚠️ BARANG BELUM TERDAFTAR!',
                desc: `Kode barcode ${cleanCode} belum dimasukkan ke data barang toko.`,
                code: cleanCode,
                action: 'create_product'
              }
            }));
            showToast(`⚠️ Barang belum terdaftar! (${cleanCode})`, 'error');
          }
        }
      }, [scannerModal.target, scannerModal.continuousMode, products, editingProduct, addToCart, closeScannerModal, cart]);

      const startLiveCamera = async () => {
        setScannerModal(prev => ({ ...prev, isLoadingCamera: true, errorMsg: '' }));

        try {
          if (typeof window.Html5Qrcode === 'undefined') throw new Error("Pustaka pemindai belum siap.");

          if (scannerInstanceRef.current) {
            try { await scannerInstanceRef.current.stop(); } catch(e){}
            scannerInstanceRef.current = null;
          }

          const readerElem = document.getElementById('scanner-reader');
          if (!readerElem) throw new Error("Elemen pemindai belum siap");

          const html5QrCode = new window.Html5Qrcode('scanner-reader', { verbose: false });
          scannerInstanceRef.current = html5QrCode;

          const formats = (window.Html5QrcodeSupportedFormats) ? [
            window.Html5QrcodeSupportedFormats.QR_CODE,
            window.Html5QrcodeSupportedFormats.EAN_13,
            window.Html5QrcodeSupportedFormats.EAN_8,
            window.Html5QrcodeSupportedFormats.CODE_128,
            window.Html5QrcodeSupportedFormats.CODE_39,
            window.Html5QrcodeSupportedFormats.UPC_A,
            window.Html5QrcodeSupportedFormats.UPC_E
          ] : undefined;

          const config = {
            fps: 20,
            qrbox: (viewfinderWidth, viewfinderHeight) => {
              const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
              return { width: Math.floor(minEdge * 0.78), height: Math.floor(minEdge * 0.58) };
            },
            aspectRatio: 1.0,
            videoConstraints: { facingMode: { ideal: "environment" } },
            ...(formats ? { formatsToSupport: formats } : {})
          };

          const videoPatcher = setInterval(() => {
            const vid = document.querySelector('#scanner-reader video');
            if (vid) {
              vid.setAttribute('playsinline', 'true');
              vid.setAttribute('webkit-playsinline', 'true');
              vid.muted = true;
              if (vid.paused) vid.play().catch(() => {});
            }
          }, 200);

          try {
            await html5QrCode.start({ facingMode: "environment" }, config, (text) => handleScannedBarcode(text), () => {});
          } catch (firstErr) {
            const cameras = await window.Html5Qrcode.getCameras();
            if (cameras && cameras.length > 0) {
              const rearCam = cameras.find(c => /back|rear|environment|belakang/i.test(c.label)) || cameras[cameras.length - 1];
              await html5QrCode.start(rearCam.id, config, (text) => handleScannedBarcode(text), () => {});
            } else {
              throw new Error("Kamera tidak ditemukan");
            }
          }

          setTimeout(() => clearInterval(videoPatcher), 3000);
          setScannerModal(prev => ({ ...prev, isLoadingCamera: false, errorMsg: '' }));
        } catch (err) {
          setScannerModal(prev => ({ 
            ...prev, 
            isLoadingCamera: false,
            errorMsg: 'Izin kamera dibatasi browser. Silakan izinkan kamera di browser HP Anda.' 
          }));
        }
      };

      const openScanner = (target = 'pos') => {
        setScannerModal({
          isOpen: true,
          target,
          continuousMode: target === 'pos' || target === 'inventory_restock',
          lastScanned: null,
          errorMsg: '',
          isLoadingCamera: true,
          feedback: null
        });
        setTimeout(() => startLiveCamera(), 100);
      };

      const handleCheckout = () => {
        if (cart.length === 0) return;
        
        let finalCash = cashReceived ? parseInt(cashReceived) : 0;
        if (paymentMethod === 'Cash' && finalCash < grandTotal) { showToast('Uang tunai kurang!', 'error'); return; }
        if (paymentMethod !== 'Cash' && paymentMethod !== 'Hutang') finalCash = grandTotal;
        
        const changeAmount = paymentMethod === 'Cash' ? Math.max(0, finalCash - grandTotal) : 0;

        const selectedCust = customers.find(c => c.id === selectedCustomerPOS);

        const newTransaction = {
          id: `${storeSettings.invoicePrefix || 'INV-'}${Math.floor(100000 + Math.random() * 900000)}`,
          date: new Date().toLocaleString('id-ID'),
          items: cart, subtotal, discount, tax: taxAmount, total: grandTotal, cash: finalCash, change: changeAmount, paymentMethod, note: transactionNote,
          customerId: selectedCust ? selectedCust.id : null, customerName: selectedCust ? selectedCust.name : 'Umum', cashier: currentUserRole.name
        };

        const updatedProducts = products.map(p => {
          const cartItem = cart.find(c => c.product.id === p.id);
          if (cartItem) return { ...p, stock: p.stock - cartItem.qty };
          return p;
        });

        let updatedCustomers = [...customers];
        if (selectedCust) {
          const addedDebt = (paymentMethod === 'Hutang' && grandTotal > finalCash) ? (grandTotal - finalCash) : 0;
          updatedCustomers = customers.map(c => c.id === selectedCust.id ? { ...c, totalTrx: (c.totalTrx || 0) + 1, totalSpent: (c.totalSpent || 0) + grandTotal, debt: (c.debt || 0) + addedDebt } : c);
        }

        const newTrxList = [newTransaction, ...transactions];
        setTransactions(newTrxList);
        setProducts(updatedProducts);
        setCustomers(updatedCustomers);
        setCart([]);
        setDiscount(storeSettings.defaultDiscount || 0);
        setCashReceived('');
        setTransactionNote('');
        setPaymentMethod('Cash');
        setSelectedCustomerPOS('');
        setShowMobileCartDrawer(false);
        showToast('Transaksi Berhasil Disimpan!');
        setViewingTransaction(newTransaction);
      };

      const saveDraft = () => {
        if (cart.length === 0) return;
        if (!draftNameInput.trim()) { showToast('Nama pelanggan/meja wajib diisi', 'error'); return; }
        setDraftOrders([...draftOrders, { id: generateId(), name: draftNameInput, cart, discount, date: new Date().toLocaleString('id-ID') }]);
        setCart([]); setDiscount(storeSettings.defaultDiscount || 0); setDraftNameInput(''); setShowDraftSaveModal(false); showToast(`Pesanan ${draftNameInput} berhasil ditahan`);
      };

      const loadDraft = (draft) => {
        setCart(draft.cart); setDiscount(draft.discount || 0); setDraftOrders(draftOrders.filter(d => d.id !== draft.id)); setShowDraftListModal(false); showToast(`Pesanan ${draft.name} dilanjutkan`);
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (isSaving) return;
        setIsSaving(true);

        const finalSku = productForm.sku.trim() === '' ? `BRG-${Math.floor(1000 + Math.random() * 9000)}` : productForm.sku.toUpperCase();
        const formattedData = { ...productForm, sku: finalSku, costPrice: Number(productForm.costPrice) || 0, price: Number(productForm.price) || 0, packPrice: Number(productForm.packPrice) || 0, stock: Number(productForm.stock) || 0 };

        let updatedProducts;
        if (editingProduct) { 
          updatedProducts = products.map(p => p.id === editingProduct.id ? { ...p, ...formattedData } : p);
          setProducts(updatedProducts);
          showToast('Produk diperbarui');
        } else {
          if (products.some(p => p.sku === finalSku)) { showToast('⚠️ Barang sudah ada!', 'error'); setIsSaving(false); return; }
          const newProduct = { ...formattedData, id: generateId() };
          updatedProducts = [...products, newProduct];
          setProducts(updatedProducts);
          showToast('Produk ditambahkan');
        }
        setIsProductModalOpen(false);
        setIsSaving(false);
      };

      const handleDeleteProduct = (id) => { 
        setProducts(products.filter(p => p.id !== id));
        showToast('Produk dihapus');
      };

      const handleSaveRestock = (e) => {
        e.preventDefault();
        if (!restockForm.supplier) { showToast('Nama supplier wajib diisi!', 'error'); return; }
        
        let hasValidItems = false; const updatedProducts = [...products];
        restockForm.items.forEach(item => {
          if (item.productId && item.qty > 0) {
            hasValidItems = true; const productIndex = updatedProducts.findIndex(p => p.id === item.productId);
            if (productIndex !== -1) updatedProducts[productIndex].stock += Number(item.qty);
          }
        });
        if (!hasValidItems) { showToast('Pilih minimal 1 produk', 'error'); return; }

        const totalBill = Number(restockForm.totalBill) || 0; const paidAmount = Number(restockForm.paidAmount) || 0;
        const unpaidDebt = restockForm.paymentStatus === 'Hutang' ? Math.max(0, totalBill - paidAmount) : 0;
        const targetSupplierName = restockForm.supplier; let supplierFound = false;
        
        const updatedSuppliers = suppliers.map(s => {
          if (s.name.toLowerCase() === targetSupplierName.toLowerCase()) { supplierFound = true; return { ...s, totalPurchases: (s.totalPurchases||0) + totalBill, debt: (s.debt||0) + unpaidDebt }; } return s;
        });

        if (!supplierFound) updatedSuppliers.push({ id: `SUP-${Math.floor(1000 + Math.random() * 9000)}`, name: targetSupplierName, contactPerson: '-', phone: '-', address: '-', totalPurchases: totalBill, debt: unpaidDebt });
        
        setSuppliers(updatedSuppliers); setProducts(updatedProducts); setShowRestockModal(false); 
        showToast(unpaidDebt > 0 ? `Stok masuk tersimpan. Hutang dicatat.` : 'Stok masuk berhasil disimpan!');
      };

      const handleSaveStockOut = (e) => {
        e.preventDefault();
        let hasValidItems = false, hasError = false; const updatedProducts = [...products];
        for (let i = 0; i < stockOutForm.items.length; i++) {
          const item = stockOutForm.items[i];
          if (item.productId && item.qty > 0) {
            hasValidItems = true; const productIndex = updatedProducts.findIndex(p => p.id === item.productId);
            if (productIndex !== -1) {
              if (Number(item.qty) > updatedProducts[productIndex].stock) { showToast(`Stok ${updatedProducts[productIndex].name} tidak cukup!`, 'error'); hasError = true; break; }
              updatedProducts[productIndex].stock -= Number(item.qty);
            }
          }
        }
        if (hasError) return;
        if (!hasValidItems) { showToast('Pilih minimal 1 produk', 'error'); return; }
        
        setProducts(updatedProducts); setShowStockOutModal(false); showToast(`Stok berhasil dikeluarkan`);
      };

      const handleSaveCustomer = (e) => { 
        e.preventDefault(); 
        if (editingCustomer) { 
          setCustomers(customers.map(c => c.id === editingCustomer.id ? { ...c, ...customerForm } : c));
          showToast('Pelanggan diperbarui');
        } else { 
          const newCustomer = { ...customerForm, id: `CUST-${Math.floor(1000 + Math.random() * 9000)}`, totalTrx: 0, totalSpent: 0, debt: 0 };
          setCustomers([...customers, newCustomer]);
          showToast('Pelanggan ditambahkan');
        } 
        setIsCustomerModalOpen(false);
      };
      
      const handleDeleteCustomer = (id) => { 
        setCustomers(customers.filter(c => c.id !== id));
        if (selectedCustomerPOS === id) setSelectedCustomerPOS('');
        showToast('Pelanggan dihapus');
      };
      
      const handleSaveSupplier = (e) => { 
        e.preventDefault(); 
        if (editingSupplier) { 
          setSuppliers(suppliers.map(s => s.id === editingSupplier.id ? { ...s, ...supplierForm } : s));
          showToast('Supplier diperbarui');
        } else { 
          const newSupp = { ...supplierForm, id: `SUP-${Math.floor(1000 + Math.random() * 9000)}`, totalPurchases: 0, debt: 0 };
          setSuppliers([...suppliers, newSupp]);
          showToast('Supplier ditambahkan');
        } 
        setIsSupplierModalOpen(false);
      };

      const handleDeleteSupplier = (id) => { 
        setSuppliers(suppliers.filter(s => s.id !== id));
        showToast('Supplier dihapus');
      };

      const handleSaveExpense = (e) => { 
        e.preventDefault(); 
        const amountVal = Number(expenseForm.amount) || 0; 
        if (amountVal <= 0) { showToast('Masukkan nominal valid', 'error'); return; }
        const dateParts = expenseForm.date.split('-'); 
        const formattedDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;
        const newExp = { id: `EXP-${Math.floor(1000 + Math.random() * 9000)}`, date: formattedDate, category: expenseForm.category, amount: amountVal, note: expenseForm.note || '-' };
        setExpenses([newExp, ...expenses]);
        setIsExpenseModalOpen(false);
        setExpenseForm({ category: 'Listrik', amount: '', date: new Date().toISOString().split('T')[0], note: '' });
        showToast('Pengeluaran dicatat');
      };

      const handleDeleteExpense = (id) => { 
        setExpenses(expenses.filter(e => e.id !== id));
        showToast('Pengeluaran dihapus');
      };

      const handlePayCustomerDebt = (e) => { 
        e.preventDefault(); 
        const payAmount = Number(customerPayAmount) || 0; 
        if (payAmount <= 0) { showToast('Masukkan nominal valid', 'error'); return; } 
        if (payAmount > (paymentModalCustomer.debt || 0)) { showToast('Melebihi piutang!', 'error'); return; } 
        setCustomers(customers.map(c => c.id === paymentModalCustomer.id ? { ...c, debt: (c.debt || 0) - payAmount } : c));
        showToast('Pelunasan piutang dicatat.');
        setPaymentModalCustomer(null);
        setCustomerPayAmount('');
      };
      
      const handlePaySupplierDebt = (e) => { 
        e.preventDefault(); 
        const payAmount = Number(supplierPayAmount) || 0; 
        if (payAmount <= 0) { showToast('Masukkan nominal valid', 'error'); return; } 
        if (payAmount > (paymentModalSupplier.debt || 0)) { showToast('Melebihi hutang!', 'error'); return; } 
        setSuppliers(suppliers.map(s => s.id === paymentModalSupplier.id ? { ...s, debt: (s.debt || 0) - payAmount } : s));
        showToast('Pelunasan hutang dicatat.');
        setPaymentModalSupplier(null);
        setSupplierPayAmount('');
      };

      const handleRoleSwitchRequest = (roleObj) => {
        if (roleObj.role === 'owner' || roleObj.role === 'admin') {
          setAuthModal({ show: true, targetRole: roleObj, password: '' });
        } else {
          setCurrentUserRole(roleObj);
          setShowRoleSwitcher(false);
          showToast(`Beralih ke peran ${roleObj.name}`);
        }
      };

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const target = authModal.targetRole;
        if (!target) return;
        const requiredPass = rolePasswords[target.role] || (target.role === 'owner' ? 'owner123' : 'admin123');
        if (authModal.password === requiredPass) {
          setCurrentUserRole(target);
          setAuthModal({ show: false, targetRole: null, password: '' });
          setShowRoleSwitcher(false);
          showToast(`Berhasil masuk sebagai ${target.name}`);
        } else {
          showToast('Password salah!', 'error');
        }
      };

      const handleBackupDatabase = () => {
        if (isDemoUser) {
          showToast('Fitur unduh cadangan JSON dinonaktifkan pada Mode Demo!', 'error');
          return;
        }
        const backupData = {
          license: licenseData,
          storeSettings,
          products,
          transactions,
          draftOrders,
          customers,
          suppliers,
          expenses,
          rolePasswords,
          exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_pospro_${(licenseData?.ownerName || 'store').toLowerCase().replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Cadangan data berhasil diunduh!');
      };

      const handleRestoreDatabase = (e) => {
        if (isDemoUser) {
          showToast('Fitur pemulihan data dinonaktifkan pada Mode Demo!', 'error');
          return;
        }
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.products) setProducts(data.products);
            if (data.transactions) setTransactions(data.transactions);
            if (data.customers) setCustomers(data.customers);
            if (data.suppliers) setSuppliers(data.suppliers);
            if (data.expenses) setExpenses(data.expenses);
            if (data.storeSettings) setStoreSettings(data.storeSettings);
            if (data.rolePasswords) setRolePasswords(data.rolePasswords);
            showToast('Data berhasil dipulihkan dari file backup!');
          } catch (err) {
            showToast('Gagal memulihkan data: Format file tidak valid', 'error');
          }
        };
        reader.readAsText(file);
      };

      const addRowDynamicList = (state, setState) => {
        setState({ ...state, items: [...state.items, { productId: '', qty: '' }] });
      };

      const updateDynamicList = (state, setState, index, field, value) => {
        const items = [...state.items];
        items[index][field] = value;
        setState({ ...state, items });
      };

      const categories = useMemo(() => ['Semua', ...new Set(products.map(p => p.category || 'Umum'))], [products]);
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCat = selectedCategory === 'Semua' || p.category === selectedCategory;
          const matchSearch = (p.name || '').toLowerCase().includes(searchQuery.toLowerCase()) || 
                              (p.sku || '').toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      if (!licenseStatus.isActivated || licenseStatus.isExpired) {
        return (
          <div className="min-h-screen bg-[#0f1228] text-slate-100 flex flex-col items-center justify-center p-4 sm:p-6 select-none font-sans relative overflow-hidden">
            <div className="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-cyan-600/15 rounded-full blur-3xl pointer-events-none"></div>

            <div className="bg-[#181b3b] border border-[#2a2f60] rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl space-y-5 text-center relative z-10 animate-in fade-in zoom-in duration-300">
              <div className="space-y-2">
                <div className="w-14 h-14 bg-gradient-to-tr from-indigo-600 via-purple-600 to-[#00d2d3] rounded-2xl flex items-center justify-center mx-auto text-white shadow-lg mb-2">
                  <Icon name="shield-check" className="w-7 h-7 text-white" />
                </div>
                <h1 className="text-xl sm:text-2xl font-black tracking-tight text-white">Masuk / Aktivasi Lisensi POSPro</h1>
                <p className="text-xs text-slate-400">
                  {licenseStatus.isExpired 
                    ? 'Masa aktif lisensi aplikasi Anda telah berakhir. Masukkan lisensi baru untuk memperpanjang.' 
                    : 'Masukkan Nama Toko dan Kode Lisensi untuk aktivasi baru atau login kembali ke akun toko Anda.'}
                </p>
              </div>

              {licenseError && (
                <div className="p-3 bg-rose-500/20 border border-rose-500/40 rounded-2xl text-xs text-rose-300 font-bold flex items-center gap-2 text-left animate-in fade-in">
                  <Icon name="alert-circle" className="w-4 h-4 shrink-0 text-rose-400" />
                  <span>{licenseError}</span>
                </div>
              )}

              <form onSubmit={handleActivateLicense} className="space-y-3.5 text-left text-xs">
                <div>
                  <label className="text-slate-300 font-bold mb-1.5 block flex items-center gap-1.5">
                    <Icon name="store" className="w-3.5 h-3.5 text-[#00d2d3]" />
                    <span>Nama Toko / Pemilik:</span>
                  </label>
                  <input 
                    type="text" 
                    required 
                    placeholder="Contoh: Toko Kamera" 
                    value={licenseOwnerName} 
                    onChange={(e) => setLicenseOwnerName(e.target.value)} 
                    className="w-full p-3 bg-[#0f1228] border border-[#2a2f60] rounded-xl text-white outline-none focus:border-[#00d2d3] font-medium"
                  />
                  <p className="text-[10px] text-slate-400 mt-1">
                    *Harus sama persis dengan nama toko yang didaftarkan.
                  </p>
                </div>

                <div>
                  <label className="text-slate-300 font-bold mb-1.5 block flex items-center gap-1.5">
                    <Icon name="shield-check" className="w-3.5 h-3.5 text-[#00d2d3]" />
                    <span>Kode Lisensi Key:</span>
                  </label>
                  <input 
                    type="text" 
                    required 
                    placeholder="POS-1D-XXXXX-YYYY" 
                    value={licenseInputKey} 
                    onChange={(e) => setLicenseInputKey(e.target.value.toUpperCase())} 
                    className="w-full p-3.5 bg-[#0f1228] border border-[#2a2f60] rounded-xl text-[#00d2d3] outline-none focus:border-[#00d2d3] font-mono font-bold text-center tracking-wider text-sm sm:text-base"
                  />
                  <p className="text-[10px] text-slate-400 mt-1">
                    Gunakan kode lisensi aktif toko Anda untuk login kembali.
                  </p>
                </div>

                <button
                  type="submit"
                  disabled={isVerifyingLicense}
                  className="w-full py-3.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-700 hover:brightness-110 disabled:opacity-50 text-white rounded-2xl font-black text-xs sm:text-sm shadow-xl active:scale-98 transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                  {isVerifyingLicense ? (
                    <>
                      <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                      <span>Memverifikasi Akun ke Server...</span>
                    </>
                  ) : (
                    <>
                      <Icon name="log-in" className="w-4 h-4" />
                      <span>Masuk / Aktivasi Akun Kasir</span>
                    </>
                  )}
                </button>
              </form>

              <div className="pt-2 border-t border-[#2a2f60] flex items-center justify-center">
                <button
                  onClick={handleDemoLicenseActivate}
                  className="w-full py-2.5 px-3 bg-[#21254d] hover:bg-[#2a2f60] text-slate-300 hover:text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 border border-[#2a2f60] transition-all cursor-pointer"
                >
                  <Icon name="sparkles" className="w-3.5 h-3.5 text-amber-400" />
                  <span>Coba Gratis (Mode Demo Tanpa Lisensi)</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      const renderDashboard = () => {
        const totalNilaiPenjualan = transactions.reduce((sum, t) => sum + (t.subtotal || t.total || 0), 0);
        const totalNilaiAkhir = transactions.reduce((sum, t) => sum + (t.total || 0), 0);
        
        let totalHPP = 0;
        transactions.forEach(t => {
          (t.items || []).forEach(item => {
            if (item.product) {
              const prod = products.find(p => p.id === item.product.id);
              const cost = prod ? prod.costPrice : (item.product.costPrice || 0);
              totalHPP += cost * item.qty;
            }
          });
        });

        const totalPengeluaran = expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
        const totalProfit = (totalNilaiAkhir - totalHPP) - totalPengeluaran;

        const categoryStats = [
          { name: 'Jenis 1 (Minuman)', cat: 'Minuman', color: '#ff4b8b' },
          { name: 'Jenis 2 (Makanan)', cat: 'Makanan', color: '#00d2d3' },
          { name: 'Jenis 3 (Snack/Umum)', cat: 'Snack', color: '#ff8a3d' }
        ].map((c) => {
          const prodsInCat = products.filter(p => p.category && p.category.toLowerCase().includes(c.cat.toLowerCase()));
          const stock = prodsInCat.reduce((sum, p) => sum + (p.stock || 0), 0);
          
          let sold = 0;
          let sales = 0;
          transactions.forEach(t => {
            (t.items || []).forEach(i => {
              if (i.product && prodsInCat.some(p => p.id === i.product.id)) {
                sold += i.qty;
                sales += ((i.product.price - (Number(i.discountRp) || 0)) * i.qty);
              }
            });
          });

          const total = stock + sold;
          const percentage = total > 0 ? Math.round((sold / total) * 100) : 50;

          return {
            title: c.name,
            stock,
            sold,
            total,
            sales,
            percentage,
            color: c.color
          };
        });

        const productStats = products.slice(0, 10).map((p, idx) => {
          let sold = 0;
          transactions.forEach(t => {
            (t.items || []).forEach(i => {
              if (i.product && i.product.id === p.id) {
                sold += i.qty;
              }
            });
          });
          const initial = p.stock + sold;
          const remaining = p.stock;
          const soldPercentage = initial > 0 ? Math.round((sold / initial) * 100) : 0;
          const labelLaku = soldPercentage >= 70 ? 'Barang Sangat Laku' : soldPercentage >= 40 ? 'Barang Laku' : 'Barang Kurang Laku';

          return {
            name: `Barang ${idx + 1}`,
            fullName: p.name,
            initial,
            sold,
            remaining,
            soldPercentage,
            labelLaku
          };
        });

        const maxBarVal = Math.max(...productStats.map(ps => Math.max(ps.initial, ps.sold, ps.remaining, 10)), 50);

        return (
          <div className="p-3 sm:p-6 pb-28 lg:pb-8 space-y-4 max-w-7xl mx-auto">
            {/* Indikator Status Cloud Sync & Lisensi */}
            <div className={`p-3.5 rounded-2xl border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2.5 text-xs ${
              theme === 'dark' ? 'bg-[#181b3b]/90 border-[#2a2f60]' : 'bg-white border-slate-200 shadow-sm'
            }`}>
              <div className="flex items-center gap-2.5">
                <span className={`w-3 h-3 rounded-full shrink-0 ${isCloudSyncing ? 'bg-amber-400 animate-spin' : 'bg-emerald-400 animate-pulse'}`}></span>
                <div>
                  <p className="font-extrabold text-xs flex items-center gap-1.5 flex-wrap">
                    <Icon name="zap" className="w-3.5 h-3.5 text-[#00d2d3]" />
                    <span>{isCloudSyncing ? 'Menyinkronkan data...' : 'Real-Time Sync Aktif (PC ⇄ HP)'}</span>
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.2 rounded font-mono">Live Key Sync</span>
                    <span className="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-1.5 py-0.2 rounded font-bold">
                      🛡️ Lisensi: {licenseStatus.label}
                    </span>
                  </p>
                  <p className="text-[10px] text-slate-400 mt-0.5">
                    Toko: <span className="text-cyan-400 font-bold">{licenseData?.ownerName || storeSettings.name}</span> • Status: <span className="text-emerald-400 font-bold">{syncStatusMsg}</span> ({lastSyncTime ? lastSyncTime.toLocaleTimeString('id-ID') : 'Baru saja'})
                  </p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => {
                    broadcastCurrentState(true);
                    showToast('⚡ Mengirim sinyal sinkronisasi ke seluruh perangkat!');
                  }}
                  className="px-3 py-1.5 bg-[#21254d] hover:bg-indigo-600 text-slate-200 hover:text-white rounded-xl text-xs font-bold flex items-center gap-1.5 border border-[#2a2f60] transition-all cursor-pointer shrink-0"
                >
                  <Icon name="refresh-cw" className="w-3.5 h-3.5" />
                  <span>Sinkron Sekarang</span>
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
              <div className="lg:col-span-7 grid grid-cols-1 sm:grid-cols-3 gap-3">
                {categoryStats.map((cat, idx) => {
                  const strokeDashoffset = 283 - (283 * cat.percentage) / 100;
                  return (
                    <div 
                      key={idx} 
                      className={`p-4 rounded-3xl border flex flex-col items-center justify-between text-center transition-all ${
                        theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-lg' : 'bg-white border-slate-200 shadow-sm'
                      }`}
                    >
                      <div className="flex items-center gap-1.5 self-start">
                        <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: cat.color }}></span>
                        <span className={`text-[11px] font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-300' : 'text-slate-700'}`}>
                          {cat.title}
                        </span>
                      </div>

                      <div className="relative w-28 h-28 my-3 flex items-center justify-center">
                        <svg className="w-full h-full -rotate-90" viewBox="0 0 112 112">
                          <circle
                            cx="56"
                            cy="56"
                            r="45"
                            stroke={theme === 'dark' ? '#21254d' : '#e2e8f0'}
                            strokeWidth="12"
                            fill="transparent"
                          />
                          <circle
                            cx="56"
                            cy="56"
                            r="45"
                            stroke={cat.color}
                            strokeWidth="12"
                            strokeDasharray="283"
                            strokeDashoffset={strokeDashoffset}
                            strokeLinecap="round"
                            fill="transparent"
                            style={{ transition: 'strokeDashoffset 0.8s ease' }}
                          />
                        </svg>
                        
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                          <span className={`text-xl font-black ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>
                            {cat.percentage}%
                          </span>
                        </div>

                        <span className="absolute -top-1 left-2 text-[9px] font-bold text-slate-400">{cat.stock}</span>
                        <span className="absolute -bottom-1 left-2 text-[9px] font-bold text-slate-400">{cat.sold}</span>
                        <span className="absolute top-1/2 -right-1 -translate-y-1/2 text-[9px] font-bold text-slate-400">{cat.total}</span>
                      </div>

                      <div className="w-full mt-1">
                        <div className="w-full py-1.5 px-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-black text-xs shadow-md">
                          {formatMoney(cat.sales)}
                        </div>
                        <p className={`text-[10px] font-bold mt-1.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                          Barang Laku
                        </p>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="lg:col-span-5 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${
                  theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-lg' : 'bg-white border-slate-200 shadow-sm'
                }`}>
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-pink-500/20 text-[#ff4b8b] flex items-center justify-center border border-pink-500/30">
                      <Icon name="banknote" className="w-4 h-4"/>
                    </div>
                    <span className={`text-[11px] font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Nilai Penjualan
                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-[#ff4b8b] tracking-tight truncate">
                      {formatMoney(totalNilaiPenjualan)}
                    </h3>
                    <p className={`text-[10px] mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Total Nilai Penjualan
                    </p>
                  </div>
                </div>

                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${
                  theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-lg' : 'bg-white border-slate-200 shadow-sm'
                }`}>
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-cyan-500/20 text-[#00d2d3] flex items-center justify-center border border-cyan-500/30">
                      <Icon name="wallet" className="w-4 h-4"/>
                    </div>
                    <span className={`text-[11px] font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Akhir Penjualan
                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-[#00d2d3] tracking-tight truncate">
                      {formatMoney(totalNilaiAkhir)}
                    </h3>
                    <p className={`text-[10px] mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Total Nilai Akhir Penjualan
                    </p>
                  </div>
                </div>

                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${
                  theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-lg' : 'bg-white border-slate-200 shadow-sm'
                }`}>
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-[#ff8a3d] flex items-center justify-center border border-amber-500/30">
                      <Icon name="package-minus" className="w-4 h-4"/>
                    </div>
                    <span className={`text-[11px] font-bold uppercase tracking-wider ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Modal Pokok (HPP)
                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-[#ff8a3d] tracking-tight truncate">
                      {formatMoney(totalHPP)}
                    </h3>
                    <p className={`text-[10px] mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      Total Harga Pokok Penjualan
                    </p>
                  </div>
                </div>

                <div className={`p-4 rounded-3xl border flex flex-col justify-between transition-all ${
                  theme === 'dark' ? 'bg-gradient-to-br from-[#1e1b4b] to-[#181b3b] border-indigo-500/40 text-white shadow-lg' : 'bg-indigo-50 border-indigo-200'
                }`}>
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center border border-indigo-500/30">
                      <Icon name="trending-up" className="w-4 h-4"/>
                    </div>
                    <span className="text-[11px] font-bold uppercase tracking-wider text-indigo-400">
                      Profit Bersih
                    </span>
                  </div>
                  <div className="mt-3">
                    <h3 className="text-lg sm:text-xl font-black text-emerald-400 tracking-tight truncate">
                      {formatMoney(totalProfit)}
                    </h3>
                    <p className={`text-[10px] mt-0.5 ${theme === 'dark' ? 'text-indigo-200' : 'text-indigo-600'}`}>
                      Total Nilai Profit
                    </p>
                  </div>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
              <div className={`lg:col-span-7 p-4 sm:p-6 rounded-3xl border flex flex-col justify-between transition-all ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-xl' : 'bg-white border-slate-200 shadow-sm text-slate-800'
              }`}>
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
                  <div className="flex items-center gap-2">
                    <Icon name="bar-chart-3" className="w-5 h-5 text-[#00d2d3]" />
                    <h3 className="font-extrabold text-sm sm:text-base tracking-tight">Grafik Persediaan Barang</h3>
                  </div>

                  <div className="flex items-center gap-3 text-[10px] font-bold">
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#00d2d3]"></span> Jumlah Awal</span>
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#ff8a3d]"></span> Terjual</span>
                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#ff4b8b]"></span> Sisa Akhir</span>
                  </div>
                </div>

                <div className="h-60 sm:h-72 flex items-end gap-2 sm:gap-4 pt-4 border-b border-slate-700/50 pb-2 overflow-x-auto no-scrollbar">
                  {productStats.map((item, idx) => {
                    const hInitial = (item.initial / maxBarVal) * 100;
                    const hSold = (item.sold / maxBarVal) * 100;
                    const hRemaining = (item.remaining / maxBarVal) * 100;

                    return (
                      <div key={idx} className="flex-1 min-w-[50px] flex flex-col items-center h-full justify-end group">
                        <div className="flex items-end justify-center gap-1 w-full h-[82%]">
                          <div className="w-2.5 sm:w-3.5 bg-[#00d2d3] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hInitial}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#00d2d3] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.initial}
                            </span>
                          </div>
                          <div className="w-2.5 sm:w-3.5 bg-[#ff8a3d] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hSold}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#ff8a3d] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.sold}
                            </span>
                          </div>
                          <div className="w-2.5 sm:w-3.5 bg-[#ff4b8b] rounded-t-md relative flex justify-center group-hover:brightness-110 transition-all" style={{ height: `${hRemaining}%`, minHeight: '4px' }}>
                            <span className="opacity-0 group-hover:opacity-100 absolute -top-5 text-[9px] font-bold text-[#ff4b8b] bg-[#0f1228] px-1 rounded transition-opacity">
                              {item.remaining}
                            </span>
                          </div>
                        </div>

                        <p className={`mt-2 text-[10px] font-bold truncate max-w-[55px] text-center ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>
                          {item.name}
                        </p>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className={`lg:col-span-5 p-4 sm:p-6 rounded-3xl border flex flex-col justify-between transition-all ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white shadow-xl' : 'bg-white border-slate-200 shadow-sm text-slate-800'
              }`}>
                <div className="flex items-center gap-2 mb-4">
                  <Icon name="activity" className="w-5 h-5 text-[#00d2d3]" />
                  <h3 className="font-extrabold text-sm sm:text-base tracking-tight">Grafik Barang Laku</h3>
                </div>

                <div className="space-y-3 flex-1 flex flex-col justify-center">
                  {productStats.slice(0, 6).map((item, idx) => (
                    <div key={idx} className="space-y-1">
                      <div className="flex justify-between items-center text-xs">
                        <span className={`font-bold truncate max-w-[140px] ${theme === 'dark' ? 'text-slate-300' : 'text-slate-700'}`}>
                          {item.fullName}
                        </span>
                        <span className="text-[10px] font-bold text-[#00d2d3]">
                          {item.labelLaku} ; {item.soldPercentage}%
                        </span>
                      </div>
                      <div className={`w-full h-3 rounded-full overflow-hidden ${theme === 'dark' ? 'bg-[#21254d]' : 'bg-slate-100'}`}>
                        <div 
                          className="h-full bg-gradient-to-r from-[#00d2d3] to-[#6366f1] rounded-full transition-all duration-700" 
                          style={{ width: `${item.soldPercentage}%` }}
                        ></div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex justify-between text-[9px] font-bold text-slate-400 pt-3 border-t border-slate-700/40 mt-3">
                  <span>0%</span>
                  <span>20%</span>
                  <span>40%</span>
                  <span>60%</span>
                  <span>80%</span>
                  <span>100%</span>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderCartContent = () => {
        const isPaymentExact = paymentMethod !== 'Cash' && paymentMethod !== 'Hutang';
        const isReadyToPay = cart.length > 0 && (isPaymentExact || (paymentMethod === 'Cash' && cashReceived && parseInt(cashReceived) >= grandTotal) || (paymentMethod === 'Hutang')); 

        return (
          <div className={`flex flex-col h-full ${theme === 'dark' ? 'bg-[#181b3b] text-white' : 'bg-white text-slate-800'}`}>
            <div className={`p-4 border-b flex flex-col gap-2.5 shrink-0 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
              <div className="flex justify-between items-center">
                <h2 className="font-extrabold flex items-center gap-2 text-sm sm:text-base">
                  <Icon name="shopping-bag" className="w-5 h-5 text-[#00d2d3]" /> Rincian Pesanan
                </h2>
                <div className="flex items-center gap-2">
                  {cart.length > 0 && (
                    <button 
                      onClick={() => {
                        setCart([]);
                        setDiscount(storeSettings.defaultDiscount || 0);
                        setCashReceived('');
                        showToast('Semua daftar pesanan berhasil dihapus.');
                      }}
                      className="px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-full text-xs font-bold flex items-center gap-1 transition-all cursor-pointer shadow-sm"
                      title="Hapus Semua Barang dari Keranjang"
                    >
                      <Icon name="trash-2" className="w-3 h-3 text-rose-400" />

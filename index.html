<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POSPro - Sistem Kasir & Manajemen UMKM</title>
  
  <!-- CDN Pustaka Inti -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Pustaka Barcode & QR Code Scanner Multi-Format -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-sizing: border-box;
    }
    
    body { 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background-color: #f8fafc; 
      margin: 0; 
      padding: 0;
      overscroll-behavior-y: none;
    }

    /* Scrollbar Halus */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .lucide-icon { display: inline-flex; align-items: center; justify-content: center; }

    /* Penanganan Notch & Home Bar HP (iOS & Android) */
    .pb-safe { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
    .pt-safe { padding-top: calc(0.75rem + env(safe-area-inset-top, 0px)); }

    /* Hide scrollbar for category pills on mobile */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animasi Garis Laser Pemindai Barcode */
    @keyframes scanLaser {
      0% { top: 12%; opacity: 0.8; }
      50% { top: 88%; opacity: 1; }
      100% { top: 12%; opacity: 0.8; }
    }
    .scanner-laser-line {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e, #4ade80, #22c55e, transparent);
      box-shadow: 0 0 14px 3px rgba(34, 197, 94, 0.85);
      animation: scanLaser 2s infinite ease-in-out;
      border-radius: 9999px;
      z-index: 25;
      pointer-events: none;
    }

    /* Penyesuaian viewport kamera Html5Qrcode untuk iOS & Android */
    #scanner-reader {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      background: #000 !important;
      border: none !important;
      overflow: hidden !important;
    }
    #scanner-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
    #scanner-reader canvas {
      display: none !important;
    }
    #scanner-reader__scan_region {
      background: transparent !important;
    }
    #scanner-reader__dashboard {
      display: none !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback, Component } = React;

    /* Error Boundary untuk mencegah layar blank jika terjadi error tak terduga */
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("POSPro App Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 max-w-md w-full shadow-2xl">
                <div className="w-14 h-14 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                  <i data-lucide="triangle-alert" className="w-8 h-8"></i>
                </div>
                <h2 className="text-lg font-black text-white">Terjadi Kendala Sistem</h2>
                <p className="text-xs text-slate-400 mt-2">Data kasir Anda tetap aman di perangkat. Silakan klik tombol di bawah untuk memuat ulang aplikasi.</p>
                <div className="mt-6 flex flex-col gap-2">
                  <button 
                    onClick={() => window.location.reload()} 
                    className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs"
                  >
                    Muat Ulang Aplikasi
                  </button>
                  <button 
                    onClick={() => { localStorage.clear(); window.location.reload(); }} 
                    className="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-rose-300 font-bold rounded-xl text-xs"
                  >
                    Reset Memori & Muat Ulang
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }
    const Icon = ({ name, className = "w-5 h-5", title }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          try {
            iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
            window.lucide.createIcons({ root: iconRef.current, nameAttr: 'data-lucide' });
          } catch (e) {
            // Fallback aman
          }
        }
      }, [name, className]);
      return <span ref={iconRef} className={`lucide-icon shrink-0 ${className}`} title={title || name} />;
    };

    const generateId = () => Math.random().toString(36).substr(2, 9);
    const formatMoney = (amount) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount || 0);

    const parseDateStr = (dateStr) => {
      if (!dateStr) return new Date();
      try {
        const parts = String(dateStr).split(', ');
        if (parts.length !== 2) return new Date();
        const [d, m, y] = parts[0].split('/');
        const [hr, min, sec] = parts[1].split('.');
        return new Date(y, m - 1, d, hr, min, sec);
      } catch (e) {
        return new Date();
      }
    };

    // Fungsi suara Beep Kasir menggunakan Web Audio API
    const playScanBeep = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1850, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {
        // Fallback jika audio dicegah browser
      }
    };

    const defaultSettings = {
      name: 'POSPro Store', tagline: 'Sistem Kasir & Manajemen UMKM', phone: '081234567890', address: 'Jl. Teknologi No. 1, Jakarta',
      receiptFooter: 'Terima kasih atas kunjungan Anda!\nBarang yang dibeli tidak dapat ditukar.', invoicePrefix: 'INV-', taxPercent: 0, defaultDiscount: 0, currency: 'IDR',
      paymentMethods: ['Cash', 'Debit', 'Transfer', 'QRIS', 'E-wallet', 'Hutang']
    };

    const defaultProducts = [
      { id: '1', sku: 'BRG-001', name: 'Kopi Susu Gula Aren', costPrice: 12000, price: 18000, packPrice: 0, stock: 45, category: 'Minuman', supplier: 'PT. Kopi Nusantara' },
      { id: '2', sku: 'BRG-002', name: 'Nasi Goreng Spesial', costPrice: 15000, price: 25000, packPrice: 0, stock: 20, category: 'Makanan', supplier: 'Pasar Induk' },
      { id: '3', sku: 'BRG-003', name: 'Es Teh Manis Jumbo', costPrice: 2500, price: 6000, packPrice: 0, stock: 80, category: 'Minuman', supplier: 'PT. Sumber Segar' },
      { id: '4', sku: 'BRG-004', name: 'Roti Bakar Coklat Keju', costPrice: 10000, price: 17000, packPrice: 0, stock: 15, category: 'Makanan', supplier: 'Bakery Prima' }
    ];

    // Helper pembaca LocalStorage aman
    const loadSaved = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    };
    function App() {
      // Default langsung masuk ke kasir untuk operasional cepat dan aman
      const [activeTab, setActiveTab] = useState('pos');
      const [isDataLoading, setIsDataLoading] = useState(false);
      
      // Deteksi otomatis apakah pengguna menggunakan HP atau Komputer/Laptop
      const [isMobileDevice, setIsMobileDevice] = useState(() => {
        return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 1024;
      });

      useEffect(() => {
        const handleResize = () => {
          setIsMobileDevice(/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 1024);
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const [currentUser, setCurrentUser] = useState({ name: 'Mas Kasir', role: 'kasir', avatar: 'MK' });
      const [showRoleSwitcher, setShowRoleSwitcher] = useState(false);
      const [showNotificationDrawer, setShowNotificationDrawer] = useState(false);
      const [showMobileCartDrawer, setShowMobileCartDrawer] = useState(false);

      const [authModal, setAuthModal] = useState({ show: false, targetRole: null, password: '' });
      
      // Pembacaan data dari LocalStorage dengan Try-Catch
      const [rolePasswords, setRolePasswords] = useState(() => loadSaved('pospro_role_passwords', { owner: 'owner123', admin: 'admin123' }));
      const [storeSettings, setStoreSettings] = useState(() => loadSaved('pospro_store_settings', defaultSettings));
      const [products, setProducts] = useState(() => loadSaved('pospro_products', defaultProducts));
      const [transactions, setTransactions] = useState(() => loadSaved('pospro_transactions', []));
      const [draftOrders, setDraftOrders] = useState(() => loadSaved('pospro_draft_orders', []));
      const [customers, setCustomers] = useState(() => loadSaved('pospro_customers', []));
      const [suppliers, setSuppliers] = useState(() => loadSaved('pospro_suppliers', []));
      const [expenses, setExpenses] = useState(() => loadSaved('pospro_expenses', []));

      // Auto-save ke LocalStorage
      useEffect(() => { try { localStorage.setItem('pospro_store_settings', JSON.stringify(storeSettings)); } catch(e){} }, [storeSettings]);
      useEffect(() => { try { localStorage.setItem('pospro_role_passwords', JSON.stringify(rolePasswords)); } catch(e){} }, [rolePasswords]);
      useEffect(() => { try { localStorage.setItem('pospro_products', JSON.stringify(products)); } catch(e){} }, [products]);
      useEffect(() => { try { localStorage.setItem('pospro_transactions', JSON.stringify(transactions)); } catch(e){} }, [transactions]);
      useEffect(() => { try { localStorage.setItem('pospro_draft_orders', JSON.stringify(draftOrders)); } catch(e){} }, [draftOrders]);
      useEffect(() => { try { localStorage.setItem('pospro_customers', JSON.stringify(customers)); } catch(e){} }, [customers]);
      useEffect(() => { try { localStorage.setItem('pospro_suppliers', JSON.stringify(suppliers)); } catch(e){} }, [suppliers]);
      useEffect(() => { try { localStorage.setItem('pospro_expenses', JSON.stringify(expenses)); } catch(e){} }, [expenses]);

      // State Operasional Kasir
      const [cart, setCart] = useState([]);
      const [discount, setDiscount] = useState(0);
      const [cashReceived, setCashReceived] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Semua');
      const [paymentMethod, setPaymentMethod] = useState('Cash');
      const [transactionNote, setTransactionNote] = useState('');
      
      const [showDiscountModal, setShowDiscountModal] = useState(false);
      const [discountInput, setDiscountInput] = useState('');
      const [showDraftSaveModal, setShowDraftSaveModal] = useState(false);
      const [draftNameInput, setDraftNameInput] = useState('');
      const [showDraftListModal, setShowDraftListModal] = useState(false);
      
      const [isSaving, setIsSaving] = useState(false);

      // State Scanner Kamera Barcode
      const [scannerModal, setScannerModal] = useState({
        isOpen: false,
        target: 'pos', // 'pos' atau 'product_form'
        continuousMode: true,
        lastScanned: null,
        errorMsg: '',
        isLoadingCamera: false
      });
      const [isProcessingImage, setIsProcessingImage] = useState(false);
      const scannerInstanceRef = useRef(null);
      const lastScanTimeRef = useRef(0);
      const cameraNativeInputRef = useRef(null);
      const galleryInputRef = useRef(null);

      // Modals
      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [productForm, setProductForm] = useState({ sku: '', name: '', costPrice: '', price: '', packPrice: '', stock: '', category: 'Umum', supplier: '' });

      const [showRestockModal, setShowRestockModal] = useState(false);
      const [restockForm, setRestockForm] = useState({ supplier: '', date: new Date().toISOString().split('T')[0], items: [{ productId: '', qty: '' }], totalBill: '', paidAmount: '', paymentStatus: 'Lunas' });

      const [showStockOutModal, setShowStockOutModal] = useState(false);
      const [stockOutForm, setStockOutForm] = useState({ reason: 'Barang rusak', date: new Date().toISOString().split('T')[0], items: [{ productId: '', qty: '' }] });

      const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
      const [editingCustomer, setEditingCustomer] = useState(null);
      const [customerForm, setCustomerForm] = useState({ name: '', phone: '', address: '' });
      const [selectedCustomerPOS, setSelectedCustomerPOS] = useState('');

      const [isSupplierModalOpen, setIsSupplierModalOpen] = useState(false);
      const [editingSupplier, setEditingSupplier] = useState(null);
      const [supplierForm, setSupplierForm] = useState({ name: '', contactPerson: '', phone: '', address: '' });

      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [expenseForm, setExpenseForm] = useState({ category: 'Listrik', amount: '', date: new Date().toISOString().split('T')[0], note: '' });

      const [paymentModalCustomer, setPaymentModalCustomer] = useState(null);
      const [customerPayAmount, setCustomerPayAmount] = useState('');

      const [paymentModalSupplier, setPaymentModalSupplier] = useState(null);
      const [supplierPayAmount, setSupplierPayAmount] = useState('');

      const [viewingTransaction, setViewingTransaction] = useState(null);
      const [revenuePeriod, setRevenuePeriod] = useState('today'); 
      const [reportPeriod, setReportPeriod] = useState('month');
      const [customStartDate, setCustomStartDate] = useState(new Date().toISOString().split('T')[0]);
      const [customEndDate, setCustomEndDate] = useState(new Date().toISOString().split('T')[0]);

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const fileInputRef = useRef(null);

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 2500);
      };

      const addToCart = useCallback((product) => {
        if (!product) return false;
        if (product.stock <= 0) { 
          showToast('Stok barang habis!', 'error'); 
          return false; 
        }
        let success = true;
        setCart(prevCart => {
          const existingItem = prevCart.find(item => item.product.id === product.id);
          if (existingItem) {
            if (existingItem.qty >= product.stock) {
              showToast(`Maksimal stok tercapai untuk ${product.name}!`, 'error');
              success = false;
              return prevCart;
            }
            return prevCart.map(item => item.product.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          } else {
            return [...prevCart, { product, qty: 1, discountRp: '' }];
          }
        });
        return success;
      }, []);

      const removeFromCart = (productId) => setCart(cart.filter(item => item.product.id !== productId));
      
      const updateQty = (productId, delta) => {
        setCart(cart.map(item => {
          if (item.product.id === productId) {
            const newQty = item.qty + delta;
            if (newQty > item.product.stock) { showToast('Melebihi sisa stok!', 'error'); return item; }
            return newQty > 0 ? { ...item, qty: newQty } : item;
          }
          return item;
        }));
      };

      const updateItemDiscount = (productId, amount) => { 
        setCart(cart.map(item => item.product.id === productId ? { ...item, discountRp: amount === '' ? '' : Number(amount) } : item)); 
      };

      const totalItemCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const subtotal = cart.reduce((sum, item) => sum + ((item.product.price - (Number(item.discountRp) || 0)) * item.qty), 0);
      const discountAmount = (subtotal * discount) / 100;
      const taxAmount = ((subtotal - discountAmount) * (Number(storeSettings.taxPercent) || 0)) / 100;
      const grandTotal = subtotal - discountAmount + taxAmount;
      
      const handleQuickCash = (amount) => setCashReceived(amount.toString());

      // =========================================================================
      // INTEGRASI ALAT SCAN BARCODE FISIK (USB / BLUETOOTH SCANNER GUN) DI PC/LAPTOP
      // Otomatis menangkap scan barcode berkecepatan tinggi & langsung masukkan ke keranjang
      // =========================================================================
      const barcodeBufferRef = useRef('');
      const lastKeyTimeRef = useRef(0);

      useEffect(() => {
        const handleGlobalBarcodeScanner = (e) => {
          // Hanya aktif di tab POS Kasir dan ketika tidak sedang mengetik di modal lain
          if (activeTab !== 'pos' || scannerModal.isOpen || isProductModalOpen || showDraftSaveModal) {
            return;
          }

          // Jangan interupsi jika pengguna sedang mengetik di input biasa dengan santai
          const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
          const isTypingInSpecialInput = activeTag === 'textarea' || (activeTag === 'input' && document.activeElement.type === 'number');
          if (isTypingInSpecialInput) return;

          const now = Date.now();
          const timeDiff = now - lastKeyTimeRef.current;
          lastKeyTimeRef.current = now;

          // Scanner fisik mengirim karakter dengan kecepatan sangat tinggi (< 50ms antar karakter)
          if (timeDiff > 80 && e.key !== 'Enter') {
            barcodeBufferRef.current = '';
          }

          if (e.key === 'Enter') {
            const rawCode = barcodeBufferRef.current.trim() || searchQuery.trim();
            if (rawCode.length >= 2) {
              const cleanCode = rawCode.toUpperCase();
              const matchedProduct = products.find(p => (p.sku && p.sku.toUpperCase() === cleanCode) || p.id === cleanCode);
              
              if (matchedProduct) {
                playScanBeep();
                const added = addToCart(matchedProduct);
                if (added) {
                  showToast(`+1 ${matchedProduct.name} masuk keranjang!`);
                }
                setSearchQuery('');
                barcodeBufferRef.current = '';
                e.preventDefault();
              } else if (rawCode === barcodeBufferRef.current.trim()) {
                showToast(`Barcode "${cleanCode}" tidak ditemukan!`, 'error');
                barcodeBufferRef.current = '';
              }
            }
          } else if (e.key && e.key.length === 1) {
            barcodeBufferRef.current += e.key;
          }
        };

        window.addEventListener('keydown', handleGlobalBarcodeScanner);
        return () => window.removeEventListener('keydown', handleGlobalBarcodeScanner);
      }, [activeTab, products, searchQuery, addToCart, scannerModal.isOpen, isProductModalOpen, showDraftSaveModal]);

      // Menutup modal pemindai kamera & mematikan kamera dengan aman
      const closeScannerModal = useCallback(async () => {
        if (scannerInstanceRef.current) {
          try {
            await scannerInstanceRef.current.stop();
            await scannerInstanceRef.current.clear();
          } catch (e) {
            console.warn("Scanner stop error:", e);
          }
          scannerInstanceRef.current = null;
        }
        setScannerModal(prev => ({
          ...prev,
          isOpen: false,
          errorMsg: '',
          isLoadingCamera: false
        }));
      }, []);

      // Menangani kode barcode yang berhasil dideteksi dari live kamera atau foto
      const handleScannedBarcode = useCallback((decodedText) => {
        if (!decodedText) return;
        const cleanCode = String(decodedText).trim().toUpperCase();
        
        const now = Date.now();
        if (now - lastScanTimeRef.current < 1500) {
          return; // Mencegah scan ganda dalam 1.5 detik
        }
        lastScanTimeRef.current = now;
        playScanBeep();

        setScannerModal(prev => ({ ...prev, lastScanned: cleanCode }));

        if (scannerModal.target === 'product_form') {
          // Cek apakah barcode sudah terdaftar di produk yang ada
          const existing = products.find(p => (p.sku && p.sku.toUpperCase() === cleanCode) || p.id === cleanCode);
          if (existing && !editingProduct) {
            setEditingProduct(existing);
            setProductForm(existing);
            showToast(`Produk "${existing.name}" ditemukan! Memuat data...`, 'info');
          } else {
            setProductForm(prev => ({ ...prev, sku: cleanCode }));
            showToast(`SKU Barcode ${cleanCode} berhasil dimasukkan!`);
          }
          closeScannerModal();
        } else if (scannerModal.target === 'inventory_restock') {
          // Mode Scan Cepat Tambah Stok di Katalog Produk
          const matchedIndex = products.findIndex(p => (p.sku && p.sku.toUpperCase() === cleanCode) || p.id === cleanCode);
          if (matchedIndex !== -1) {
            const updatedProducts = [...products];
            const currentStock = Number(updatedProducts[matchedIndex].stock) || 0;
            const newStock = currentStock + 1;
            updatedProducts[matchedIndex] = {
              ...updatedProducts[matchedIndex],
              stock: newStock
            };
            setProducts(updatedProducts);
            showToast(`✅ +1 Stok "${updatedProducts[matchedIndex].name}" (Total: ${newStock})`);
            
            if (typeof google !== 'undefined' && google.script && google.script.run) {
              google.script.run.updateProduct(updatedProducts);
            }
            if (!scannerModal.continuousMode) {
              closeScannerModal();
            }
          } else {
            showToast(`Barcode "${cleanCode}" belum ada. Membuka formulir produk baru...`, 'warning');
            setEditingProduct(null);
            setProductForm({ sku: cleanCode, name: '', costPrice: '', price: '', packPrice: '', stock: 1, category: 'Umum', supplier: '' });
            setIsProductModalOpen(true);
            closeScannerModal();
          }
        } else {
          const matchedProduct = products.find(p => (p.sku && p.sku.toUpperCase() === cleanCode) || p.id === cleanCode);
          if (matchedProduct) {
            const added = addToCart(matchedProduct);
            if (added) {
              showToast(`+1 ${matchedProduct.name} (${cleanCode})!`);
            }
            if (!scannerModal.continuousMode) {
              closeScannerModal();
            }
          } else {
            showToast(`Barcode "${cleanCode}" belum terdaftar di katalog!`, 'error');
          }
        }
      }, [scannerModal.target, scannerModal.continuousMode, products, editingProduct, addToCart, closeScannerModal]);

      // Memindai foto barcode dari Kamera Bawaan HP atau Galeri (dengan auto-downscale resolusi iPhone)
      const handleImageFileScan = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setIsProcessingImage(true);
        setScannerModal(prev => ({ ...prev, errorMsg: '', isLoadingCamera: false }));

        try {

                } else {

            img.onerror = () => reject(new Error("Gagal membaca file gambar"));

      const handleSaveStockOut = (e) => {
        e.preventDefault();

          const item = stockOutForm.items[i];

        if (hasError) return;

        if (typeof google !== 'undefined' && google.script && google.script.run) { google.script.run.withSuccessHandler(() => { setExpenses([newExp, ...expenses]); setIsExpenseModalOpen(false); setExpenseForm({ category: 'Listrik', amount: '', date: new Date().toISOString().split('T')[0], note: '' }); showToast('Pengeluaran dicatat'); }).saveNewExpense(newExp); } else { setExpenses([newExp, ...expenses]); setIsExpenseModalOpen(false); setExpenseForm({ category: 'Listrik', amount: '', date: new Date().toISOString().split('T')[0], note: '' }); showToast('Pengeluaran dicatat'); }

          return true;
        });
        
        const revenueDisplay = filteredRevenueTransactions.reduce((sum, t) => sum + (t.total || 0), 0);
        const countDisplay = filteredRevenueTransactions.length;

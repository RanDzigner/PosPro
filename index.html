                      <span>Hapus Semua</span>
                    </button>
                  )}
                  <span className="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 text-xs font-black px-2.5 py-1 rounded-full">
                    {totalItemCount} Item
                  </span>
                  <button onClick={() => setShowMobileCartDrawer(false)} className="lg:hidden p-1 text-slate-400 hover:text-white bg-slate-800 rounded-lg cursor-pointer">
                    <Icon name="x" className="w-5 h-5"/>
                  </button>
                </div>
              </div>
              <div className={`flex items-center gap-2 rounded-2xl p-2 border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50 border-slate-200'}`}>
                <Icon name="user" className="w-4 h-4 text-slate-400 ml-1 shrink-0" />
                <select 
                  value={selectedCustomerPOS} 
                  onChange={(e) => setSelectedCustomerPOS(e.target.value)} 
                  className="w-full bg-transparent border-none outline-none text-xs sm:text-sm font-semibold cursor-pointer"
                >
                  <option value="" className={theme === 'dark' ? 'bg-[#181b3b] text-white' : ''}>Pelanggan Umum (Walk-in)</option>
                  {customers.map(c => <option key={c.id} value={c.id} className={theme === 'dark' ? 'bg-[#181b3b] text-white' : ''}>{c.name}</option>)}
                </select>
              </div>
            </div>

            <div className={`flex-1 overflow-y-auto p-3 space-y-2.5 ${theme === 'dark' ? 'bg-[#0f1228]/50' : 'bg-slate-50'}`}>
              {cart.length === 0 ? (
                <div className="h-full min-h-[180px] flex flex-col items-center justify-center text-slate-400 opacity-60 space-y-2">
                  <Icon name="shopping-bag" className="w-12 h-12" />
                  <p className="text-xs font-bold">Keranjang masih kosong</p>
                  <p className="text-[10px]">Pilih produk atau scan barcode kemasan barang.</p>
                </div>
              ) : (
                cart.map(item => (
                  <div key={item.product.id} className={`p-3 rounded-2xl border flex flex-col shadow-sm transition-all ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'
                  }`}>
                    <div className="flex justify-between items-start">
                      <div className="flex-1 pr-2">
                        <p className="font-extrabold text-xs sm:text-sm line-clamp-1">{item.product.name}</p>
                        <div className="flex items-center gap-2 mt-0.5">
                          <span className="text-[#00d2d3] font-bold text-xs">{formatMoney(item.product.price)}</span>
                          {item.discountRp > 0 && <span className="text-[10px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded font-bold">- {formatMoney(item.discountRp)}</span>}
                        </div>
                      </div>
                      <button onClick={() => removeFromCart(item.product.id)} className={`p-1.5 rounded-lg cursor-pointer transition-colors ${theme === 'dark' ? 'text-slate-400 hover:text-rose-400 bg-[#0f1228] hover:bg-rose-500/10' : 'text-slate-400 hover:text-rose-500 bg-slate-50 hover:bg-rose-50'}`}>
                        <Icon name="trash-2" className="w-4 h-4" />
                      </button>
                    </div>
                    <div className={`flex justify-between items-center pt-2 mt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                      <div className="flex items-center gap-1">
                        <span className="text-[10px] text-slate-400 font-bold">Disc:</span>
                        <input 
                          type="number" 
                          placeholder="Rp" 
                          value={item.discountRp} 
                          onChange={(e) => updateItemDiscount(item.product.id, e.target.value)} 
                          className={`w-16 rounded-lg px-2 py-0.5 text-xs font-medium outline-none border [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none ${
                            theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                          }`} 
                        />
                      </div>
                      <div className={`flex items-center rounded-xl border p-0.5 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-100 border-slate-200'}`}>
                        <button onClick={() => updateQty(item.product.id, -1)} className="w-7 h-7 flex items-center justify-center hover:bg-white/10 rounded-lg font-bold text-sm cursor-pointer">-</button>
                        <input 
                          type="number"
                          value={item.qty}
                          onChange={(e) => setExactQty(item.product.id, e.target.value)}
                          onBlur={() => { if (!item.qty || Number(item.qty) <= 0) setExactQty(item.product.id, 1); }}
                          className={`w-9 text-center font-bold text-xs bg-transparent outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}
                        />
                        <button onClick={() => updateQty(item.product.id, 1)} className="w-7 h-7 flex items-center justify-center hover:bg-white/10 rounded-lg font-bold text-sm cursor-pointer">+</button>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>

            <div className={`p-4 border-t shadow-2xl space-y-3 shrink-0 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
              <div className="grid grid-cols-2 gap-2">
                <input 
                  type="text" 
                  placeholder="Catatan struk..." 
                  value={transactionNote} 
                  onChange={(e) => setTransactionNote(e.target.value)} 
                  className={`w-full text-xs rounded-xl p-2.5 outline-none border ${
                    theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                  }`} 
                />
                <select 
                  value={paymentMethod} 
                  onChange={(e) => setPaymentMethod(e.target.value)} 
                  className={`w-full text-xs font-bold rounded-xl p-2.5 outline-none border cursor-pointer ${
                    theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                  }`}
                >
                  {storeSettings.paymentMethods.map(m => (<option key={m} value={m} className={theme === 'dark' ? 'bg-[#181b3b]' : ''}>{m}</option>))}
                </select>
              </div>

              <div className="space-y-1.5 text-xs">
                <div className="flex justify-between text-slate-400"><span>Subtotal:</span><span className="font-bold">{formatMoney(subtotal)}</span></div>
                {discount > 0 && (<div className="flex justify-between text-[#00d2d3]"><span>Diskon ({discount}%):</span><span>-{formatMoney(discountAmount)}</span></div>)}
                {Number(storeSettings.taxPercent) > 0 && (<div className="flex justify-between text-slate-400"><span>Pajak ({storeSettings.taxPercent}%):</span><span>{formatMoney(taxAmount)}</span></div>)}
                <div className={`flex justify-between items-baseline pt-2 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                  <span className="font-black text-xs uppercase text-slate-400">Total Tagihan</span>
                  <span className="text-xl sm:text-2xl font-black text-[#00d2d3]">{formatMoney(grandTotal)}</span>
                </div>
              </div>

              {(paymentMethod === 'Cash' || paymentMethod === 'Hutang') && (
                <div className="space-y-2">
                  <div className="flex gap-1.5">
                    <button onClick={() => handleQuickCash(grandTotal)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200 hover:bg-indigo-600' : 'bg-slate-100'}`}>Uang Pas</button>
                    <button onClick={() => handleQuickCash(50000)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200 hover:bg-indigo-600' : 'bg-slate-100'}`}>50k</button>
                    <button onClick={() => handleQuickCash(100000)} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200 hover:bg-indigo-600' : 'bg-slate-100'}`}>100k</button>
                  </div>
                  <input 
                    type="number" 
                    placeholder="Nominal Uang Tunai..." 
                    value={cashReceived} 
                    onChange={(e) => setCashReceived(e.target.value)} 
                    className={`w-full px-3 py-2.5 rounded-xl text-sm font-black outline-none border ${
                      theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50 border-slate-200'
                    }`} 
                  />
                  {paymentMethod === 'Cash' && cashReceived && parseInt(cashReceived) >= grandTotal && (
                    <div className="flex justify-between items-center bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 p-2.5 rounded-xl text-xs font-bold">
                      <span>KEMBALIAN</span>
                      <span className="text-sm font-black">{formatMoney(parseInt(cashReceived) - grandTotal)}</span>
                    </div>
                  )}
                </div>
              )}

              <button 
                onClick={handleCheckout} 
                disabled={!isReadyToPay} 
                className="w-full py-3.5 bg-gradient-to-r from-[#6366f1] to-[#a855f7] hover:from-indigo-600 hover:to-purple-600 disabled:opacity-40 text-white rounded-2xl font-black text-sm sm:text-base shadow-lg transition-all flex items-center justify-center gap-2 active:scale-98 cursor-pointer"
              >
                <Icon name="check-circle" className="w-5 h-5" /> Selesaikan & Cetak Nota
              </button>
            </div>
          </div>
        );
      };

      const renderPOS = () => {
        return (
          <div className="flex flex-col lg:flex-row h-[calc(100vh-60px)] lg:h-screen overflow-hidden">
            <div className={`flex-1 flex flex-col h-full overflow-hidden border-r ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-200'}`}>
              <div className={`p-3 sm:p-4 border-b flex flex-col gap-2.5 shrink-0 ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <div className="flex items-center gap-2">
                  <div className="relative flex-1">
                    <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" />
                    <input 
                      type="text" 
                      placeholder={isMobileDevice ? "Cari nama produk / kode SKU..." : "Cari nama / scan barcode dengan alat scanner..."} 
                      value={searchQuery} 
                      onChange={(e) => setSearchQuery(e.target.value)} 
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && searchQuery.trim()) {
                          const clean = searchQuery.trim().toUpperCase();
                          const found = products.find(p => (p.sku && p.sku.toUpperCase() === clean) || p.id === clean);
                          if (found) {
                            playScanBeep();
                            addToCart(found);
                            showToast(`+1 ${found.name} masuk keranjang!`);
                            setSearchQuery('');
                            e.preventDefault();
                          }
                        }
                      }}
                      className={`w-full pl-9 pr-3 py-2.5 rounded-2xl outline-none text-xs sm:text-sm font-medium border ${
                        theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white focus:border-[#00d2d3]' : 'bg-slate-100 border-transparent focus:bg-white focus:border-indigo-500'
                      }`} 
                    />
                  </div>

                  {isMobileDevice ? (
                    <button 
                      onClick={() => openScanner('pos')} 
                      className="px-3.5 py-2.5 bg-gradient-to-r from-[#00d2d3] to-[#6366f1] text-white rounded-2xl font-black text-xs flex items-center gap-1.5 shadow-md active:scale-95 transition-all shrink-0 cursor-pointer"
                    >
                      <Icon name="camera" className="w-4 h-4" />
                      <span>Scan Kamera</span>
                    </button>
                  ) : (
                    <div className={`hidden lg:flex items-center gap-1.5 px-3.5 py-2.5 rounded-2xl text-xs font-bold border shrink-0 ${
                      theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-300' : 'bg-slate-100 border-slate-200 text-slate-600'
                    }`}>
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      <Icon name="barcode" className="w-4 h-4 text-[#00d2d3]" />
                      <span>Scanner USB/BT Siap</span>
                    </div>
                  )}

                  <button 
                    onClick={() => setShowDraftSaveModal(true)} 
                    disabled={cart.length === 0} 
                    className={`p-2.5 rounded-2xl border relative cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed transition-all ${
                      theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-[#00d2d3] hover:bg-[#2a2f60]' : 'bg-indigo-50 border-indigo-100 text-indigo-600 hover:bg-indigo-100'
                    }`} 
                    title="Simpan / Tahan Pesanan (Draft)"
                  >
                    <Icon name="save" className="w-4 h-4" />
                  </button>

                  <button 
                    onClick={() => setShowDraftListModal(true)} 
                    className={`p-2.5 rounded-2xl border relative cursor-pointer transition-all ${
                      theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-[#00d2d3] hover:bg-[#2a2f60]' : 'bg-indigo-50 border-indigo-100 text-indigo-600 hover:bg-indigo-100'
                    }`} 
                    title="Daftar Pesanan Tertahan"
                  >
                    <Icon name="folder" className="w-4 h-4" />
                    {draftOrders.length > 0 && (
                      <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center animate-pulse">
                        {draftOrders.length}
                      </span>
                    )}
                  </button>
                </div>

                <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                  {categories.map(c => (
                    <button 
                      key={c} 
                      onClick={() => setSelectedCategory(c)} 
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all shrink-0 cursor-pointer ${
                        selectedCategory === c 
                          ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-md' 
                          : (theme === 'dark' ? 'bg-[#21254d] text-slate-400 hover:text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200')
                      }`}
                    >
                      {c}
                    </button>
                  ))}
                </div>
              </div>

              <div className={`flex-1 overflow-y-auto p-3 sm:p-4 pb-28 lg:pb-4 ${theme === 'dark' ? 'bg-[#0f1228]' : 'bg-slate-50'}`}>
                <div className="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4">
                  {filteredProducts.map(product => {
                    const isOOS = product.stock === 0; const isLow = product.stock > 0 && product.stock <= 10;
                    return (
                      <button 
                        key={product.id} 
                        onClick={() => addToCart(product)} 
                        disabled={isOOS} 
                        className={`relative p-4 sm:p-5 rounded-3xl border text-left flex flex-col justify-between min-h-[135px] sm:min-h-[150px] transition-all active:scale-[0.98] cursor-pointer ${
                          isOOS 
                            ? 'opacity-50 cursor-not-allowed bg-slate-800/40 border-slate-700' 
                            : (theme === 'dark' 
                                ? 'bg-[#181b3b] border-[#2a2f60] hover:border-[#00d2d3] shadow-lg hover:shadow-cyan-500/10' 
                                : 'bg-white border-slate-200 hover:border-indigo-500 shadow-sm')
                        }`}
                      >
                        {isOOS && (
                          <span className="absolute inset-0 bg-[#0f1228]/80 backdrop-blur-[2px] flex items-center justify-center rounded-3xl font-black text-rose-400 text-sm uppercase tracking-wider rotate-6 z-10">
                            Stok Habis
                          </span>
                        )}
                        
                        <div className="flex justify-between items-start gap-2 mb-2">
                          <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-lg truncate max-w-[110px] ${
                            theme === 'dark' ? 'bg-[#21254d] text-indigo-300' : 'bg-indigo-50 text-indigo-700'
                          }`}>
                            {product.category}
                          </span>
                          {!isOOS && (
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg shrink-0 ${
                              isLow ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : (theme === 'dark' ? 'bg-[#21254d] text-slate-300' : 'bg-slate-100 text-slate-600')
                            }`}>
                              Stok: {product.stock}
                            </span>
                          )}
                        </div>

                        <div className="my-auto py-1">
                          <h4 className={`font-extrabold text-sm sm:text-base leading-snug line-clamp-2 ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>
                            {product.name}
                          </h4>
                          <p className="text-[10px] font-mono text-slate-400 mt-0.5">{product.sku}</p>
                        </div>

                        <div className={`pt-2 mt-1 border-t flex items-baseline justify-between ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                          <p className="font-black text-base sm:text-lg text-[#00d2d3] tracking-tight">
                            {formatMoney(product.price)}
                          </p>
                          <span className="text-[10px] text-slate-400 font-bold hidden sm:inline">+ Tambah</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {cart.length > 0 && (
                <div className="lg:hidden fixed bottom-16 left-3 right-3 z-30 animate-in fade-in slide-in-from-bottom duration-200">
                  <div onClick={() => setShowMobileCartDrawer(true)} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-3.5 rounded-3xl shadow-2xl flex items-center justify-between cursor-pointer border border-indigo-400/30">
                    <div className="flex items-center gap-3">
                      <div className="bg-white/20 p-2 rounded-2xl"><Icon name="shopping-cart" className="w-5 h-5"/></div>
                      <div>
                        <p className="text-xs text-indigo-200 font-semibold">{totalItemCount} Item Terpilih</p>
                        <p className="text-base font-black">{formatMoney(grandTotal)}</p>
                      </div>
                    </div>
                    <span className="bg-white text-indigo-900 font-extrabold text-xs px-3.5 py-2 rounded-2xl flex items-center gap-1 shadow-md">Bayar <Icon name="chevron-right" className="w-4 h-4"/></span>
                  </div>
                </div>
              )}
            </div>

            <div className="hidden lg:flex w-[380px] xl:w-[420px] h-full">
              {renderCartContent()}
            </div>

            {showMobileCartDrawer && (
              <div className="lg:hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex flex-col justify-end">
                <div className="rounded-t-3xl h-[88vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-300">
                  {renderCartContent()}
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderReports = () => {
        const now = new Date(); 
        const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startOfWeek = new Date(todayDate); startOfWeek.setDate(todayDate.getDate() - todayDate.getDay());
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1); 
        const startOfYear = new Date(now.getFullYear(), 0, 1);

        const filteredTrx = transactions.filter(t => {
          const tDate = parseDateStr(t.date);
          if (reportPeriod === 'today') return tDate >= todayDate;
          if (reportPeriod === 'week') return tDate >= startOfWeek;
          if (reportPeriod === 'month') return tDate >= startOfMonth;
          if (reportPeriod === 'year') return tDate >= startOfYear;
          return true;
        });

        const omzet = filteredTrx.reduce((sum, t) => sum + (t.total || 0), 0);
        let hpp = 0; 
        filteredTrx.forEach(t => { 
          (t.items || []).forEach(item => { 
            if (item.product) { 
              const prod = products.find(p => p.id === item.product.id); 
              const cost = prod ? prod.costPrice : (item.product.costPrice || 0); 
              hpp += cost * item.qty; 
            } 
          }); 
        });
        const labaKotor = omzet - hpp; 
        const pengeluaranTotal = expenses.reduce((sum, e) => sum + (e.amount || 0), 0); 
        const labaBersih = labaKotor - pengeluaranTotal;

        return (
          <div className="p-3 sm:p-6 pb-28 lg:pb-8 space-y-4 max-w-6xl mx-auto">
            <div className={`p-4 sm:p-6 rounded-3xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${
              theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200 text-slate-800'
            }`}>
              <div>
                <h2 className="text-xl sm:text-2xl font-black tracking-tight">Laporan Keuangan & Profit</h2>
                <p className={`text-xs mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Analisis omzet penjualan, harga pokok modal, dan laba bersih riil ({storeSettings.name}).</p>
              </div>
              <div className={`flex p-1 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-100 border-slate-200'}`}>
                {['today', 'week', 'month', 'year'].map(p => (
                  <button key={p} onClick={() => setReportPeriod(p)} className={`px-3 py-1.5 rounded-xl text-xs font-bold capitalize whitespace-nowrap cursor-pointer ${reportPeriod === p ? 'bg-indigo-600 text-white shadow-md' : (theme === 'dark' ? 'text-slate-400' : 'text-slate-600')}`}>{p === 'today' ? 'Hari Ini' : p === 'week' ? 'Minggu' : p === 'month' ? 'Bulan Ini' : 'Tahun Ini'}</button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Omzet Penjualan</p>
                <p className="text-lg sm:text-xl font-black text-[#00d2d3] mt-1">{formatMoney(omzet)}</p>
              </div>
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Modal Pokok (HPP)</p>
                <p className="text-lg sm:text-xl font-black text-[#ff8a3d] mt-1">{formatMoney(hpp)}</p>
              </div>
              <div className={`p-4 rounded-3xl border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60]' : 'bg-white border-slate-200'}`}>
                <p className="text-[10px] text-slate-400 font-bold uppercase">Beban Operasional</p>
                <p className="text-lg sm:text-xl font-black text-[#ff4b8b] mt-1">{formatMoney(pengeluaranTotal)}</p>
              </div>
              <div className={`p-4 rounded-3xl border bg-gradient-to-br from-indigo-900/60 to-purple-900/60 border-indigo-500/40 text-white`}>
                <p className="text-[10px] text-indigo-300 font-bold uppercase">Laba Bersih Toko</p>
                <p className="text-lg sm:text-xl font-black text-emerald-400 mt-1">{formatMoney(labaBersih)}</p>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className={`flex h-screen overflow-hidden font-sans transition-colors duration-300 ${
          theme === 'dark' ? 'bg-[#0f1228] text-slate-100' : 'bg-[#f4f6fb] text-slate-800'
        }`}>
          {toast.show && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 bg-slate-900/95 text-white backdrop-blur-md border border-slate-700 text-xs font-bold animate-in fade-in zoom-in">
              <Icon name={toast.type === 'error' ? "alert-circle" : "check-circle"} className={`w-4 h-4 ${toast.type === 'error' ? 'text-rose-400' : 'text-emerald-400'}`} />
              <span>{toast.message}</span>
            </div>
          )}

          {/* Sidebar Desktop */}
          <div className={`w-64 flex-col hidden lg:flex shadow-2xl z-30 border-r transition-all ${
            theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-slate-300' : 'bg-white border-slate-200 text-slate-600'
          }`}>
            <div className="p-6">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center font-black text-white shadow-lg">
                  <Icon name="store" className="w-5 h-5"/>
                </div>
                <div className="overflow-hidden">
                  <h1 className={`text-base font-black tracking-tight leading-none truncate ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>
                    {storeSettings.name}
                  </h1>
                  <div className="flex items-center gap-1.5 mt-1.5">
                    <span className={`w-2 h-2 rounded-full ${isCloudSyncing ? 'bg-amber-400 animate-spin' : 'bg-emerald-400 animate-pulse'}`}></span>
                    <p className="text-[10px] font-bold text-[#00d2d3] uppercase tracking-wider">
                      {isDemoUser ? 'MODE DEMO' : 'CLOUD SYNC AKTIF'}
                    </p>
                  </div>
                </div>
              </div>
            </div>
            
            {/* Profil Akun & Status Lisensi di Sidebar */}
            <div className="px-4 mb-2 space-y-2">
              <div className={`p-3.5 rounded-2xl border flex flex-col gap-2.5 transition-all ${
                theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50 border-slate-200'
              }`}>
                <div className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2.5 overflow-hidden">
                    <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-500 text-white font-black flex items-center justify-center text-xs shadow-md shrink-0">
                      {currentUser.avatar}
                    </div>
                    <div className="overflow-hidden">
                      <p className={`font-black text-xs sm:text-sm tracking-tight truncate leading-tight ${theme === 'dark' ? 'text-white' : 'text-slate-800'}`}>
                        {currentUser.name}
                      </p>
                      <p className="text-[11px] text-[#00d2d3] font-mono font-bold truncate mt-0.5">
                        {licenseData?.key || 'Mode Demo'}
                      </p>
                    </div>
                  </div>

                  <button 
                    onClick={handleLogout} 
                    className="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl transition-colors cursor-pointer shrink-0" 
                    title="Ganti / Keluar Lisensi"
                  >
                    <Icon name="log-out" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex items-center justify-between pt-2 border-t border-slate-700/30">
                  <div className="flex items-center gap-1.5">
                    <span className={`text-[11px] font-black uppercase tracking-wider px-2.5 py-1 rounded-xl border flex items-center gap-1 shadow-sm ${
                      currentUser.role === 'owner'
                        ? 'bg-amber-500/20 text-amber-300 border-amber-500/30'
                        : currentUser.role === 'admin'
                        ? 'bg-cyan-500/20 text-[#00d2d3] border-cyan-500/30'
                        : 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30'
                    }`}>
                      <span>{currentUser.role === 'owner' ? '👑 OWNER' : currentUser.role === 'admin' ? '💼 ADMIN' : '🛒 KASIR (POS)'}</span>
                    </span>
                  </div>

                  <button 
                    onClick={() => setShowRoleSwitcher(!showRoleSwitcher)} 
                    className="px-2.5 py-1 bg-gradient-to-r from-indigo-600 to-purple-600 hover:brightness-110 text-white rounded-xl text-xs font-black flex items-center gap-1 shadow-md transition-all active:scale-95 cursor-pointer"
                  >
                    <Icon name="repeat" className="w-3 h-3" />
                    <span>Ganti Role</span>
                  </button>
                </div>
              </div>

              {/* Status Masa Aktif Lisensi Sidebar */}
              <div className={`p-2.5 rounded-2xl border flex items-center justify-between text-[11px] ${
                theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-100 border-slate-200'
              }`}>
                <div className="flex items-center gap-1.5 overflow-hidden">
                  <Icon name="shield-check" className="w-3.5 h-3.5 text-[#00d2d3] shrink-0" />
                  <span className="truncate font-semibold text-slate-300">{licenseStatus.label}</span>
                </div>
                <button 
                  onClick={() => setShowExtendLicenseModal(true)} 
                  className="text-[#00d2d3] font-black text-[10px] hover:underline shrink-0 ml-1 cursor-pointer"
                >
                  Perpanjang
                </button>
              </div>
            </div>

            <nav className="flex-1 px-3 space-y-1.5 overflow-y-auto pt-2">
              {[
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard Data', roles: ['owner', 'admin'] },
                { id: 'pos', icon: 'calculator', label: 'Kasir (POS)', roles: ['owner', 'admin', 'kasir'] },
                { id: 'inventory', icon: 'package', label: 'Form Stok & Barang', roles: ['owner', 'admin', 'kasir'] },
                { id: 'customers', icon: 'users', label: 'Pelanggan & Piutang', roles: ['owner', 'admin'] },
                { id: 'suppliers', icon: 'truck', label: 'Supplier & Hutang', roles: ['owner'] },
                { id: 'expenses', icon: 'receipt', label: 'Biaya Pengeluaran', roles: ['owner'] },
                { id: 'reports', icon: 'pie-chart', label: 'Laporan Profit', roles: ['owner'] },
                { id: 'transactions', icon: 'history', label: 'Riwayat Nota', roles: ['owner', 'admin', 'kasir'] },
                { id: 'settings', icon: 'settings', label: 'Pengaturan Toko', roles: ['owner'] }
              ].filter(item => item.roles.includes(currentUser.role)).map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button 
                    key={item.id} 
                    onClick={() => setActiveTab(item.id)} 
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-bold transition-all cursor-pointer ${
                      isActive 
                        ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/20 translate-x-1' 
                        : (theme === 'dark' ? 'hover:bg-[#21254d] text-slate-400 hover:text-white' : 'hover:bg-slate-100 text-slate-600')
                    }`}
                  >
                    <Icon name={item.icon} className={`w-4 h-4 ${isActive ? 'text-[#00d2d3]' : ''}`} />
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </nav>

            <div className={`p-4 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-200'}`}>
              <button 
                onClick={toggleTheme}
                className={`w-full py-2.5 px-3 rounded-2xl border flex items-center justify-between text-xs font-bold transition-all cursor-pointer ${
                  theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-amber-300 hover:bg-[#282d5e]' : 'bg-slate-100 border-slate-200 text-slate-700'
                }`}
              >
                <span className="flex items-center gap-2">
                  <Icon name={theme === 'dark' ? "sun" : "moon"} className="w-4 h-4 text-amber-400" />
                  <span>{theme === 'dark' ? 'Mode Terang' : 'Mode Gelap'}</span>
                </span>
                <span className="text-[10px] uppercase opacity-70">{theme}</span>
              </button>
            </div>
          </div>

          <div className="flex-1 flex flex-col h-screen overflow-hidden">
            {/* Topbar Mobile */}
            <div className={`lg:hidden px-4 py-3 flex items-center justify-between shadow-md z-20 shrink-0 border-b ${
              theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200 text-slate-800'
            }`}>
              <div className="flex items-center gap-2.5 overflow-hidden">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center font-black text-xs text-white shrink-0">
                  {currentUser.avatar}
                </div>
                <div className="overflow-hidden">
                  <h1 className="text-xs font-black tracking-tight leading-none truncate max-w-[130px]">{storeSettings.name}</h1>
                  <span className="text-[9px] text-[#00d2d3] font-bold uppercase">{isDemoUser ? 'Demo' : 'Live Sync'}</span>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button 
                  onClick={toggleTheme} 
                  className={`p-2 rounded-xl border cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-amber-300' : 'bg-slate-100 border-slate-200 text-slate-700'}`}
                  title="Ganti Tema"
                >
                  <Icon name={theme === 'dark' ? "sun" : "moon"} className="w-4 h-4" />
                </button>
                <button 
                  onClick={() => setShowRoleSwitcher(true)} 
                  className={`px-3 py-1.5 rounded-xl text-xs font-black border flex items-center gap-1 shadow-sm cursor-pointer ${
                    currentUser.role === 'owner'
                      ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                      : currentUser.role === 'admin'
                      ? 'bg-cyan-500/20 text-[#00d2d3] border-cyan-500/40'
                      : 'bg-indigo-500/20 text-indigo-300 border-indigo-500/40'
                  }`}
                >
                  <Icon name="user-check" className="w-3.5 h-3.5" />
                  <span>{currentUser.role.toUpperCase()}</span>
                </button>
                <button 
                  onClick={handleLogout} 
                  className="p-2 text-rose-400 bg-rose-500/10 rounded-xl cursor-pointer" 
                  title="Keluar Akun"
                >
                  <Icon name="log-out" className="w-4 h-4" />
                </button>
              </div>
            </div>

            <div className={`lg:hidden px-2 py-2 z-20 shrink-0 border-b shadow-sm overflow-x-auto no-scrollbar ${
              theme === 'dark' ? 'bg-[#181b3b]/98 border-[#2a2f60]' : 'bg-white/98 border-slate-200'
            }`}>
              <div className="flex gap-1.5 w-max min-w-full items-center">
                {[
                  { id: 'dashboard', icon: 'layout-grid', label: 'Dashboard', roles: ['owner', 'admin'] },
                  { id: 'pos', icon: 'calculator', label: 'Kasir', roles: ['owner', 'admin', 'kasir'] },
                  { id: 'inventory', icon: 'package', label: 'Produk', roles: ['owner', 'admin', 'kasir'] },
                  { id: 'customers', icon: 'users', label: 'Pelanggan', roles: ['owner', 'admin'] },
                  { id: 'suppliers', icon: 'truck', label: 'Supplier', roles: ['owner'] },
                  { id: 'expenses', icon: 'receipt', label: 'Pengeluaran', roles: ['owner'] },
                  { id: 'transactions', icon: 'history', label: 'Riwayat', roles: ['owner', 'admin', 'kasir'] },
                  { id: 'reports', icon: 'pie-chart', label: 'Laporan', roles: ['owner'] },
                  { id: 'settings', icon: 'settings', label: 'Toko', roles: ['owner'] }
                ].filter(item => item.roles.includes(currentUser.role)).map(item => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`flex flex-col items-center justify-center py-2 px-3 min-w-[70px] rounded-2xl transition-all cursor-pointer ${
                        isActive
                          ? (theme === 'dark' 
                              ? 'bg-[#21254d] border-2 border-[#00d2d3] shadow-md shadow-cyan-500/20 text-[#00d2d3]' 
                              : 'bg-indigo-50 border-2 border-indigo-600 shadow-sm text-indigo-600')
                          : (theme === 'dark' 
                              ? 'text-slate-400 hover:text-slate-200 border-2 border-transparent' 
                              : 'text-slate-500 hover:text-slate-800 border-2 border-transparent')
                      }`}
                    >
                      <Icon 
                        name={item.icon} 
                        className={`w-4 h-4 ${isActive ? (theme === 'dark' ? 'text-[#00d2d3]' : 'text-indigo-600') : ''}`} 
                      />
                      <span className={`text-[10px] font-bold mt-1 tracking-tight truncate w-full text-center ${
                        isActive ? (theme === 'dark' ? 'text-[#00d2d3]' : 'text-indigo-600') : ''
                      }`}>
                        {item.label}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="flex-1 overflow-y-auto">
              {activeTab === 'dashboard' && currentUser.role !== 'kasir' && renderDashboard()}
              {activeTab === 'pos' && renderPOS()}
              {activeTab === 'reports' && currentUser.role === 'owner' && renderReports()}

              {activeTab === 'inventory' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-7xl mx-auto space-y-4">
                  <div className={`p-4 sm:p-6 rounded-3xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200 text-slate-800'
                  }`}>
                    <div>
                      <h2 className="text-xl sm:text-2xl font-black tracking-tight">Katalog Produk & Stok</h2>
                      <p className={`text-xs mt-0.5 ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>Kelola stok dan tambah stok cepat dengan scan barcode.</p>
                    </div>
                    <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                      <button 
                        onClick={() => openScanner('scan_new_product')} 
                        className="flex-1 sm:flex-none bg-gradient-to-r from-emerald-600 to-teal-600 hover:brightness-110 text-white px-3.5 py-2.5 rounded-2xl text-xs font-black flex items-center justify-center gap-1.5 shadow-md active:scale-95 transition-all cursor-pointer"
                        title="Pindai barcode kemasan untuk mendaftarkan barang baru"
                      >
                        <Icon name="scan" className="w-4 h-4" />
                        <span>+ Scan Produk Baru</span>
                      </button>
                      <button 
                        onClick={() => openScanner('inventory_restock')} 
                        className="flex-1 sm:flex-none bg-gradient-to-r from-[#00d2d3] to-[#6366f1] text-white px-3.5 py-2.5 rounded-2xl text-xs font-black flex items-center justify-center gap-1.5 shadow-md active:scale-95 transition-all cursor-pointer"
                      >
                        <Icon name="camera" className="w-4 h-4" />
                        <span>Scan Stok (+1)</span>
                      </button>
                      <button onClick={() => setShowRestockModal(true)} className="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-1 cursor-pointer"><Icon name="plus" className="w-4 h-4" /> Masuk Form</button>
                      <button onClick={() => setShowStockOutModal(true)} className="flex-1 sm:flex-none bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-1 cursor-pointer"><Icon name="minus" className="w-4 h-4" /> Keluar</button>
                      <button onClick={() => { setEditingProduct(null); setProductForm({ sku: '', name: '', costPrice: '', price: '', packPrice: '', stock: '', category: 'Umum', supplier: '' }); setIsProductModalOpen(true); }} className={`flex-1 sm:flex-none px-3.5 py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-1 border cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-white hover:bg-[#282d5e]' : 'bg-slate-800 text-white'}`}><Icon name="plus" className="w-4 h-4" /> + Manual</button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {products.map(p => (
                      <div key={p.id} className={`p-4 rounded-3xl border shadow-sm flex flex-col justify-between transition-all ${
                        theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200 text-slate-800'
                      }`}>
                        <div>
                          <div className="flex justify-between items-start">
                            <span className={`text-[10px] font-mono px-2 py-0.5 rounded-lg font-bold ${theme === 'dark' ? 'bg-[#21254d] text-slate-300' : 'bg-slate-100 text-slate-600'}`}>{p.sku}</span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${p.stock === 0 ? 'bg-rose-500/20 text-rose-400' : p.stock <= 10 ? 'bg-amber-500/20 text-amber-400' : 'bg-emerald-500/20 text-emerald-400'}`}>Stok: {p.stock}</span>
                          </div>
                          <h4 className="font-extrabold text-sm mt-2.5">{p.name}</h4>
                          <p className="text-xs font-black text-[#00d2d3] mt-1">{formatMoney(p.price)}</p>
                          {currentUser.role === 'owner' && <p className="text-[10px] text-slate-400 mt-0.5">Modal: {formatMoney(p.costPrice)}</p>}
                        </div>
                        <div className={`flex justify-end gap-2 mt-3 pt-2.5 border-t ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>
                          <button onClick={() => { setEditingProduct(p); setProductForm(p); setIsProductModalOpen(true); }} className={`p-2 rounded-xl text-xs font-bold flex items-center gap-1 border cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-[#00d2d3]' : 'bg-indigo-50 text-indigo-600'}`}><Icon name="edit" className="w-3.5 h-3.5"/> Edit</button>
                          {currentUser.role !== 'kasir' && (
                            <button onClick={() => handleDeleteProduct(p.id)} className="p-2 text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-xl text-xs font-bold cursor-pointer"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Pengaturan Toko & Informasi Lisensi */}
              {activeTab === 'settings' && currentUser.role === 'owner' && (
                <div className="p-3 sm:p-6 pb-28 lg:pb-8 max-w-4xl mx-auto space-y-4">
                  {/* Kartu Informasi Lisensi */}
                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <div className="flex items-center justify-between">
                      <h3 className="font-extrabold text-sm flex items-center gap-2">
                        <Icon name="shield-check" className="w-4 h-4 text-[#00d2d3]"/> Status Lisensi POSPro
                      </h3>
                      <span className="px-2.5 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-full text-[11px] font-bold">
                        {licenseStatus.label}
                      </span>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 text-xs">
                      <div className={`p-3 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                        <p className="text-slate-400 text-[10px]">Pemilik Lisensi</p>
                        <p className="font-bold mt-0.5">{licenseData?.ownerName || 'Pemilik Toko'}</p>
                      </div>
                      <div className={`p-3 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                        <p className="text-slate-400 text-[10px]">Kode Lisensi Terpasang</p>
                        <p className="font-mono font-bold text-[#00d2d3] mt-0.5 truncate">{licenseData?.key || '-'}</p>
                      </div>
                      <div className={`p-3 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                        <p className="text-slate-400 text-[10px]">Masa Berlaku</p>
                        <p className="font-bold text-amber-400 mt-0.5">{licenseStatus.label}</p>
                      </div>
                    </div>
                    <div className="pt-2 flex justify-end">
                      <button 
                        onClick={() => setShowExtendLicenseModal(true)} 
                        className="py-2.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-xs rounded-xl shadow-md cursor-pointer hover:brightness-110"
                      >
                        + Perpanjang / Ganti Lisensi
                      </button>
                    </div>
                  </div>

                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <div className="flex items-center justify-between">
                      <h3 className="font-extrabold text-sm flex items-center gap-2">
                        <Icon name="download" className="w-4 h-4 text-[#00d2d3]"/> Cadangan File Lokal (.JSON)
                      </h3>
                      {isDemoUser && (
                        <span className="text-[10px] bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded-full font-bold">
                          Terkunci di Mode Demo
                        </span>
                      )}
                    </div>
                    <p className={`text-xs ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>
                      {isDemoUser 
                        ? 'Fitur unduh dan simpan file cadangan lokal dinonaktifkan pada Mode Demo. Silakan aktivasi lisensi resmi untuk mengamankan data.' 
                        : 'Unduh seluruh data toko ke file cadangan atau pulihkan data kapan saja.'}
                    </p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
                      <button 
                        onClick={handleBackupDatabase} 
                        disabled={isDemoUser}
                        className={`py-2.5 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-md transition-all ${
                          isDemoUser 
                            ? 'bg-slate-800/80 text-slate-400 border border-slate-700 cursor-not-allowed opacity-60' 
                            : 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white cursor-pointer hover:brightness-110'
                        }`}
                      >
                        <Icon name={isDemoUser ? "lock" : "download"} className="w-4 h-4"/> 
                        <span>{isDemoUser ? 'Download Terkunci (Mode Demo)' : 'Download Backup (.json)'}</span>
                      </button>
                      {isDemoUser ? (
                        <button 
                          onClick={() => showToast('Fitur pulihkan cadangan dinonaktifkan di Mode Demo!', 'error')} 
                          className={`py-2.5 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 border cursor-not-allowed opacity-60 ${
                            theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-400' : 'bg-slate-100 border-slate-200 text-slate-400'
                          }`}
                        >
                          <Icon name="lock" className="w-4 h-4 text-slate-400"/> 
                          <span>Pulihkan Data Terkunci</span>
                        </button>
                      ) : (
                        <label className={`py-2.5 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer text-center border ${
                          theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60] text-slate-200 hover:bg-[#282d5e]' : 'bg-slate-100 border-slate-200 hover:bg-slate-200'
                        }`}>
                          <Icon name="upload" className="w-4 h-4 text-[#00d2d3]"/> 
                          <span>Pulihkan Data</span>
                          <input ref={fileInputRef} type="file" accept=".json" onChange={handleRestoreDatabase} className="hidden" />
                        </label>
                      )}
                    </div>
                  </div>

                  <div className={`p-4 sm:p-6 rounded-3xl border space-y-3 ${
                    theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
                  }`}>
                    <h3 className={`font-extrabold text-sm border-b pb-2 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-100'}`}>Identitas Toko & Nota</h3>
                    <form onSubmit={(e) => { e.preventDefault(); showToast('Pengaturan toko disimpan!'); }} className="space-y-3 text-xs">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="font-bold text-slate-400 mb-1 block">Nama Toko *</label>
                          <input type="text" required value={storeSettings.name} onChange={(e) => setStoreSettings({...storeSettings, name: e.target.value})} className={`w-full px-3 py-2.5 rounded-xl font-bold border outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                        </div>
                        <div>
                          <label className="font-bold text-slate-400 mb-1 block">Tagline / Slogan</label>
                          <input type="text" value={storeSettings.tagline} onChange={(e) => setStoreSettings({...storeSettings, tagline: e.target.value})} className={`w-full px-3 py-2.5 rounded-xl border outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                        </div>
                      </div>
                      <button type="submit" className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl font-black shadow-md cursor-pointer">
                        Simpan Identitas Toko
                      </button>
                    </form>
                  </div>
                </div>
              )}
            </div>
          </div>

          {showExtendLicenseModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className={`rounded-3xl w-full max-w-md p-6 space-y-4 border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200 text-slate-800'
              }`}>
                <div className="flex justify-between items-center">
                  <h3 className="font-black text-sm flex items-center gap-2">
                    <Icon name="key-round" className="w-4 h-4 text-[#00d2d3]" /> Perpanjang Masa Lisensi Toko
                  </h3>
                  <button onClick={() => { setShowExtendLicenseModal(false); setLicenseError(''); setExtendLicenseKeyInput(''); }} className="cursor-pointer">
                    <Icon name="x" className="w-5 h-5 text-slate-400" />
                  </button>
                </div>

                <form onSubmit={handleExtendLicense} className="space-y-3.5 text-xs">
                  <div>
                    <label className="font-bold text-slate-400 block mb-1">Nama Toko Terdaftar:</label>
                    <p className="p-3 bg-[#0f1228] border border-[#2a2f60] rounded-xl font-bold text-slate-200">
                      {licenseData?.ownerName || storeSettings.name}
                    </p>
                  </div>
                  <div>
                    <label className="font-bold text-slate-400 block mb-1">Kode Lisensi Perpanjangan (Google Sheets):</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="POS-30D-XXXXX-YYYY" 
                      value={extendLicenseKeyInput} 
                      onChange={(e) => setExtendLicenseKeyInput(e.target.value.toUpperCase())} 
                      className={`w-full p-3.5 rounded-xl border text-center font-mono font-black text-sm sm:text-base outline-none tracking-wider text-[#00d2d3] ${
                        theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'
                      }`} 
                    />
                  </div>
                  <button 
                    type="submit" 
                    disabled={isExtendingLicense}
                    className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:brightness-110 disabled:opacity-50 text-white font-black rounded-2xl text-xs shadow-lg cursor-pointer flex items-center justify-center gap-2"
                  >
                    {isExtendingLicense ? (
                      <>
                        <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        <span>Memproses Perpanjangan...</span>
                      </>
                    ) : (
                      <span>Terapkan Lisensi Perpanjangan</span>
                    )}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Scanner Barcode Kamera */}
          {scannerModal.isOpen && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-3 animate-in fade-in">
              <div className="bg-[#181b3b] border border-[#2a2f60] rounded-3xl w-full max-w-md overflow-hidden shadow-2xl flex flex-col relative">
                <div className="p-4 border-b border-[#2a2f60] flex items-center justify-between text-white">
                  <div className="flex items-center gap-2">
                    <Icon name="camera" className="w-5 h-5 text-[#00d2d3]" />
                    <span className="font-black text-sm">Pemindai Barcode Kamera</span>
                  </div>
                  <button onClick={closeScannerModal} className="p-1 text-slate-400 hover:text-white rounded-lg cursor-pointer">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="relative aspect-square w-full bg-black flex items-center justify-center overflow-hidden">
                  <div id="scanner-reader" className="w-full h-full"></div>
                  <div className="scanner-laser-line"></div>
                </div>

                {scannerModal.feedback && (
                  <div className={`p-4 border-t text-xs flex flex-col gap-1 ${
                    scannerModal.feedback.type === 'success' ? 'bg-emerald-500/20 border-emerald-500/30 text-emerald-300' :
                    scannerModal.feedback.type === 'warning' ? 'bg-amber-500/20 border-amber-500/30 text-amber-300' :
                    'bg-rose-500/20 border-rose-500/30 text-rose-300'
                  }`}>
                    <p className="font-black text-sm">{scannerModal.feedback.title}</p>
                    <p>{scannerModal.feedback.desc}</p>
                    {scannerModal.feedback.action === 'create_product' && (
                      <button 
                        onClick={() => {
                          const scannedSku = scannerModal.feedback.code;
                          closeScannerModal();
                          setEditingProduct(null);
                          setProductForm({ sku: scannedSku, name: '', costPrice: '', price: '', packPrice: '', stock: '1', category: 'Umum', supplier: '' });
                          setIsProductModalOpen(true);
                        }} 
                        className="mt-2 py-2 px-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:brightness-110 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-md cursor-pointer"
                      >
                        <Icon name="plus-circle" className="w-3.5 h-3.5" />
                        <span>Daftarkan Produk Baru Dengan Barcode Ini</span>
                      </button>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Modal Riwayat & Detail Pelanggan */}
          {viewingCustomer && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className={`rounded-3xl w-full max-w-lg p-6 space-y-4 border shadow-2xl ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'}`}>
                <div className="flex justify-between items-center pb-3 border-b border-[#2a2f60]">
                  <h3 className="font-black text-sm flex items-center gap-2">
                    <Icon name="users" className="w-4 h-4 text-[#00d2d3]"/> Profil & Riwayat Pelanggan
                  </h3>
                  <button onClick={() => setViewingCustomer(null)} className="cursor-pointer">
                    <Icon name="x" className="w-5 h-5 text-slate-400" />
                  </button>
                </div>

                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-white font-black text-base flex items-center justify-center">
                    {viewingCustomer.name.substring(0, 2).toUpperCase()}
                  </div>
                  <div>
                    <h4 className="font-black text-base">{viewingCustomer.name}</h4>
                    <p className="text-[11px] font-mono text-slate-400">{viewingCustomer.id} • {viewingCustomer.phone || 'Tanpa No. HP'}</p>
                  </div>
                </div>

                <div className={`p-3.5 rounded-2xl border text-xs space-y-1.5 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                  <p className="text-[10px] text-slate-400 uppercase font-bold">Alamat Lengkap:</p>
                  <p className="font-semibold">{viewingCustomer.address || 'Belum ada alamat tercatat'}</p>
                </div>

                <div className="grid grid-cols-3 gap-2.5 text-center text-xs">
                  <div className={`p-3 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                    <p className="text-[10px] text-slate-400 font-bold">Total Transaksi</p>
                    <p className="font-black text-base mt-0.5">{viewingCustomer.totalTrx || 0}x</p>
                  </div>
                  <div className={`p-3 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                    <p className="text-[10px] text-slate-400 font-bold">Total Belanja</p>
                    <p className="font-black text-sm text-[#00d2d3] mt-0.5">{formatMoney(viewingCustomer.totalSpent)}</p>
                  </div>
                  <div className={`p-3 rounded-2xl border ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                    <p className="text-[10px] text-slate-400 font-bold">Sisa Piutang</p>
                    <p className="font-black text-sm text-[#ff8a3d] mt-0.5">{formatMoney(viewingCustomer.debt)}</p>
                  </div>
                </div>

                {viewingCustomer.debt > 0 && (
                  <button 
                    onClick={() => {
                      const targetCust = viewingCustomer;
                      setViewingCustomer(null);
                      setPaymentModalCustomer(targetCust);
                      setCustomerPayAmount(targetCust.debt.toString());
                    }} 
                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-2xl shadow-md cursor-pointer flex items-center justify-center gap-1.5"
                  >
                    <Icon name="credit-card" className="w-4 h-4"/>
                    <span>Bayar / Lunasi Piutang ({formatMoney(viewingCustomer.debt)})</span>
                  </button>
                )}
              </div>
            </div>
          )}

          {/* Modal Tahan Pesanan (Save Draft) */}
          {showDraftSaveModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className={`rounded-3xl w-full max-w-sm p-6 space-y-4 border shadow-2xl ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Tahan Pesanan Saat Ini</h3><button onClick={() => setShowDraftSaveModal(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <div className="space-y-3 pt-1">
                  <div>
                    <label className="text-[11px] font-bold text-slate-400 mb-1 block">Nama Pelanggan / Nomor Meja *</label>
                    <input type="text" autoFocus placeholder="Misal: Bapak Budi / Meja 04" value={draftNameInput} onChange={(e) => setDraftNameInput(e.target.value)} className={`w-full p-3 border rounded-xl outline-none font-bold text-xs ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : 'bg-slate-50'}`} />
                  </div>
                  <button onClick={saveDraft} className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl text-xs shadow-md cursor-pointer">Simpan & Tahan Pesanan</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Daftar Pesanan Tertahan (Draft List) */}
          {showDraftListModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className={`rounded-3xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden border shadow-2xl ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="p-4 border-b border-[#2a2f60] flex justify-between items-center"><h3 className="font-black text-sm flex items-center gap-1.5"><Icon name="folder" className="w-4 h-4 text-[#00d2d3]"/> Pesanan Tertahan (Draft)</h3><button onClick={() => setShowDraftListModal(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <div className="p-4 flex-1 overflow-y-auto space-y-2.5 text-xs">
                  {draftOrders.length === 0 ? (<p className="text-center py-8 text-slate-400">Belum ada pesanan yang ditahan.</p>) : (
                    draftOrders.map(d => (
                      <div key={d.id} className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                        <div>
                          <p className="font-extrabold text-sm">{d.name}</p>
                          <p className="text-[10px] text-slate-400 mt-0.5">{d.cart.length} macam barang • {d.date}</p>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <button onClick={() => { setDraftOrders(draftOrders.filter(item => item.id !== d.id)); showToast('Draft pesanan dihapus'); }} className="p-2 text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-xl cursor-pointer"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                          <button onClick={() => loadDraft(d)} className="px-3 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-bold cursor-pointer shadow-md">Buka</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal Diskon Total Transaksi */}
          {showDiscountModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
              <div className={`rounded-3xl w-full max-w-xs p-5 space-y-3 border shadow-2xl ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Beri Diskon Total</h3><button onClick={() => setShowDiscountModal(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <div className="space-y-3 pt-1">
                  <div>
                    <label className="text-[11px] font-bold text-slate-400 mb-1 block">Persentase Diskon (%)</label>
                    <input type="number" autoFocus min="0" max="100" placeholder="0 - 100" value={discountInput} onChange={(e) => setDiscountInput(e.target.value)} className={`w-full p-3 border rounded-xl text-center text-xl font-black outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-[#00d2d3]' : 'bg-slate-50'}`} />
                  </div>
                  <button onClick={() => {
                    const val = parseInt(discountInput, 10);
                    if (val >= 0 && val <= 100) {
                      setDiscount(val);
                      setShowDiscountModal(false);
                      setDiscountInput('');
                      showToast(`Diskon ${val}% diterapkan pada nota`);
                    } else {
                      showToast('Masukkan angka diskon 0 - 100%', 'error');
                    }
                  }} className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl text-xs shadow-md cursor-pointer">Terapkan Diskon</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Ganti Role */}
          {showRoleSwitcher && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm p-5 space-y-3 border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Ganti Peran Pengguna</h3><button onClick={() => setShowRoleSwitcher(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <div className="space-y-2 pt-2">
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Owner Toko', role: 'owner', avatar: 'OT' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>👑 Owner (Akses Penuh)</span><Icon name="shield-check" className="w-4 h-4 text-indigo-400"/></button>
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Admin Toko', role: 'admin', avatar: 'AT' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>💼 Admin Toko</span><Icon name="user-check" className="w-4 h-4 text-cyan-400"/></button>
                  <button onClick={() => handleRoleSwitchRequest({ name: 'Kasir POS', role: 'kasir', avatar: 'KP' })} className={`w-full p-3 rounded-2xl border text-left flex justify-between items-center font-bold text-xs cursor-pointer ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}><span>🛒 Kasir (POS)</span><Icon name="lock" className="w-4 h-4 text-slate-400"/></button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Verifikasi Password Role */}
          {authModal.show && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-sm p-5 space-y-3 border ${theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white'}`}>
                <div className="flex justify-between items-center"><h3 className="font-black text-sm">Verifikasi Password</h3><button onClick={() => setAuthModal({ show: false, targetRole: null, password: '' })} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button></div>
                <form onSubmit={handleAuthSubmit} className="space-y-3 pt-2">
                  <input type="password" required autoFocus placeholder="Password role..." value={authModal.password} onChange={(e) => setAuthModal({...authModal, password: e.target.value})} className={`w-full p-3.5 border rounded-2xl text-center text-lg font-bold outline-none ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60] text-white' : ''}`} />
                  <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl text-xs shadow-md cursor-pointer">Masuk</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Nota Struk */}
          {viewingTransaction && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className={`rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden border shadow-2xl ${
                theme === 'dark' ? 'bg-[#181b3b] border-[#2a2f60] text-white' : 'bg-white border-slate-200'
              }`}>
                <div className={`p-4 border-b flex justify-between items-center ${theme === 'dark' ? 'bg-[#21254d] border-[#2a2f60]' : 'bg-slate-50'}`}>
                  <h3 className="font-black text-sm">Nota Transaksi #{viewingTransaction.id}</h3>
                  <button onClick={() => setViewingTransaction(null)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400"/></button>
                </div>
                <div className="p-5 flex-1 overflow-y-auto space-y-3 text-xs">
                  <div className={`text-center pb-2 border-b border-dashed ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-300'}`}>
                    <h4 className="font-black text-sm uppercase">{storeSettings.name}</h4>
                    <p className="text-slate-400 text-[10px]">{storeSettings.address}</p>
                    <p className="text-[10px] text-slate-400 mt-1">{viewingTransaction.date} • Kasir: {viewingTransaction.cashier}</p>
                  </div>
                  <div className={`space-y-1.5 border-b border-dashed pb-2 ${theme === 'dark' ? 'border-[#2a2f60]' : 'border-slate-300'}`}>
                    {(viewingTransaction.items || []).map((i, idx) => (
                      <div key={idx} className="flex justify-between"><span>{i.product.name} ({i.qty}x)</span><span className="font-bold">{formatMoney((i.product.price - (Number(i.discountRp)||0)) * i.qty)}</span></div>
                    ))}
                  </div>
                  <div className="space-y-1 pt-1 font-semibold">
                    <div className="flex justify-between"><span>Total:</span><span className="font-black text-sm text-[#00d2d3]">{formatMoney(viewingTransaction.total)}</span></div>
                    <div className="flex justify-between text-[11px] text-slate-400"><span>Bayar ({viewingTransaction.paymentMethod}):</span><span>{formatMoney(viewingTransaction.cash)}</span></div>
                    {viewingTransaction.paymentMethod === 'Cash' && <div className="flex justify-between text-[11px] text-emerald-400"><span>Kembalian:</span><span>{formatMoney(viewingTransaction.change)}</span></div>}
                  </div>
                </div>
                <div className={`p-3 border-t grid grid-cols-3 gap-2 ${theme === 'dark' ? 'bg-[#0f1228] border-[#2a2f60]' : 'bg-slate-50'}`}>
                  <button onClick={() => {
                    let text = `*NOTA - ${storeSettings.name}*\nNo: ${viewingTransaction.id}\nTotal: ${formatMoney(viewingTransaction.total)}\n\nTerima kasih!`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                  }} className="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-md cursor-pointer"><Icon name="message-circle" className="w-3.5 h-3.5"/> WA</button>
                  <button onClick={() => window.print()} className="py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-md cursor-pointer"><Icon name="printer" className="w-3.5 h-3.5"/> Cetak</button>
                  {currentUser.role === 'owner' ? (
                    <button onClick={() => {
                      const trxToDel = viewingTransaction;
                      setViewingTransaction(null);
                      setDeleteTransactionModal({ show: true, transaction: trxToDel, restoreStock: true });
                    }} className="py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-md cursor-pointer"><Icon name="trash-2" className="w-3.5 h-3.5"/> Hapus</button>
                  ) : (
                    <div className="flex items-center justify-center text-[10px] text-slate-400 font-bold">Akses Kasir</div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal Konfirmasi Hapus Transaksi (Owner Only) */}
          {deleteTransactionModal.show && deleteTransactionModal.transaction && (
